<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Pixelify Sans', sans-serif;
        }
        
        body {
            transition: background-color 0.5s ease;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 1;
            will-change: transform;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        @media (max-width: 768px) {
            body::before {
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
            }
        }
        
        .pixel-corners {
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .pixel-border {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8fafc 100%);
        }

        .pixel-border::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 4px;
            background: linear-gradient(135deg, #334155, #64748b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            will-change: transform;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-squish {
            animation: squish-click 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
        }

        @keyframes squish-click {
            0%   { transform: scale(1, 1); }
            25%  { transform: scale(1.05, 0.93); }
            50%  { transform: scale(0.97, 1.04); }
            75%  { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            font-weight: 900;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(10deg); opacity: 0; }
        }

        .disco-bg {
            animation: disco-flash 0.5s infinite;
        }
        
        @keyframes disco-flash {
            0% { background-color: #fecdd3; }
            25% { background-color: #ddd6fe; }
            50% { background-color: #bae6fd; }
            75% { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }

        .floating-star {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatStar linear infinite;
            opacity: 0.7;
        }

        @keyframes floatStar {
            0% {
                transform: translateY(-100px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        .roblox-chat {
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 0;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            max-width: 320px;
            text-align: left;
            border: 4px solid #334155;
            pointer-events: none;
            word-wrap: break-word;
        }

        .pixel-button {
            position: relative;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border-radius: 0;
        }

        .pixel-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .pixel-button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .pixel-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 4px solid #334155;
            font-family: 'Pixelify Sans', monospace;
            border-radius: 0;
        }

        .pixel-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 4px solid #334155;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
            border-radius: 0;
        }

        .stat-display {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 3px solid #64748b;
            padding: 8px 16px;
            border-radius: 0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .stat-display {
                padding: 6px 12px;
            }
        }

        .pixel-badge {
            border: 3px solid;
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
        }

        .pixel-badge-large {
            border: 3px solid;
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        @media (max-width: 768px) {
            .pixel-badge-large {
                min-height: 42px;
                padding: 6px 12px;
            }
        }


        .health-bar {
            background: #cbd5e1;
            border: 3px solid #1e293b;
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .health-bar-fill {
            background: linear-gradient(to bottom, #ef4444, #dc2626);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .market-item {
            background: white;
            border: 4px solid #64748b;
            transition: all 0.1s ease;
        }

        .market-item:hover:not(.disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            border-color: #334155;
        }

        .inventory-slot {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4px solid #94a3b8;
            position: relative;
            aspect-ratio: 1;
            transition: all 0.1s ease;
        }

        .inventory-slot.has-item {
            border-color: #475569;
            background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%);
        }

        .inventory-slot:hover:not(.disabled) {
            transform: scale(1.05);
            border-color: #334155;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .pixel-shadow {
            box-shadow: 
                4px 4px 0 rgba(0,0,0,0.1),
                8px 8px 0 rgba(0,0,0,0.05);
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes rankUpPop {
            0%   { transform: scale(0.5); opacity: 0; }
            60%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes rankUpFadeOut {
            0%   { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .rankup-overlay {
            animation: rankUpFadeOut 3s ease forwards;
        }
        .rankup-icon {
            animation: rankUpPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }

        .action-button {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 4px solid #334155;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }

        .action-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .action-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .stat-display {
                width: 100%;
                text-align: center;
                padding: 6px 12px;
            }
            
            .action-button {
                width: 100%;
                max-width: none !important;
            }
            
            header .pixel-card {
                flex-direction: column !important;
                align-items: center !important;
            }
            
            header .pixel-card > div:first-child {
                width: 100%;
                justify-content: center !important;
                flex-wrap: wrap;
                gap: 0.5rem !important;
            }
            
            header .pixel-card > div:last-child {
                width: 100%;
                justify-content: center !important;
            }
            
            .gubby-container {
                width: 60vw !important;
                height: 60vw !important;
                max-width: 300px;
                max-height: 300px;
            }
            
            .pixel-badge {
                font-size: 10px;
                padding: 5px 12px;
            }
            
            .market-item {
                padding: 1rem !important;
            }
            
            .market-item p {
                font-size: 0.75rem !important;
            }
            
            .inventory-slot {
                padding: 0.75rem !important;
            }
        }

        /* ── DARK MODE ─────────────────────────────── */
        body.dark-mode {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
        }
        body.dark-mode .bg-white { background-color: #1e293b !important; }
        body.dark-mode .bg-slate-50 { background-color: #1e293b !important; }
        body.dark-mode .bg-slate-100 { background-color: #263248 !important; }
        body.dark-mode .bg-amber-50 { background-color: #292215 !important; }
        body.dark-mode .bg-rose-50 { background-color: #2d1a1a !important; }
        body.dark-mode .bg-violet-50 { background-color: #1e1a2e !important; }
        body.dark-mode .bg-emerald-50 { background-color: #0f2a1a !important; }
        body.dark-mode .pixel-card { background-color: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .action-button { background-color: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .text-slate-900 { color: #f1f5f9 !important; }
        body.dark-mode .text-slate-700 { color: #cbd5e1 !important; }
        body.dark-mode .text-slate-600 { color: #94a3b8 !important; }
        body.dark-mode .text-slate-500 { color: #64748b !important; }
        body.dark-mode .border-slate-200 { border-color: #334155 !important; }
        body.dark-mode .border-slate-300 { border-color: #475569 !important; }
        body.dark-mode input, body.dark-mode textarea {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }

        /* ── LARGE TEXT ─────────────────────────────── */
        body.large-text { font-size: 110% !important; }
        body.large-text .text-xs { font-size: 0.85rem !important; }
        body.large-text .text-sm { font-size: 1rem !important; }

        /* ── REDUCED MOTION ─────────────────────────── */
        body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }

        /* ── SETTINGS GRID LAYOUT ───────────────────── */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 480px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <style>
        /* Landscape overlay - only shows on phones in portrait mode */
        #landscape-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0f172a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .rotate-phone {
            animation: rotatePhone 1.5s ease-in-out infinite alternate;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }

    </style>
</head>

        function getAudioCtx() {
            if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        }

        function playTone({ type = 'sine', freq = 440, freq2 = null, gain = 0.18, attack = 0.01, decay = 0.12, duration = 0.15 } = {}) {
            if (!state.soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, ctx.currentTime + duration);
                g.gain.setValueAtTime(0, ctx.currentTime);
                g.gain.linearRampToValueAtTime(gain, ctx.currentTime + attack);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + attack + decay);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration + 0.05);
            } catch(e) {}
        }

        function playNoise({ gain = 0.08, duration = 0.1, hipass = 800 } = {}) {
            if (!state.soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const bufSize = ctx.sampleRate * duration;
                const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = hipass;
                const g = ctx.createGain();
                g.gain.setValueAtTime(gain, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                src.connect(filter); filter.connect(g); g.connect(ctx.destination);
                src.start();
            } catch(e) {}
        }

        function getPermanentMult() {
            // Sum all equipped permanent boost multipliers (only one can be equipped at a time, but use highest owned)
            const equippedId = state.equippedPermBoost;

        function buySpecialItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;
            if (state.inventory[itemId] > 0) return; // already owned
            const price = getItemPrice(item);
            if (state.gold < price) return;
            updateState({
                gold: state.gold - price,
                inventory: { ...state.inventory, [itemId]: 1 }
            });

            if (!equippedId) return null;
            return SHOP_ITEMS.find(i => i.id === equippedId && i.isSkin) || null;
        }

        function getItemPrice(item) {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const priceMod = world ? world.priceMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            return (item.baseCost * priceMod * 1.25) / rate;
        }

        function getAscensionCost() {
            const rate = CONVERSION_RATES[state.theme];
            const baseCost = 600;
            const multiplier = 1.2;
            const basePrestigeCost = Math.floor(baseCost * Math.pow(multiplier, state.prestigeLevel));
            return basePrestigeCost / rate;
        }

        function formatLargeNumber(n, decimals) {
            if (decimals === undefined) decimals = 2;
            if (isNaN(n) || !isFinite(n)) return '0';
            if (n >= 1e12) {
                const exp = Math.floor(Math.log10(Math.abs(n)));
                const mantissa = n / Math.pow(10, exp);
                return mantissa.toFixed(1) + 'e+' + exp;
            }
            return n.toLocaleString(undefined, { maximumFractionDigits: decimals });
        }

        function formatCost(cost) {
            if (cost >= 1e12) {
                const exp = Math.floor(Math.log10(Math.abs(cost)));
                const mantissa = cost / Math.pow(10, exp);
                return mantissa.toFixed(1) + 'e+' + exp;
            }
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key === 'Enter') {
                const cmdText = e.target.value.trim();
                if (!cmdText) return;
                
                const parts = cmdText.split(' ');
                const command = parts[0].toLowerCase();
                let message = "";
                let changes = {};
                
                if (command === '/money') {
                    const amt = parseFloat(parts[1]) || 0;
                    changes.gold = state.gold + amt;
                    message = `Money added: ${amt}`;
                } else if (command === '/rebirth') {
                    const lvl = parseInt(parts[1]);
                    if (!isNaN(lvl)) {
                        changes.prestigeLevel = lvl;
                        message = "Prestige level set to " + lvl;
                    } else {
                        message = "Usage: /rebirth [n]";
                    }
                } else if (command === '/give') {
                    const sub = parts[1]?.toLowerCase();
                    if (sub === 'xpsurge') {
                        const newInv = { ...state.inventory };
                        newInv['xpmult'] = (newInv['xpmult'] || 0) + 1;
                        changes.inventory = newInv;
                        message = 'Gave 1x XP Surge item. Use it from Storage to activate.';
                    } else if (sub === 'all') {
                        const newInv = { ...state.inventory };
                        SHOP_ITEMS.forEach(i => { newInv[i.id] = (newInv[i.id] || 0) + 1; });
                        changes.inventory = newInv;
                        message = `Gave 1x of all ${SHOP_ITEMS.length} items`;
                    } else {
                        const rawArgs = parts.slice(1);
                        const lastArg = rawArgs[rawArgs.length - 1];
                        const amount = !isNaN(parseInt(lastArg)) && SHOP_ITEMS.every(i => i.id !== lastArg.toLowerCase()) ? parseInt(lastArg) : 1;
                        const itemArgs = (amount > 1 || (!isNaN(parseInt(lastArg)) && !SHOP_ITEMS.find(i => i.id === lastArg.toLowerCase()))) ? rawArgs.slice(0, -1) : rawArgs;
                        const ids = itemArgs.slice(0, 25).map(a => a.toLowerCase());
                        if (ids.length === 0) {
                            message = 'Usage: /give [id] [amt] | /give [id1] [id2]... | /give all';
                        } else {
                            const newInv = { ...state.inventory };
                            const given = [], missing = [];
                            ids.forEach(id => {
                                const item = SHOP_ITEMS.find(i => i.id === id);
                                if (item) { newInv[id] = (newInv[id] || 0) + amount; given.push(item.name); }
                                else missing.push(id);
                            });
                            if (given.length) changes.inventory = newInv;
                            message = given.length ? `Gave ${amount}x: ${given.join(', ')}${missing.length ? ` | Not found: ${missing.join(', ')}` : ''}` : `Error: No valid items found (${missing.join(', ')})`;
                        }
                    }
                } else if (command === '/quest') {
                    if (state.activeQuests.length > 0) {
                        const updatedQuests = state.activeQuests.map(q => ({ ...q, completed: true, progress: q.target }));
                        changes.activeQuests = updatedQuests;
                        message = `All ${state.activeQuests.length} active quest(s) completed! Claim them in the Quests menu.`;
                    } else {
                        message = "No active quests to complete";
                    }
                } else if (command === '/xp') {
                    const amt = parseInt(parts[1]);
                    if (isNaN(amt)) {
                        message = "Usage: /xp [n]";
                    } else if (state.rankedTier === 'master') {
                        const newMasterXP = (state.masterXP || 0) + amt;
                        changes.masterXP = newMasterXP;
                        message = `Added ${amt} Master XP (total: ${newMasterXP})`;
                    } else {
                        // Award XP — can promote from unranked to ranked too
                        let newXP = (state.rankedXP || 0) + amt;
                        let newTier = state.rankedTier;
                        let promoted = [];
                        let promoting = true;

                        if (!newTier) {
                            // Unranked: need UNRANKED_XP_NEEDED to reach Beginner I
                            if (newXP >= UNRANKED_XP_NEEDED) {
                                newXP -= UNRANKED_XP_NEEDED;
                                newTier = RANKED_TIERS[0].id;
                                promoted.push(RANKED_TIERS[0].name);
                            }
                        }

                        while (promoting && newTier) {
                            const tier = getRankedTierById(newTier);
                            const next = getNextRankedTier(newTier);
                            if (tier && next && tier.xpNeeded && newXP >= tier.xpNeeded) {
                                newXP -= tier.xpNeeded;
                                newTier = next.id;
                                promoted.push(next.name);
                            } else { promoting = false; }
                        }
                        changes.rankedXP = newXP;
                        changes.rankedTier = newTier;
                        message = promoted.length ? `Added ${amt} XP — ranked up to ${promoted[promoted.length-1]}!` : `Added ${amt} XP (total: ${newXP})`;
                        if (promoted.length) {
                            changes.showRankUp = true;
                            changes.rankUpTier = newTier;
                            setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
                        }
                    }
                } else if (command === '/rank') {
                    const sub = parts[1]?.toLowerCase();
                    if (sub === 'up') {
                        if (!state.rankedTier) {
                            changes.rankedTier = RANKED_TIERS[0].id;
                            changes.showRankUp = true;
                            changes.rankUpTier = RANKED_TIERS[0].id;
                            message = `Rank set to ${RANKED_TIERS[0].name}`;
                        } else {
                            const next = getNextRankedTier(state.rankedTier);
                            if (next) {
                                changes.rankedTier = next.id;
                                changes.rankedXP = 0;
                                changes.showRankUp = true;
                                changes.rankUpTier = next.id;
                                message = `Ranked up to ${next.name}`;
                            } else {
                                message = "Already at Master rank";
                            }
                        }
                    } else if (sub) {
                        const query = parts.slice(1).join(' ').toLowerCase();
                        const match = RANKED_TIERS.find(t => t.name.toLowerCase() === query || t.id === query.replace(' ', '_'));
                        if (match) {
                            changes.rankedTier = match.id;
                            changes.rankedXP = 0;
                            changes.showRankUp = true;
                            changes.rankUpTier = match.id;
                            message = `Rank set to ${match.name}`;
                        } else {
                            message = `Unknown rank. Options: ${RANKED_TIERS.map(t => t.name).join(', ')}`;
                        }
                    } else {
                        message = "Usage: /rank [tier name] | /rank up";

            if (e.cancelable) e.preventDefault();

            const currentPower = (state.prestigeLevel + 1) * (state.activeBuff ? state.activeBuff.power : 1) * getPermanentMult();

            state.lifetimeClicks = state.lifetimeClicks + 1;

        function sellClicks() {
            if (state.clicks > 0) {
                const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
                const currentWorldMult = currentWorld ? currentWorld.mult : 1;
                const luckyActive = (state.luckyMultUntil || 0) > Date.now();
                const luckyBonus = luckyActive ? (state.luckyMultValue || 1) : 1;
                const totalGoldEarned = (state.clicks * state.marketMultiplier * currentWorldMult * luckyBonus) / CONVERSION_RATES[state.theme];
                updateState({
                    gold: state.gold + totalGoldEarned,
                    clicks: 0,
                    notification: { title: "MARKET SOLD!", message: `Sold for ${formatLargeNumber(totalGoldEarned, 2)} ${CURRENCIES[state.theme].name}s!${luckyActive ? ` (x${state.luckyMultValue} Lucky!)` : ''}`, type: "success" }
                });
                SFX.sell();
                checkQuestProgress();
            }
        }

        function doGamble() {
            const amount = parseFloat(state.gambleInput);
            if (isNaN(amount) || amount <= 0) {
                updateState({ gambleResult: { win: null, message: 'Enter a valid amount.' } });
                return;
            }
            if (amount > state.gold) {
                updateState({ gambleResult: { win: null, message: "You don't have enough currency." } });
                return;
            }
            const win = Math.random() < 0.5;
            let newGold;
            let message;
            if (win) {
                newGold = state.gold + amount;
                message = `You won! +${formatLargeNumber(amount, 2)} ${CURRENCIES[state.theme].name}s`;
            } else {
                const penalty = amount + (state.gold * 0.2);
                newGold = Math.max(0, state.gold - penalty);
                message = `You lost! -${formatLargeNumber(penalty, 2)} ${CURRENCIES[state.theme].name}s`;
            }
            updateState({ gold: newGold, gambleResult: { win, message }, gambleInput: '' });
            if (win) {
                SFX.gambleWin();
                const updatedQuests = state.activeQuests.map(q => {
                    if (q.type === 'gamble_wins' && !q.completed) {
                        const newProgress = (q.progress || 0) + 1;
                        return { ...q, progress: newProgress, completed: newProgress >= q.target };
                    }
                    return q;
                });
                updateState({ activeQuests: updatedQuests });
                setTimeout(() => checkQuestProgress(), 50);
            } else {
                SFX.gambleLose();
            }
        }

            const conversionFactor = oldRate / newRate;

                gold: newGold,
                showTravelModal: false,
                notification: {

                    message: `Welcome to Chapter ${destination.chapter}: ${destination.name}. Currency converted to ${CURRENCIES[destId].name}s!`,

        function generateQuest() {
            const availableQuests = QUESTS.filter(q => {
                const alreadyActive = state.activeQuests.some(aq => aq.id === q.id);
                if (alreadyActive) return false;
                const alreadyCompleted = state.completedQuestIds.includes(q.id);
                if (alreadyCompleted) return false;
                if (q.type === 'prestige' && state.prestigeLevel < 1) return true;
                if (q.type === 'clicks' && state.lifetimeClicks < q.target) return true;
                if (q.type === 'gold') return true;
                if (q.type === 'buy' || q.type === 'use' || q.type === 'buy_and_use') return true;
                if (q.type === 'gamble_wins') return true;
                return false;
            });
            if (availableQuests.length > 0) {
                const quest = availableQuests[Math.floor(Math.random() * availableQuests.length)];
                const newQuest = { ...quest, progress: 0, completed: false };
                updateState({ activeQuests: [...state.activeQuests, newQuest] });
            }
        }

        function checkQuestProgress() {
            if (state.activeQuests.length === 0) return;
            
            let updated = false;
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.completed) return quest;
                
                let progress = quest.progress || 0;
                
                switch (quest.type) {
                    case 'clicks':
                        progress = state.lifetimeClicks;
                        break;
                    case 'gold':
                        progress = state.gold;
                        break;
                    case 'prestige':
                        progress = state.prestigeLevel;
                        break;
                    case 'buy':
                    case 'use':
                    case 'gamble_wins':
                    case 'buy_and_use':
                        break;
                }
                
                let targetToCheck = quest.target;
                if (quest.type === 'gold') {
                    targetToCheck = quest.target / CONVERSION_RATES[state.theme];
                }
                
                const isComplete = progress >= targetToCheck;
                if (isComplete && !quest.completed) {
                    updated = true;
                    return { ...quest, progress, completed: true };
                } else if (progress !== quest.progress) {
                    updated = true;
                    return { ...quest, progress };
                }
                return quest;
            });
            
            if (updated) {
                updateState({ activeQuests: updatedQuests }, true);
            }
        }

        function claimQuest(questId) {
            const quest = state.activeQuests.find(q => q.id === questId);
            if (!quest || !quest.completed) return;
            
            const rewardInCurrency = quest.reward / CONVERSION_RATES[state.theme];
            const xpGained = getQuestXP(quest);
            const isMaster = state.rankedTier === 'master';

            let newMasterXP = state.masterXP || 0;
            let newXP = state.rankedXP || 0;
            let newTier = state.rankedTier;
            let rankUpTier = null;

            if (isMaster) {
                newMasterXP += xpGained;
            } else {
                // Always award XP (even to unranked players)
                newXP += xpGained;
                let promoting = true;

                // Check if unranked and can reach Beginner I
                if (!newTier && newXP >= UNRANKED_XP_NEEDED) {
                    newXP -= UNRANKED_XP_NEEDED;
                    newTier = RANKED_TIERS[0].id;
                    rankUpTier = newTier;
                }

                // Continue promoting through tiers
                while (promoting && newTier) {
                    const tier = getRankedTierById(newTier);
                    const next = getNextRankedTier(newTier);
                    if (tier && next && tier.xpNeeded && newXP >= tier.xpNeeded) {
                        newXP -= tier.xpNeeded;
                        newTier = next.id;
                        rankUpTier = next.id;
                    } else {
                        promoting = false;
                    }
                }
            }

            const updates = { 
                gold: state.gold + rewardInCurrency,
                completedQuests: state.completedQuests + 1,
                activeQuests: state.activeQuests.filter(q => q.id !== questId),
                completedQuestIds: [...state.completedQuestIds, questId],
                rankedXP: newXP,
                rankedTier: newTier,
                masterXP: newMasterXP,
            };

            if (rankUpTier) {
                updates.showRankUp = true;
                updates.rankUpTier = rankUpTier;
                updates.xpBoostUntil = Date.now() + 20 * 60 * 1000;
            }
            updateState(updates);
            if (rankUpTier) SFX.rankUp(); else SFX.questClaim();

            if (rankUpTier) {
                setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
            }
        }

        function claimMasterReward(milestoneIdx) {

            if ((state.claimedMasterRewards || []).includes(milestoneIdx)) return;
            if ((state.masterXP || 0) < milestone.xp) return;

            updateState({
                inventory: newInv,
                claimedMasterRewards: [...(state.claimedMasterRewards || []), milestoneIdx],
                luckyMultUntil: Date.now() + 20 * 1000,
                luckyMultValue: luckyMult,

        // Settings toggle keys that default to true (on) when undefined
        const SETTINGS_DEFAULT_ON = ['floatingStars','soundEnabled','clickSound','showParticles','questNotif','marketFlash'];

        function getSetting(key) {
            return state[key] !== false;
        }

        function toggleSetting(key) {
            const nowOn = getSetting(key);
            const newVal = !nowOn;
            state[key] = newVal;

            if (key === 'largeText') {
                if (newVal) document.body.classList.add('large-text');
                else document.body.classList.remove('large-text');
            }
            if (key === 'floatingStars') {
                if (!newVal) document.querySelectorAll('.floating-star').forEach(s => s.remove());
                else createFloatingStars();
            }

            const btn = document.querySelector('[data-setting="' + key + '"]');
            if (btn) {
                const cfg = SETTINGS_ROWS.find(r => r.key === key);
                if (cfg) {
                    btn.className = 'flex items-center justify-between border-4 ' + (newVal ? cfg.onBorder + ' ' + cfg.onBg : 'border-slate-200 bg-slate-50') + ' p-4 w-full text-left hover:border-slate-400 transition-colors';
                    const icon = btn.querySelector('i[data-lucide]');
                    if (icon) icon.className = 'w-5 h-5 flex-shrink-0 ' + (newVal ? cfg.onIcon : 'text-slate-400');
                    const knob = btn.querySelector('.setting-knob');
                    const track = btn.querySelector('.setting-track');
                    if (track) track.className = 'w-14 h-7 border-4 setting-track ' + (newVal ? cfg.onTrack : 'bg-slate-300 border-slate-500') + ' relative flex-shrink-0';
                    if (knob) knob.style.left = newVal ? 'calc(100% - 20px)' : '2px';
                }
            }
        }

        const SETTINGS_ROWS = [
            { key:'largeText',     icon:'type',                 label:'Large Text',         desc:'Bigger UI font size',                    onBorder:'border-blue-400',   onBg:'bg-blue-50',   onIcon:'text-blue-500',   onTrack:'bg-blue-500 border-blue-700'    },
            { key:'floatingStars', icon:'sparkles',             label:'Floating Stars',     desc:'Decorative falling stars',               onBorder:'border-violet-400', onBg:'bg-violet-50', onIcon:'text-violet-500', onTrack:'bg-violet-500 border-violet-700'},
            { key:'soundEnabled',  icon:'volume-2',             label:'Sound Effects',      desc:'All game sounds',                        onBorder:'border-amber-400',  onBg:'bg-amber-50',  onIcon:'text-amber-500',  onTrack:'bg-amber-500 border-amber-700'  },
            { key:'clickSound',    icon:'mouse-pointer-click',  label:'Click Sounds',       desc:'Sound on every click',                   onBorder:'border-rose-400',   onBg:'bg-rose-50',   onIcon:'text-rose-500',   onTrack:'bg-rose-500 border-rose-700'    },
            { key:'showParticles', icon:'zap',                  label:'Click Particles',    desc:'Show +N pop on click',                   onBorder:'border-amber-400',  onBg:'bg-amber-50',  onIcon:'text-amber-500',  onTrack:'bg-amber-500 border-amber-700'  },
            { key:'questNotif',    icon:'bell',                 label:'Quest Notifs',       desc:'Pop-up on quest complete',               onBorder:'border-indigo-400', onBg:'bg-indigo-50', onIcon:'text-indigo-500', onTrack:'bg-indigo-500 border-indigo-700'},
            { key:'marketFlash',   icon:'trending-up',          label:'Market Flash',       desc:'Pulse sell at high rates',               onBorder:'border-emerald-400',onBg:'bg-emerald-50',onIcon:'text-emerald-500',onTrack:'bg-emerald-500 border-emerald-700'},
        ];

        function renderSettings() {
            function pxToggle(on, cfg) {
                return '<div class="w-14 h-7 border-4 setting-track ' + (on ? cfg.onTrack : 'bg-slate-300 border-slate-500') + ' relative flex-shrink-0">'
                     + '<div class="setting-knob absolute top-0.5 w-4 h-4 bg-white border-2 border-slate-300" style="transition:left 0.15s ease;left:' + (on ? 'calc(100% - 20px)' : '2px') + '"></div>'
                     + '</div>';
            }

            const DISPLAY_KEYS  = ['largeText','floatingStars'];
            const AUDIO_KEYS    = ['soundEnabled','clickSound'];
            const GAMEPLAY_KEYS = ['showParticles','questNotif','marketFlash'];

            function settingBtn(key) {
                const cfg = SETTINGS_ROWS.find(function(r){ return r.key === key; });
                if (!cfg) return '';
                const on = getSetting(key);
                return '<button data-setting="' + key + '" onclick="toggleSetting(\'' + key + '\')" '
                   + 'class="flex items-center justify-between border-4 ' + (on ? cfg.onBorder + ' ' + cfg.onBg : 'border-slate-200 bg-slate-50') + ' p-4 w-full text-left hover:border-slate-400 transition-colors">'
                   + '<div class="flex items-center gap-3 min-w-0">'
                   + '<i data-lucide="' + cfg.icon + '" class="w-5 h-5 flex-shrink-0 ' + (on ? cfg.onIcon : 'text-slate-400') + '"></i>'
                   + '<div class="min-w-0"><p class="font-black uppercase text-sm text-slate-900 leading-tight">' + cfg.label + '</p>'
                   + '<p class="text-xs font-bold text-slate-500 leading-tight truncate">' + cfg.desc + '</p></div></div>'
                   + pxToggle(on, cfg)
                   + '</button>';
            }

            return '<div class="fixed inset-0 z-[95] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md modal-backdrop" onclick="if(event.target===event.currentTarget)updateState({showSettings:false})">'

                + '<div class="bg-slate-800 px-6 py-4 flex justify-between items-center flex-shrink-0">'
                + '<div><p class="text-slate-400 text-xs font-black uppercase tracking-widest">Options</p>'

                + '<button onclick="updateState({showSettings:false})" class="text-white/60 hover:text-white text-2xl font-black leading-none">✕</button>'
                + '</div>'
                + '<div class="p-6 overflow-y-auto flex-1">'
                + '<div class="grid grid-cols-2 gap-x-4 gap-y-3" style="grid-template-columns: 1fr 1fr;">'
                + '<p class="text-xs font-black uppercase text-slate-400 tracking-widest col-span-2 mt-0 mb-1">Display</p>'
                + DISPLAY_KEYS.map(settingBtn).join('')
                + '<p class="text-xs font-black uppercase text-slate-400 tracking-widest col-span-2 mt-3 mb-1">Audio</p>'
                + AUDIO_KEYS.map(settingBtn).join('')
                + '<p class="text-xs font-black uppercase text-slate-400 tracking-widest col-span-2 mt-3 mb-1">Gameplay</p>'
                + GAMEPLAY_KEYS.map(settingBtn).join('')
                + '</div>'
                + '<button onclick="updateState({showSettings:false})" class="w-full text-slate-400 font-black uppercase text-xs hover:text-slate-600 pt-4 pb-1">Close</button>'
                + '</div></div></div>';
        }

        function renderMarketContent() {
            const isSpecial = state.marketCategory === 'special' || state.marketCategory === 'perm_boost' || state.marketCategory === 'skin';
            const isBoosts = !isSpecial || state.marketCategory === null;
            const showingBoostsTab = !state.marketCategory || (state.marketCategory !== 'special' && state.marketCategory !== 'perm_boost' && state.marketCategory !== 'skin');
            const showingSpecialTab = state.marketCategory === 'special' || state.marketCategory === 'perm_boost' || state.marketCategory === 'skin';

            const tabBar = `
                <div class="flex gap-2 mb-5 -mx-0">

            // Special Items tab
            if (showingSpecialTab) {
                const permItems = SHOP_ITEMS.filter(i => i.category === 'perm_boost');

                        </div>
                        ${permItems.map(item => {

                            <div class="flex items-center justify-between p-4 border-4 mb-2 bg-white ${owned ? 'border-emerald-400 bg-emerald-50' : canAfford ? 'border-slate-200' : 'border-slate-100 opacity-60'}">
                                <div class="flex-1 mr-3">
                                    <p class="font-black text-base uppercase text-slate-900">${item.name}</p>
                                    <p class="text-xs font-bold text-slate-400">${item.description}</p>
                                    ${!owned ? `<p class="text-xs font-bold text-indigo-600 mt-0.5">Cost: ${formatLargeNumber(price, 0)} ${CURRENCIES[state.theme]?.name || 'Gold'}</p>` : ''}
                                </div>
                                <button onclick="${owned ? '' : `buySpecialItem('${item.id}')`}" class="pixel-button shrink-0 ${owned ? 'bg-emerald-500 border-emerald-700 text-white cursor-default' : canAfford ? 'bg-indigo-600 border-indigo-800 text-white hover:bg-indigo-500' : 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">
                                    ${owned ? 'OWNED' : 'BUY'}
                                </button>
                            </div>`;

                        <div class="mt-3 mb-1">

                        </div>
                        ${skinItems.map(item => {
                            const price = getItemPrice(item);
                            const canAfford = state.gold >= price;
                            const owned = state.inventory[item.id] > 0;
                            return `
                            <div class="flex items-center justify-between p-4 border-4 mb-2 bg-white ${owned ? 'border-emerald-400 bg-emerald-50' : canAfford ? 'border-slate-200' : 'border-slate-100 opacity-60'}">
                                <img src="${item.img}" class="w-14 h-14 object-contain mr-3 shrink-0" style="image-rendering:pixelated;" />
                                <div class="flex-1 mr-3">
                                    <p class="font-black text-base uppercase text-slate-900">${item.name}</p>
                                    <p class="text-xs font-bold text-slate-400">${item.description}</p>
                                    ${!owned ? `<p class="text-xs font-bold text-indigo-600 mt-0.5">Cost: ${formatLargeNumber(price, 0)} ${CURRENCIES[state.theme]?.name || 'Gold'}</p>` : ''}
                                </div>
                                <button onclick="${owned ? '' : `buySpecialItem('${item.id}')`}" class="pixel-button shrink-0 ${owned ? 'bg-emerald-500 border-emerald-700 text-white cursor-default' : canAfford ? 'bg-indigo-600 border-indigo-800 text-white hover:bg-indigo-500' : 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">
                                    ${owned ? 'OWNED' : 'BUY'}
                                </button>
                            </div>`;
                        }).join('')}
                    </div>
                `;
            }

            // Boosts tab

            if (!state.marketCategory) {
                return tabBar + `
                    <div class="flex flex-col gap-3">
                        <button onclick="updateState({marketCategory: 'small'})" class="${catBtnBase} border-blue-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-blue-600">Small Boosts</span>

                        <button onclick="updateState({marketCategory: 'medium'})" class="${catBtnBase} border-purple-500">

                        <button onclick="updateState({marketCategory: 'large'})" class="${catBtnBase} border-orange-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-orange-600">Large Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'op'})" class="${catBtnBase} border-red-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-red-600">OP Boosts</span>
                        </button>
                    </div>
                `;
            }

            const itemsToShow = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return tabBar + `
                <div class="flex flex-col gap-3">
                    <button onclick="updateState({marketCategory: null})" class="w-full text-left text-xs font-black uppercase text-slate-500 mb-2 flex items-center gap-2 hover:text-slate-700 tracking-wider">← Back to Boost Categories</button>
                    ${itemsToShow.map(item => {
                        const price = getItemPrice(item);
                        const canAfford = state.gold >= price;
                        return `
                            <div class="flex items-center justify-between p-4 border-4 bg-white ${canAfford ? 'border-slate-300' : 'border-slate-200 opacity-50'}">
                                <div class="text-left flex-1 mr-3">

                                    <p class="text-xs font-bold text-indigo-600 mt-0.5">${formatLargeNumber(price, 0)} ${CURRENCIES[state.theme]?.name || 'Gold'}s</p>
                                </div>
                                <button onclick="event.stopPropagation(); openItemPopup('${item.id}')" class="pixel-button shrink-0 ${canAfford ? 'bg-indigo-600 border-indigo-800 text-white' : 'bg-slate-200 border-slate-300 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">
                                    BUY
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStorageContent() {
            const categories = {
                small: { name: 'Small Boosts', color: 'blue', items: [] },
                medium: { name: 'Medium Boosts', color: 'purple', items: [] },
                large: { name: 'Large Boosts', color: 'orange', items: [] },
                op: { name: 'OP Boosts', color: 'red', items: [] },
                perm_boost: { name: 'Permanent Boosts', color: 'yellow', items: [] },
                skin: { name: 'Skins', color: 'pink', items: [] },
            };

            SHOP_ITEMS.forEach(item => {
                if (state.inventory[item.id] > 0 && categories[item.category]) {
                    categories[item.category].items.push(item);
                }
            });

            const colorClasses = {
                blue:   'border-blue-500 bg-blue-50',
                purple: 'border-purple-500 bg-purple-50',
                orange: 'border-orange-500 bg-orange-50',
                red:    'border-red-500 bg-red-50',
                yellow: 'border-yellow-500 bg-yellow-50',
                pink:   'border-pink-500 bg-pink-50',
            };

            const hasAnything = Object.values(categories).some(cat => cat.items.length > 0);

            return `
                <div class="flex flex-col gap-6">
                    ${Object.entries(categories).map(([catKey, catData]) => {
                        if (catData.items.length === 0) return '';
                        return `
                            <div class="border-4 ${colorClasses[catData.color]} p-4 sm:p-6">
                                <h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                                <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4">
                                    ${catData.items.map(item => {
                                        const isPermBoost = item.category === 'perm_boost';
                                        const isSkinItem = item.isSkin;
                                        const isEquipped = isPermBoost
                                            ? state.equippedPermBoost === item.id
                                            : isSkinItem
                                                ? state.equippedSkin === item.id
                                                : state.equippedItem === item.id;
                                        const isPermanent = item.permanent;
                                        return `
                                        <button 
                                            onclick="${isPermanent ? `toggleEquip('${item.id}')` : `useItem('${item.id}')`}" 
                                            ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} 
                                            class="inventory-slot p-4 has-item ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} ${isEquipped ? 'ring-4 ring-emerald-500' : ''}"
                                        >
                                            ${!isPermanent ? `<span class="absolute -top-2 -right-2 bg-slate-900 border-3 border-white text-white text-sm font-black w-8 h-8 flex items-center justify-center" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">${state.inventory[item.id]}</span>` : ''}
                                            ${isEquipped ? `<span class="absolute -top-2 -left-2 bg-emerald-500 border-3 border-white text-white text-xs font-black px-2 py-1" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">ON</span>` : ''}
                                            ${item.img ? `<img src="${item.img}" class="w-10 h-10 object-contain mx-auto mb-1" style="image-rendering:pixelated;" />` : ''}
                                            <p class="text-sm font-black uppercase text-slate-900 text-center leading-tight mt-1">${item.name}</p>
                                            <p class="text-xs font-bold text-slate-500 text-center mt-1">${item.description || (item.power > 1 ? item.power + 'x' : 'Special')}</p>
                                        </button>
                                    `}).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                    
                    ${!hasAnything ? `
                        <div class="text-center py-16">
                            <p class="text-3xl font-black text-slate-400 uppercase mb-2">Storage Empty</p>
                            <p class="text-lg font-bold text-slate-400">Buy items from the Marketplace!</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        
    </script>
</body>
</html>
