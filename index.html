<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Pixelify Sans', sans-serif;
        }
        
        body {
            transition: background-color 0.5s ease;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 1;
        }
        
        .pixel-corners {
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .pixel-border {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8fafc 100%);
        }

        .pixel-border::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 4px;
            background: linear-gradient(135deg, #334155, #64748b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            transition: transform 0.05s ease-out;
            will-change: transform;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        .gubby-container:active {
            transform: scale(0.85, 1.2);
        }

        .animate-squish {
            animation: squish-click 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes squish-click {
            0% { transform: scale(1, 1); }
            20% { transform: scale(0.75, 1.3); }
            40% { transform: scale(1.1, 0.9); }
            60% { transform: scale(0.95, 1.05); }
            80% { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            font-weight: 900;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(10deg); opacity: 0; }
        }

        .disco-bg {
            animation: disco-flash 0.5s infinite;
        }
        
        @keyframes disco-flash {
            0% { background-color: #fecdd3; }
            25% { background-color: #ddd6fe; }
            50% { background-color: #bae6fd; }
            75% { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }

        .roblox-chat {
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 0;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            max-width: 320px;
            text-align: left;
            border: 4px solid #334155;
            pointer-events: none;
            word-wrap: break-word;
        }

        .pixel-button {
            position: relative;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border-radius: 0;
        }

        .pixel-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .pixel-button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .pixel-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 4px solid #334155;
            font-family: 'Pixelify Sans', monospace;
            border-radius: 0;
        }

        .pixel-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 4px solid #334155;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
            border-radius: 0;
        }

        .stat-display {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 3px solid #64748b;
            padding: 8px 16px;
            border-radius: 0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .stat-display {
                padding: 6px 12px;
            }
        }

        .pixel-badge {
            border: 3px solid;
            padding: 6px 14px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
        }

        .health-bar {
            background: #cbd5e1;
            border: 3px solid #1e293b;
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .health-bar-fill {
            background: linear-gradient(to bottom, #ef4444, #dc2626);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .market-item {
            background: white;
            border: 4px solid #64748b;
            transition: all 0.1s ease;
        }

        .market-item:hover:not(.disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            border-color: #334155;
        }

        .inventory-slot {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4px solid #94a3b8;
            position: relative;
            aspect-ratio: 1;
            transition: all 0.1s ease;
        }

        .inventory-slot.has-item {
            border-color: #475569;
            background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%);
        }

        .inventory-slot:hover:not(.disabled) {
            transform: scale(1.05);
            border-color: #334155;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
            animation-play-state: running;
        }
        
        .float-animation.paused {
            animation-play-state: paused;
        }

        .pixel-shadow {
            box-shadow: 
                4px 4px 0 rgba(0,0,0,0.1),
                8px 8px 0 rgba(0,0,0,0.05);
        }

        .scanlines {
            position: relative;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .action-button {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 4px solid #334155;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }

        .action-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .action-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .stat-display {
                width: 100%;
                text-align: center;
                padding: 6px 12px;
            }
            
            .action-button {
                width: 100%;
                max-width: none !important;
            }
            
            header .pixel-card {
                flex-direction: column !important;
                align-items: center !important;
            }
            
            header .pixel-card > div:first-child {
                width: 100%;
                justify-content: center !important;
                flex-wrap: wrap;
                gap: 0.5rem !important;
            }
            
            header .pixel-card > div:last-child {
                width: 100%;
                justify-content: center !important;
            }
            
            .gubby-container {
                width: 60vw !important;
                height: 60vw !important;
                max-width: 300px;
                max-height: 300px;
            }
            
            .pixel-badge {
                font-size: 10px;
                padding: 5px 12px;
            }
            
            .market-item {
                padding: 1rem !important;
            }
            
            .market-item p {
                font-size: 0.75rem !important;
            }
            
            .inventory-slot {
                padding: 0.75rem !important;
            }
        }
    </style>
</head>
<body class="bg-emerald-50 overflow-x-hidden">
    <div id="root"></div>

    <script>
        const gubbyImgUrl = "https://static.wikia.nocookie.net/parasprunki-fanon/images/1/1e/Gubby.webp";
        
        const CURRENCIES = {
            plains: { name: 'Gold', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/star-coin-3d-icon-png-download-11254734.png' },
            hawaii: { name: 'Seashell', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/seashell-3d-icon-png-download-9708035.png' },
            starlight: { name: 'Star', icon: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Glowing-Star-3d-icon.png' },
            void: { name: 'Galaxy', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-3d-icon-png-download-6308179.png' }
        };

        const DESTINATIONS = [
            { id: 'plains', name: 'Gubby Plains', req: 0, mult: 1, priceMod: 1, prestigeMod: 1, color: 'bg-emerald-50', themeColor: '#f0fdf4', bgImage: 'https://cdnb.artstation.com/p/assets/images/images/053/135/427/original/pixel-jess-field-animation-final.gif?1661495887', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/grass-3d-icon-png-download-9405100.png' },
            { id: 'hawaii', name: 'Hawaii', req: 5, mult: 5, priceMod: 0.75, prestigeMod: 0.4, color: 'bg-green-100', themeColor: '#dcfce7', bgImage: 'https://i.pinimg.com/originals/5e/b7/28/5eb728f74875abdba6c3c44ace2399ff.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/beach-3d-icon-png-download-9708027.png' },
            { id: 'starlight', name: 'Starlight Sky', req: 10, mult: 15, priceMod: 0.5, prestigeMod: 0.16, color: 'bg-purple-100', themeColor: '#f5f3ff', bgImage: 'https://www.codedex.io/images/intermediate-python/intermediate-python.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/night-sky-3d-icon-png-download-11664446.png' },
            { id: 'void', name: 'The Void', req: 15, mult: 30, priceMod: 0.25, prestigeMod: 0.064, color: 'bg-blue-100', themeColor: '#eff6ff', bgImage: 'https://i.pinimg.com/originals/2b/93/c2/2b93c2d26ea042ef05ec0fc6dbac7de6.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-3d-icon-png-download-6308159.png' }
        ];

        const CONVERSION_RATES = {
            'plains': 1,
            'hawaii': 25,
            'starlight': 75,
            'void': 150
        };

        const SHOP_ITEMS = [
            { id: 'rainbow', name: 'Rainbow', category: 'small', baseCost: 100, power: 10, duration: 15, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/rainbow-3d-icon-png-download-4659629.png' },
            { id: 'mega', name: 'Mega', category: 'small', baseCost: 450, power: 25, duration: 12, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Glowing-Star-3d-icon.png' },
            { id: 'omega', name: 'Omega', category: 'small', baseCost: 1200, power: 120, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/diamond-3d-icon-png-download-8249311.png' },
            { id: 'oracle', name: 'Oracle', category: 'medium', baseCost: 5000, power: 0, duration: 25, img: 'https://static.vecteezy.com/system/resources/thumbnails/041/644/156/small/3d-stock-market-ticker-with-upward-trend-arrow-icon-png.png' },
            { id: 'godly', name: 'Godly', category: 'medium', baseCost: 15000, power: 400, duration: 20, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/king-crown-3d-icon-png-download-10707831.png' },
            { id: 'warp', name: 'Time Warp', category: 'medium', baseCost: 25000, power: 1, duration: 1, description: '+30s Battle', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/time-machine-3d-icon-png-download-8786172.png' },
            { id: 'legendary', name: 'Legendary', category: 'medium', baseCost: 75000, power: 1000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/gold-medal-3d-icon-png-download-11613166.png' },
            { id: 'mythic', name: 'Mythic', category: 'large', baseCost: 250000, power: 5000, duration: 9, img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSghOJb2-ZD1lymQCT1S_dYisQmoX1dIDYzdg&s' },
            { id: 'divine', name: 'Divine', category: 'large', baseCost: 1000000, power: 25000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/compass-astrology-3d-icon-png-download-13124447.png' },
            { id: 'celestial', name: 'Celestial', category: 'large', baseCost: 5000000, power: 100000, duration: 8, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/planets-3d-icon-png-download-11683976.png' },
            { id: 'void', name: 'Void', category: 'large', baseCost: 15000000, power: 500000, duration: 7, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-station-3d-icon-png-download-6308159.png' },
            { id: 'titan', name: 'Titan', category: 'op', baseCost: 100000000, power: 5000000, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/robot-3d-icon-png-download-7577797.png?f=webp' },
            { id: 'eternal', name: 'Eternal', category: 'op', baseCost: 500000000, power: 50000000, duration: 12, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/atom-3d-icon-png-download-5522651.png' },
            { id: 'infinite', name: 'Infinite', category: 'op', baseCost: 2500000000, power: 250000000, duration: 15, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Infinity-3d-icon.png' }
        ];

        let state = {
            clicks: 0,
            lifetimeClicks: 0,
            totalClicksSession: 0,
            gold: 0,
            activeBuff: null,
            theme: 'plains',
            showTravelModal: false,
            showMarketModal: false,
            showStorageModal: false,
            inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
            prestigeLevel: 0,
            peaceTreatyActive: false,
            marketMultiplier: 1,
            marketTrend: 'stable',
            marketQueue: [1.1, 0.8, 1.4],
            showOracle: false,
            isBattleActive: false,
            battleType: 'normal',
            battleHP: 0,
            maxBattleHP: 0,
            battleTimer: 0,
            normalBossCount: 0,
            megaBossCount: 0,
            marketCategory: null,
            notification: null,
            stickyChat: null,
            stickyChatUser: null,
            stickyChatTimer: 0,
            showAdmin: false,
            adminLog: [],
            discoEventTimer: 0
        };

        const PEACE_TREATY_COST = 10000000000; // 10 billion
        let titleClickCount = 0;
        let titleClickTimer = null;
        let squishTimeout = null;
        let lastNormalTriggered = 0;
        let lastMegaTriggered = 0;

        function updateState(newState, skipRender = false) {
            state = { ...state, ...newState };
            if (!skipRender) render();
        }

        function buyPeaceTreaty() {
            if (state.peaceTreatyActive) return;
            
            if (state.prestigeLevel < 1) {
                updateState({ notification: { title: "LOCKED", message: "Reach Prestige 1 to unlock Peace Treaty!", type: "info" } });
                return;
            }

            const treatyCost = getPeaceTreatyCost();
            if (state.gold >= treatyCost) {
                updateState({ 
                    peaceTreatyActive: true, 
                    gold: state.gold - treatyCost,
                    notification: { title: "PEACE SIGNED", message: "Peace Treaty activated! No more bosses will appear.", type: "success" }
                });
            }
        }

        function getPeaceTreatyCost() {
            const rate = CONVERSION_RATES[state.theme];
            return PEACE_TREATY_COST / rate;
        }

        function getItemPrice(item) {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const priceMod = world ? world.priceMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            // 25% more expensive
            return (item.baseCost * priceMod * 1.25) / rate;
        }

        function getAscensionCost() {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const prestigeMod = world ? world.prestigeMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            const basePrestigeCost = Math.floor(1000 * Math.pow(3, state.prestigeLevel));
            return (basePrestigeCost * prestigeMod) / rate;
        }

        function formatCost(cost) {
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key === 'Enter') {
                const cmdText = e.target.value.trim();
                if (!cmdText) return;
                
                const parts = cmdText.split(' ');
                const command = parts[0].toLowerCase();
                let message = "";
                let changes = {};
                
                if (command === '/all') {
                    // Execute all commands with generous amounts
                    changes.marketMultiplier = 2.0;
                    changes.peaceTreatyActive = false;
                    changes.stickyChat = "Admin activated all commands!";
                    changes.stickyChatUser = "@System";
                    changes.stickyChatTimer = 15;
                    changes.gold = state.gold + 100000000000; // Add 100B
                    changes.prestigeLevel = state.prestigeLevel + 5;
                    changes.discoEventTimer = 60;
                    
                    // Give 10 of each item
                    const newInventory = { ...state.inventory };
                    SHOP_ITEMS.forEach(item => {
                        newInventory[item.id] = (newInventory[item.id] || 0) + 10;
                    });
                    changes.inventory = newInventory;
                    
                    changes.notification = { 
                        title: "ALL COMMANDS EXECUTED!", 
                        message: "Money, prestige, items, and events activated!", 
                        type: "success" 
                    };
                    
                    message = "Executed ALL commands: +100B money, +5 prestige, +10 all items, 2x market, disco event, peace reset";
                } else if (command === '/multiplier') {
                    const amt = parseFloat(parts[1]);
                    if (!isNaN(amt)) {
                        changes.marketMultiplier = amt;
                        message = `Market Rate forced to ${amt}x`;
                    } else {
                        message = "Error: Use /multiplier <amount>";
                    }
                } else if (command === '/resetpeace') {
                    changes.peaceTreatyActive = false;
                    message = "Peace Treaty reset.";
                } else if (command === '/talk') {
                    const targetUser = parts[1];
                    if (targetUser && targetUser.startsWith('@')) {
                        const talkMsg = parts.slice(2).join(' ');
                        if (talkMsg) {
                            changes.stickyChat = talkMsg;
                            changes.stickyChatUser = targetUser;
                            changes.stickyChatTimer = 15;
                            message = `${targetUser}: ${talkMsg}`;
                        } else {
                            message = "Error: Missing message content.";
                        }
                    } else {
                        message = "Error: Invalid username. Use /talk <@username> <message>";
                    }
                } else if (command === '/money') {
                    const amt = parseFloat(parts[1]) || 0;
                    changes.gold = state.gold + amt;
                    message = `Money added: ${amt}`;
                } else if (command === '/rebirth') {
                    const lvl = parseInt(parts[1]) || 0;
                    changes.prestigeLevel = lvl;
                    message = `Prestige level set to ${lvl}`;
                } else if (command === '/give') {
                    const itemId = parts[1]?.toLowerCase();
                    const amount = parseInt(parts[2]) || 1;
                    const itemExists = SHOP_ITEMS.find(i => i.id === itemId);
                    
                    if (itemExists) {
                        changes.inventory = { ...state.inventory, [itemId]: (state.inventory[itemId] || 0) + amount };
                        message = `Gave ${amount}x ${itemExists.name}`;
                    } else {
                        message = `Error: Item '${itemId}' not found`;
                    }
                } else if (command === '/event') {
                    const eventName = parts[1]?.toLowerCase();
                    const eventTime = parseInt(parts[2]) || 30;
                    
                    if (eventName === 'disco') {
                        changes.discoEventTimer = eventTime;
                        changes.notification = { title: "DISCO PARTY!", message: `Everything is crazy for ${eventTime}s!`, type: "info" };
                        message = `Started event: DISCO (${eventTime}s)`;
                    } else {
                        message = `Error: Event '${eventName}' not available. Try: disco`;
                    }
                } else if (command === '/clear') {
                    updateState({ adminLog: [] });
                    e.target.value = "";
                    return;
                } else {
                    message = "Usage: /all, /multiplier [n], /talk <@user> [msg], /money [n], /rebirth [n], /give [id] [amt], /event [name] [time]";
                }

                const newLogs = [message, ...state.adminLog].slice(0, 10);
                updateState({ ...changes, adminLog: newLogs });
                e.target.value = "";
            }
        }

        function triggerTitleClick() {
            titleClickCount++;
            clearTimeout(titleClickTimer);
            if (titleClickCount >= 3) {
                updateState({ showAdmin: !state.showAdmin });
                titleClickCount = 0;
            } else {
                titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
            }
        }

        function triggerBattle(type) {
            const isMega = type === 'mega';
            let hp = isMega ? 45 + (state.megaBossCount * 10) : 20 + (state.normalBossCount * 10);
            const baseTime = isMega ? 45 : 30;
            updateState({
                battleType: type,
                battleHP: hp,
                maxBattleHP: hp,
                battleTimer: baseTime + (isMega ? (state.megaBossCount * 8) : (state.normalBossCount * 5)),
                isBattleActive: true
            });
        }

        function endBattle(won) {
            const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
            const currentWorldMult = currentWorld ? currentWorld.mult : 1;
            if (won) {
                const reward = (state.maxBattleHP * (state.battleType === 'mega' ? 6 : 3) * currentWorldMult) / CONVERSION_RATES[state.theme];
                updateState({
                    isBattleActive: false,
                    gold: state.gold + reward,
                    megaBossCount: state.battleType === 'mega' ? state.megaBossCount + 1 : state.megaBossCount,
                    normalBossCount: state.battleType === 'normal' ? state.normalBossCount + 1 : state.normalBossCount,
                    notification: { title: "VICTORY!", message: `Reward: ${reward.toFixed(2)} ${CURRENCIES[state.theme].name}s.`, type: "success" }
                });
            } else {
                updateState({ isBattleActive: false, notification: { title: "BATTLE FAILED!", message: `The boss escaped!`, type: "error" } });
            }
        }

        function handleMainClick(e) {
            if (e.cancelable) e.preventDefault();
            if (e.type === 'mousedown' && e.button !== 0) return;
            
            const currentPower = (state.prestigeLevel + 1) * (state.activeBuff && !['warp', 'oracle'].includes(state.activeBuff.id) ? state.activeBuff.power : 1);
            
            // Trigger squish animation
            const gubbyElement = document.querySelector('.gubby-container');
            if (gubbyElement) {
                gubbyElement.classList.remove('animate-squish');
                void gubbyElement.offsetWidth; // Force reflow
                gubbyElement.classList.add('animate-squish');
            }

            if (state.isBattleActive) {
                const nextHP = state.battleHP - currentPower;
                if (nextHP <= 0) {
                    endBattle(true);
                    return; 
                } else {
                    state.battleHP = nextHP;
                    state.totalClicksSession = state.totalClicksSession + 1;
                    state.lifetimeClicks = state.lifetimeClicks + 1;
                    render();
                }
            } else {
                state.clicks = state.clicks + currentPower;
                state.totalClicksSession = state.totalClicksSession + 1;
                state.lifetimeClicks = state.lifetimeClicks + 1;
                render();
            }

            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const particle = document.createElement('div');
            particle.className = `particle ${state.isBattleActive ? 'text-red-600' : 'text-amber-400'}`;
            particle.style.cssText = `
                left: ${clientX}px;
                top: ${clientY}px;
                font-size: 3rem;
                font-weight: 900;
                text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            `;
            particle.textContent = state.isBattleActive ? 'HIT!' : `+${currentPower}`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }

        function sellClicks() {
            if (!state.isBattleActive && state.clicks > 0) {
                const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
                const currentWorldMult = currentWorld ? currentWorld.mult : 1;
                const totalGoldEarned = (state.clicks * state.marketMultiplier * currentWorldMult) / CONVERSION_RATES[state.theme];
                updateState({
                    gold: state.gold + totalGoldEarned,
                    clicks: 0,
                    notification: { title: "MARKET SOLD!", message: `Sold for ${totalGoldEarned.toFixed(2)} ${CURRENCIES[state.theme].name}s!`, type: "success" }
                });
            }
        }

        function travelTo(destId) {
            const oldRate = CONVERSION_RATES[state.theme];
            const newRate = CONVERSION_RATES[destId];
            const conversionFactor = oldRate / newRate;
            const newGold = state.gold * conversionFactor;
            updateState({
                theme: destId,
                gold: newGold,
                showTravelModal: false,
                notification: { 
                    title: "LOCATION CHANGED", 
                    message: `Welcome to ${DESTINATIONS.find(d => d.id === destId).name}. Currency converted to ${CURRENCIES[destId].name}s!`, 
                    type: "info" 
                }
            });
        }

        function ascend() {
            const cost = getAscensionCost();
            if (state.gold >= cost) {
                lastMegaTriggered = 0;
                lastNormalTriggered = 0;
                updateState({
                    prestigeLevel: state.prestigeLevel + 1,
                    gold: 0,
                    clicks: 0,
                    totalClicksSession: 0,
                    inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
                    activeBuff: null,
                    showOracle: false,
                    notification: { title: "ASCENDED!", message: `Prestige ${state.prestigeLevel + 1} reached!`, type: "success" }
                });
            }
        }

        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;
            const price = getItemPrice(item);
            if (state.gold >= price) {
                updateState({
                    gold: state.gold - price,
                    inventory: { ...state.inventory, [itemId]: (state.inventory[itemId] || 0) + 1 }
                });
            }
        }

        function useItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (state.inventory[itemId] > 0 && !state.activeBuff) {
                if (itemId === 'warp' && state.isBattleActive) {
                    updateState({ 
                        battleTimer: state.battleTimer + 30, 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 },
                        showStorageModal: false 
                    });
                } else if (itemId === 'oracle') {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        activeBuff: { ...item, timeLeft: item.duration }, 
                        showOracle: true,
                        showStorageModal: false 
                    });
                } else if (itemId !== 'warp') {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        activeBuff: { ...item, timeLeft: item.duration },
                        showStorageModal: false 
                    });
                }
            }
        }

        setInterval(() => {
            const nextRate = 0.5 + (Math.random() * 1.25);
            state.marketMultiplier = state.marketQueue[0];
            state.marketTrend = state.marketQueue[0] > state.marketMultiplier ? 'up' : 'down';
            state.marketQueue = [...state.marketQueue.slice(1), nextRate];
            
            // Only re-render if admin console and modals are not open
            if (!state.showAdmin && !state.showMarketModal && !state.showStorageModal) {
                render();
            }
        }, 7000);

        setInterval(() => {
            let shouldRender = false;
            
            if (state.activeBuff) {
                if (state.activeBuff.timeLeft <= 1) { 
                    state.activeBuff = null;
                    state.showOracle = false;
                    shouldRender = true;
                } else { 
                    state.activeBuff.timeLeft = state.activeBuff.timeLeft - 1;
                    // Update buff timer display without full re-render
                    const buffDisplay = document.querySelector('.buff-timer-display');
                    if (buffDisplay) {
                        buffDisplay.textContent = `${state.activeBuff.name} (${state.activeBuff.timeLeft}s)`;
                    }
                }
            }
            if (state.isBattleActive) {
                if (state.battleTimer <= 1) {
                    endBattle(false);
                    return; // endBattle already calls render
                } else { 
                    state.battleTimer = state.battleTimer - 1;
                    // Update battle timer display without full re-render
                    const battleTimerDisplay = document.querySelector('.battle-timer-display');
                    if (battleTimerDisplay) {
                        battleTimerDisplay.textContent = `BOSS BATTLE - ${state.battleTimer}s`;
                    }
                }
            }
            if (state.discoEventTimer > 0) {
                state.discoEventTimer = state.discoEventTimer - 1;
                // Update disco timer display without full re-render
                const discoDisplay = document.querySelector('.disco-timer-display');
                if (discoDisplay) {
                    discoDisplay.textContent = `Disco Mode: ${state.discoEventTimer}s`;
                }
                if (state.discoEventTimer === 0) {
                    shouldRender = true; // Re-render to remove disco background
                }
            }
            if (state.stickyChatTimer > 0) {
                state.stickyChatTimer = state.stickyChatTimer - 1;
                if (state.stickyChatTimer === 0) {
                    state.stickyChat = null;
                    state.stickyChatUser = null;
                }
            }
            
            // Only render if admin console is not open, no modals are open, and something important changed
            if (shouldRender && !state.showAdmin && !state.showMarketModal && !state.showStorageModal) {
                render();
            }
        }, 1000);

        setInterval(() => {
            if (state.totalClicksSession > 0 && !state.isBattleActive && !state.peaceTreatyActive) {
                if (state.totalClicksSession >= lastMegaTriggered + 750) {
                    lastMegaTriggered = state.totalClicksSession;
                    triggerBattle('mega');
                } else if (state.totalClicksSession >= lastNormalTriggered + 250) {
                    lastNormalTriggered = state.totalClicksSession;
                    triggerBattle('normal');
                }
            }
        }, 1000);

        function render() {
            const root = document.getElementById('root');
            const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
            const currentCurrency = CURRENCIES[state.theme];

                document.body.className = "disco-bg overflow-x-hidden";

                document.body.style.backgroundColor = currentWorld?.themeColor || '#f0fdf4';

                    document.body.style.setProperty('--bg-image', `url('${currentWorld.bgImage}')`);

                peaceTagColor = "bg-emerald-500 border-emerald-700";
                peaceTagText = "Peaceful";

                peaceTagColor = "bg-yellow-500 border-yellow-700"; 
                peaceTagText = "Peace (Available)";

            root.innerHTML = `

                                ${state.adminLog.map(log => `<p class="text-xs font-mono text-emerald-400 py-1 border-b border-slate-800">> ${log}</p>`).join('')}
                            </div>

                            />
                        </div>
                    ` : ''}

                    <button onclick="updateState({showTravelModal: true})" class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[60] w-12 h-12 sm:w-14 sm:h-14 bg-white pixel-button flex items-center justify-center group">
                        <i data-lucide="map" class="text-indigo-500 w-6 h-6 sm:w-7 sm:h-7 group-hover:rotate-12 transition-transform"></i>
                    </button>

                    ${state.notification ? `
                        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-backdrop">
                            <div class="bg-white p-6 sm:p-10 pixel-card max-w-sm w-full text-center modal-content">
                                <h4 class="font-black text-2xl sm:text-3xl mb-3 uppercase text-slate-900">${state.notification.title}</h4>
                                <p class="text-slate-600 mb-6 sm:mb-8 font-bold text-base sm:text-lg">${state.notification.message}</p>
                                <button onclick="updateState({notification: null})" class="w-full bg-slate-900 text-white py-3 sm:py-4 px-6 font-black uppercase pixel-button text-base sm:text-lg">OK!</button>
                            </div>
                        </div>
                    ` : ''}

                    ${state.showTravelModal ? `
                        <div class="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md modal-backdrop">
                            <div class="bg-white p-6 sm:p-10 pixel-card max-w-4xl w-full modal-content max-h-[90vh] overflow-y-auto">
                                <h4 class="font-black text-2xl sm:text-3xl text-center mb-6 sm:mb-10 uppercase text-slate-900">Travel Map</h4>
                                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5">
                                    ${DESTINATIONS.map(dest => {
                                        const isLocked = state.prestigeLevel < dest.req;
                                        const isCurrent = state.theme === dest.id;
                                        return `
                                            <button 
                                                ${isLocked ? 'disabled' : ''}
                                                onclick="travelTo('${dest.id}')"
                                                class="p-6 sm:p-8 flex flex-col items-center gap-2 sm:gap-3 transition-all border-4 ${isLocked ? 'opacity-40 grayscale bg-slate-100 border-slate-400' : `bg-white ${isCurrent ? 'border-indigo-500' : 'border-slate-600'} hover:border-slate-900`} ${!isLocked && !isCurrent ? 'hover:-translate-y-1' : ''}"
                                                style="box-shadow: ${isLocked ? '0 0 0' : '4px 4px 0 rgba(0,0,0,0.2)'};"
                                            >
                                                <span class="font-black text-sm sm:text-lg uppercase text-center">${dest.name}</span>
                                                <div class="flex flex-col items-center gap-1">
                                                    <span class="text-xs sm:text-sm font-black text-indigo-600">x${dest.mult} Profit</span>
                                                    ${isLocked ? `<span class="text-xs font-bold text-red-600 mt-1">Prestige ${dest.req}</span>` : ''}
                                                </div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                <button onclick="updateState({showTravelModal: false})" class="w-full mt-6 sm:mt-10 text-slate-500 font-black uppercase text-xs sm:text-sm hover:text-slate-700">Close</button>
                            </div>
                        </div>
                    ` : ''}

                    ${state.showMarketModal ? `
                        <div class="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md modal-backdrop" onclick="if(event.target === event.currentTarget) updateState({showMarketModal: false, marketCategory: null})">
                            <div class="bg-white p-6 sm:p-10 pixel-card max-w-3xl w-full max-h-[90vh] overflow-y-auto modal-content">
                                <div class="flex justify-between items-center mb-6 sm:mb-8">
                                    <h4 class="font-black text-2xl sm:text-3xl uppercase text-slate-900">Marketplace</h4>
                                    <button onclick="updateState({showMarketModal: false, marketCategory: null})" class="text-slate-500 hover:text-slate-900 text-3xl font-black">✕</button>
                                </div>
                                
                                <div class="mb-4 sm:mb-6 p-3 sm:p-4 bg-amber-100 border-4 border-amber-500">
                                    <p class="text-xs sm:text-sm font-black text-amber-900 text-center">⚠️ PEACE TREATY: ${formatCost(peaceTreatyCost)} ${currentCurrency.name}s</p>
                                    ${state.peaceTreatyActive ? `
                                        <p class="text-xs font-bold text-emerald-700 text-center mt-1">✓ Active - No more boss battles!</p>
                                    ` : `
                                        <button 
                                            onclick="buyPeaceTreaty()" 
                                            class="w-full mt-3 pixel-button ${state.gold >= peaceTreatyCost ? 'bg-emerald-500 border-emerald-700' : 'bg-slate-400 border-slate-600'} text-white px-6 py-3 text-sm font-black uppercase"
                                        >
                                            ${state.gold >= peaceTreatyCost ? 'Purchase Peace Treaty' : 'Cannot Afford'}
                                        </button>
                                    `}
                                </div>

                                ${renderMarketContent()}
                            </div>
                        </div>
                    ` : ''}

                    ${state.showStorageModal ? `
                        <div class="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md modal-backdrop">
                            <div class="bg-white p-6 sm:p-10 pixel-card max-w-4xl w-full max-h-[90vh] overflow-y-auto modal-content">
                                <div class="flex justify-between items-center mb-6 sm:mb-8">
                                    <div>
                                        <h4 class="font-black text-2xl sm:text-3xl uppercase text-slate-900">Item Storage</h4>

                                    </div>
                                    <button onclick="updateState({showStorageModal: false})" class="text-slate-500 hover:text-slate-900 text-2xl sm:text-3xl font-black">✕</button>
                                </div>
                                
                                ${renderStorageContent()}
                            </div>
                        </div>
                    ` : ''}

                    <header class="z-20 w-full max-w-6xl flex flex-col items-center gap-4 mt-2 mb-4 px-4">
                        <h1 onclick="triggerTitleClick()" class="text-4xl sm:text-6xl font-black tracking-tight uppercase ${currentWorld?.id === 'starlight' || currentWorld?.id === 'void' ? 'text-white' : 'text-slate-900'} cursor-help active:scale-95 transition-transform text-center" style="text-shadow: 4px 4px 0 rgba(0,0,0,0.3);">Gubby Clicker</h1>
                        
                        <div class="flex gap-3 items-center flex-wrap justify-center">
                            <span class="pixel-badge bg-indigo-600 border-indigo-800 text-white">Prestige ${state.prestigeLevel}</span>
                            <span class="pixel-badge bg-amber-500 border-amber-700 text-white">${currentWorld?.name}</span>
                            <span class="pixel-badge ${peaceTagColor} text-white">${peaceTagText}</span>
                        </div>
                        
                        <div class="w-full pixel-card px-4 sm:px-8 py-4 sm:py-6 flex flex-col sm:flex-row flex-wrap items-center justify-between gap-4 sm:gap-6">
                            <div class="flex items-center gap-3 sm:gap-6 flex-1 flex-wrap justify-center w-full sm:w-auto sm:justify-start">
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Clicks</p>
                                    <span class="text-lg sm:text-2xl font-black text-slate-900">${state.clicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Total</p>
                                    <span class="text-lg sm:text-2xl font-black text-slate-900">${state.lifetimeClicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Market</p>
                                    <span class="text-lg sm:text-2xl font-black ${state.marketMultiplier >= 1.2 ? 'text-emerald-600' : 'text-slate-900'}">${state.marketMultiplier.toFixed(2)}x</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">${currentCurrency.name}s</p>
                                    <span class="text-lg sm:text-2xl font-black text-slate-900">${state.gold.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>

                                <button onclick="ascend()" ${state.gold < currentPrestigeCost || state.isBattleActive ? 'disabled' : ''} class="px-4 sm:px-6 py-2 sm:py-3 font-black uppercase text-xs sm:text-sm tracking-widest transition-all pixel-button ${state.gold >= currentPrestigeCost ? 'bg-indigo-600 border-indigo-800 text-white' : 'bg-slate-200 border-slate-400 text-slate-400'}">Ascend<br/><span class="text-xs">(${formatCost(currentPrestigeCost)})</span></button>
                                <button onclick="sellClicks()" ${state.isBattleActive ? 'disabled' : ''} class="px-6 sm:px-8 py-3 sm:py-4 font-black uppercase text-base sm:text-lg tracking-widest transition-all pixel-button ${state.marketMultiplier >= 1.2 ? 'bg-emerald-400 border-emerald-600 text-white animate-pulse' : 'bg-yellow-400 border-yellow-600 text-slate-900'}">Sell!</button>
                            </div>
                        </div>
                    </header>

                    <main class="z-10 relative flex flex-col items-center justify-center w-full mb-4">
                        <div class="h-16 mb-2 flex flex-col items-center justify-end">
                            ${state.showOracle ? `
                                <div class="flex gap-3 mb-3">
                                    ${state.marketQueue.map((rate, idx) => `
                                        <div class="bg-slate-900 text-white px-4 py-2 border-3 border-indigo-500 flex flex-col items-center" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.3);">
                                            <span class="text-xs font-bold uppercase opacity-70">Future ${idx + 1}</span>
                                            <span class="text-sm font-black ${rate >= 1.2 ? 'text-emerald-400' : rate <= 0.8 ? 'text-red-400' : 'text-white'}">${rate.toFixed(2)}x</span>

                                    `).join('')}
                                </div>

                            ${state.isBattleActive ? `
                                <div class="flex flex-col items-center w-80">

                                    <div class="health-bar w-full">
                                        <div class="health-bar-fill" style="width: ${(state.battleHP / state.maxBattleHP) * 100}%"></div>
                                    </div>
                                    <span class="text-xs font-bold text-slate-600 mt-1">${state.battleHP} / ${state.maxBattleHP} HP</span>
                                </div>
                            ` : state.activeBuff ? `<div class="bg-white px-8 py-3 border-4 border-indigo-500" style="box-shadow: 4px 4px 0 rgba(0,0,0,0.2);"><span class="buff-timer-display text-sm font-black uppercase text-indigo-600 tracking-wider">${state.activeBuff.name} (${state.activeBuff.timeLeft}s)</span></div>` : ''}
                        </div>

                        <div

                            ontouchstart="handleMainClick(event)"

                        </div>
                        ${state.discoEventTimer > 0 ? `<div class="mt-6 px-6 py-2 bg-white/90 border-4 border-purple-600 font-black text-purple-600 uppercase animate-pulse" style="box-shadow: 4px 4px 0 rgba(0,0,0,0.2);"><span class="disco-timer-display">Disco Mode: ${state.discoEventTimer}s</span></div>` : ''}
                    </main>

                    <div class="z-20 w-full max-w-2xl flex gap-6 justify-center mb-8 px-4 flex-col sm:flex-row">
                        <button onclick="updateState({showMarketModal: true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 max-w-xs">
                            <i data-lucide="shopping-cart" class="w-12 h-12 text-indigo-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Marketplace</span>
                            <span class="text-xs font-bold text-slate-500">Buy Power-Ups</span>
                        </button>

                        <button onclick="updateState({showStorageModal: true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 max-w-xs relative">
                            <i data-lucide="package" class="w-12 h-12 text-emerald-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Storage</span>
                            <span class="text-xs font-bold text-slate-500">${totalItems} Items</span>
                            ${totalItems > 0 ? `
                                <span class="absolute -top-2 -right-2 bg-red-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.3);">${totalItems}</span>
                            ` : ''}
                        </button>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
            
            if (activeElementId === 'admin-input') {
                const newInput = document.getElementById('admin-input');
                if (newInput) {
                    newInput.focus();
                    newInput.value = previousValue;
                    newInput.setSelectionRange(previousValue.length, previousValue.length);
                }
            } else if (state.showAdmin && !activeElementId) {
                const newInput = document.getElementById('admin-input');
                if (newInput) newInput.focus();
            }
        }

        function renderMarketContent() {
            const catBtnBase = "w-full bg-white border-4 p-4 sm:p-6 flex justify-center items-center transition-all group market-item";
            if (!state.marketCategory) {
                return `
                    <div class="flex flex-col gap-4">
                        <button onclick="updateState({marketCategory: 'small'})" class="${catBtnBase} border-blue-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-blue-600">Small Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'medium'})" class="${catBtnBase} border-purple-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-purple-600">Medium Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'large'})" class="${catBtnBase} border-orange-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-orange-600">Large Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'op'})" class="${catBtnBase} border-red-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-red-600">OP Boosts</span>
                        </button>
                    </div>
                `;
            }

            const itemsToShow = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return `
                <div class="flex flex-col gap-4">
                    <button onclick="updateState({marketCategory: null})" class="w-full text-left text-xs font-black uppercase text-slate-500 mb-2 flex items-center gap-2 hover:text-slate-700 tracking-wider">← Back to Categories</button>
                    ${itemsToShow.map(item => {
                        const price = getItemPrice(item);
                        const canAfford = state.gold >= price;
                        return `
                            <button onclick="buyItem('${item.id}')" class="market-item flex items-center justify-between p-4 sm:p-5 bg-white ${canAfford ? 'border-slate-600' : 'disabled border-slate-400'} ${canAfford ? '' : 'opacity-50'}">
                                <div class="flex items-center gap-3 sm:gap-4">
                                    <div class="text-left">
                                        <p class="font-black text-sm sm:text-lg uppercase text-slate-900">${item.name}</p>
                                        <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">Power: ${item.power > 1 ? item.power + 'x' : 'Special'} | ${item.duration}s</p>
                                        ${item.description ? `<p class="text-xs font-bold text-indigo-600 uppercase mt-1">${item.description}</p>` : ''}
                                    </div>
                                </div>
                                <span class="bg-slate-900 border-3 border-slate-700 text-white px-3 sm:px-5 py-2 sm:py-3 text-xs sm:text-sm font-black whitespace-nowrap" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.2);">${formatCost(price)}</span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStorageContent() {
            const categories = {
                small: { name: 'Small Boosts', color: 'blue', items: [] },
                medium: { name: 'Medium Boosts', color: 'purple', items: [] },
                large: { name: 'Large Boosts', color: 'orange', items: [] },
                op: { name: 'OP Boosts', color: 'red', items: [] }
            };

            SHOP_ITEMS.forEach(item => {
                if (state.inventory[item.id] > 0) {
                    categories[item.category].items.push(item);
                }
            });

            return `
                <div class="flex flex-col gap-6">
                    ${Object.entries(categories).map(([catKey, catData]) => {
                        if (catData.items.length === 0) return '';
                        
                        const colorClasses = {
                            blue: 'border-blue-500 bg-blue-50',
                            purple: 'border-purple-500 bg-purple-50',
                            orange: 'border-orange-500 bg-orange-50',
                            red: 'border-red-500 bg-red-50'
                        };

                        return `
                            <div class="border-4 ${colorClasses[catData.color]} p-4 sm:p-6">
                                <h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                                <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4">
                                    ${catData.items.map(item => `
                                        <button 
                                            onclick="useItem('${item.id}')" 
                                            ${state.activeBuff !== null && item.id !== 'warp' ? 'disabled' : ''} 
                                            class="inventory-slot p-4 has-item ${state.activeBuff !== null && item.id !== 'warp' ? 'disabled' : ''}"
                                        >
                                            <span class="absolute -top-2 -right-2 bg-slate-900 border-3 border-white text-white text-sm font-black w-8 h-8 flex items-center justify-center" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">${state.inventory[item.id]}</span>
                                            <p class="text-sm font-black uppercase text-slate-900 text-center leading-tight mt-2">${item.name}</p>
                                            ${item.description ? `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.description}</p>` : `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.power > 1 ? item.power + 'x' : 'Special'}</p>`}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                    
                    ${Object.values(categories).every(cat => cat.items.length === 0) ? `
                        <div class="text-center py-16">
                            <p class="text-3xl font-black text-slate-400 uppercase mb-2">Storage Empty</p>
                            <p class="text-lg font-bold text-slate-400">Buy items from the Marketplace!</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
