<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Pixelify Sans', sans-serif;
        }
        
        body {
            transition: background-color 0.5s ease;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 1;
        }
        
        .pixel-corners {
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .pixel-border {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8fafc 100%);
        }

        .pixel-border::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 4px;
            background: linear-gradient(135deg, #334155, #64748b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            will-change: transform;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-squish {
            animation: squish-click 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
        }

        @keyframes squish-click {
            0%   { transform: scale(1, 1); }
            25%  { transform: scale(1.05, 0.93); }
            50%  { transform: scale(0.97, 1.04); }
            75%  { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            font-weight: 900;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(10deg); opacity: 0; }
        }

        .disco-bg {
            animation: disco-flash 0.5s infinite;
        }
        
        @keyframes disco-flash {
            0% { background-color: #fecdd3; }
            25% { background-color: #ddd6fe; }
            50% { background-color: #bae6fd; }
            75% { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }

        .floating-star {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatStar linear infinite;
            opacity: 0.7;
        }

        @keyframes floatStar {
            0% {
                transform: translateY(-100px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        .roblox-chat {
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 0;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            max-width: 320px;
            text-align: left;
            border: 4px solid #334155;
            pointer-events: none;
            word-wrap: break-word;
        }

        .pixel-button {
            position: relative;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border-radius: 0;
        }

        .pixel-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .pixel-button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .pixel-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 4px solid #334155;
            font-family: 'Pixelify Sans', monospace;
            border-radius: 0;
        }

        .pixel-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 4px solid #334155;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
            border-radius: 0;
        }

        .stat-display {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 3px solid #64748b;
            padding: 8px 16px;
            border-radius: 0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .stat-display {
                padding: 6px 12px;
            }
        }

        .pixel-badge {
            border: 3px solid;
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
        }

        .pixel-badge-large {
            border: 3px solid;
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        @media (max-width: 768px) {
            .pixel-badge-large {
                min-height: 42px;
                padding: 6px 12px;
            }
        }


        .health-bar {
            background: #cbd5e1;
            border: 3px solid #1e293b;
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .health-bar-fill {
            background: linear-gradient(to bottom, #ef4444, #dc2626);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .market-item {
            background: white;
            border: 4px solid #64748b;
            transition: all 0.1s ease;
        }

        .market-item:hover:not(.disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            border-color: #334155;
        }

        .inventory-slot {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4px solid #94a3b8;
            position: relative;
            aspect-ratio: 1;
            transition: all 0.1s ease;
        }

        .inventory-slot.has-item {
            border-color: #475569;
            background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%);
        }

        .inventory-slot:hover:not(.disabled) {
            transform: scale(1.05);
            border-color: #334155;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .pixel-shadow {
            box-shadow: 
                4px 4px 0 rgba(0,0,0,0.1),
                8px 8px 0 rgba(0,0,0,0.05);
        }

        .scanlines {
            position: relative;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes rankUpPop {
            0%   { transform: scale(0.5); opacity: 0; }
            60%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes rankUpFadeOut {
            0%   { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .rankup-overlay {
            animation: rankUpFadeOut 3s ease forwards;
        }
        .rankup-icon {
            animation: rankUpPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }

        .action-button {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 4px solid #334155;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }

        .action-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .action-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .stat-display {
                width: 100%;
                text-align: center;
                padding: 6px 12px;
            }
            
            .action-button {
                width: 100%;
                max-width: none !important;
            }
            
            header .pixel-card {
                flex-direction: column !important;
                align-items: center !important;
            }
            
            header .pixel-card > div:first-child {
                width: 100%;
                justify-content: center !important;
                flex-wrap: wrap;
                gap: 0.5rem !important;
            }
            
            header .pixel-card > div:last-child {
                width: 100%;
                justify-content: center !important;
            }
            
            .gubby-container {
                width: 60vw !important;
                height: 60vw !important;
                max-width: 300px;
                max-height: 300px;
            }
            
            .pixel-badge {
                font-size: 10px;
                padding: 5px 12px;
            }
            
            .market-item {
                padding: 1rem !important;
            }
            
            .market-item p {
                font-size: 0.75rem !important;
            }
            
            .inventory-slot {
                padding: 0.75rem !important;
            }
        }
    </style>

    <style>
        /* Landscape overlay - only shows on phones in portrait mode */
        #landscape-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0f172a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        /* Landscape overlay is shown/hidden via JS only */

        .rotate-phone {
            animation: rotatePhone 1.5s ease-in-out infinite alternate;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }

    </style>
</head>

                } else {

        let rankedResultTimer = null;

        const RANKED_TIERS = [
            { id: 'beginner_1',  name: 'Beginner I',   threshold: 0,   xpNeeded: 60,  icon: 'https://i.postimg.cc/H8QzcTKZ/hexagon-master-1.png'  },
            { id: 'beginner_2',  name: 'Beginner II',  threshold: 35,  xpNeeded: 80,  icon: 'https://i.postimg.cc/rRSj0qbP/hexagon-master-2.png'  },
            { id: 'beginner_3',  name: 'Beginner III', threshold: 75,  xpNeeded: 100, icon: 'https://i.postimg.cc/Pvmypdc6/hexagon-master-3.png'  },
            { id: 'normal_1',    name: 'Normal I',     threshold: 110, xpNeeded: 130, icon: 'https://i.postimg.cc/K3nfkmVp/hexagon-master-4.png'  },
            { id: 'normal_2',    name: 'Normal II',    threshold: 125, xpNeeded: 170, icon: 'https://i.postimg.cc/N21D9QVn/hexagon-master-5.png'  },
            { id: 'normal_3',    name: 'Normal III',   threshold: 150, xpNeeded: 220, icon: 'https://i.postimg.cc/5QwgYfTc/hexagon-master-7.png'  },
            { id: 'pro_1',       name: 'Pro I',        threshold: 175, xpNeeded: 290, icon: 'https://i.postimg.cc/V0jgrzT3/hexagon-master-9.png'  },
            { id: 'pro_2',       name: 'Pro II',       threshold: 200, xpNeeded: 375, icon: 'https://i.postimg.cc/QKpm9jwZ/hexagon-master-10.png' },
            { id: 'pro_3',       name: 'Pro III',      threshold: 225, xpNeeded: 490, icon: 'https://i.postimg.cc/zHn7bq6Z/hexagon-master-11.png' },
            { id: 'master',      name: 'Master',       threshold: 250, xpNeeded: null, icon: 'https://i.postimg.cc/vxWhgGjk/hexagon-master-12.png' },
        ];

        // XP awarded per quest claim = Math.floor(quest.reward / 500), min 10
        function getQuestXP(quest) {
            const base = Math.max(10, Math.floor(quest.reward / 500));
            const rankBoosted = (state.xpBoostUntil || 0) > Date.now();
            const surgeBoosted = (state.xpSurgeUntil || 0) > Date.now();
            let mult = 1;
            if (rankBoosted) mult *= 1.5;
            if (surgeBoosted) mult *= 1.3;
            return mult > 1 ? Math.round(base * mult) : base;
        }

        const IS_MOBILE = window.matchMedia('(max-width: 1024px)').matches || navigator.maxTouchPoints > 0;
        const RANKED_MULT = IS_MOBILE ? 1.5 : 1;
        const RANKED_TIME = IS_MOBILE ? 30 : 35;

        function getRankedTierByClicks(clicks) {
            let tier = null;
            for (const t of RANKED_TIERS) {
                if (clicks >= Math.round(t.threshold * RANKED_MULT)) tier = t;
                else break;
            }
            return tier;
        }

        function getRankedTierById(id) {
            return RANKED_TIERS.find(t => t.id === id) || null;
        }

        function getNextRankedTier(tierId) {
            const idx = RANKED_TIERS.findIndex(t => t.id === tierId);
            return idx >= 0 && idx < RANKED_TIERS.length - 1 ? RANKED_TIERS[idx + 1] : null;
        }

        function openRanked() {
            clearInterval(rankedCountdownInterval);
            clearInterval(rankedGameInterval);
            clearTimeout(rankedResultTimer);
            // If already ranked, show profile; otherwise idle
            const rs = state.rankedTier ? 'profile' : 'idle';
            updateState({ showRanked: true, rankedState: rs, rankedClicks: 0, rankedTimeLeft: RANKED_TIME, rankedCountdown: 3 });
        }

        function startRankedCountdown() {
            clearInterval(rankedCountdownInterval);
            clearInterval(rankedGameInterval);
            state.rankedCountdown = 3;
            state.rankedState = 'countdown';
            render();
            rankedCountdownInterval = setInterval(() => {
                state.rankedCountdown--;
                if (state.rankedCountdown <= 0) {
                    clearInterval(rankedCountdownInterval);
                    startRankedGame();
                } else {
                    const el = document.getElementById('ranked-countdown-num');
                    if (el) el.textContent = state.rankedCountdown;
                }
            }, 1000);
        }

        function startRankedGame() {
            state.rankedState = 'playing';
            state.rankedClicks = 0;
            state.rankedTimeLeft = RANKED_TIME;
            lastRankedClick = 0;
            rankedFirstTouchId = null;
            render();
            rankedGameInterval = setInterval(() => {
                state.rankedTimeLeft--;
                if (state.rankedTimeLeft <= 0) {
                    clearInterval(rankedGameInterval);
                    state.rankedTimeLeft = 0;
                    const c = state.rankedClicks;
                    const earned = getRankedTierByClicks(c);
                    const previousTier = state.rankedTier; // null if unranked
                    const current = getRankedTierById(state.rankedTier);
                    const currentIdx = current ? RANKED_TIERS.findIndex(t => t.id === current.id) : -1;
                    const earnedIdx = earned ? RANKED_TIERS.findIndex(t => t.id === earned.id) : -1;
                    const improved = earnedIdx > currentIdx;
                    const isRankUp = improved && previousTier !== null; // only celebrate if they already had a rank
                    if (improved) state.rankedTier = earned.id;
                    state.rankedPersonalBest = Math.max(state.rankedPersonalBest || 0, c);
                    state.rankedSeasonBest = Math.max(state.rankedSeasonBest || 0, c);
                    state.rankedGamesPlayed = (state.rankedGamesPlayed || 0) + 1;
                    state.rankedState = 'results';
                    state.pendingRankUp = isRankUp ? earned.id : null;
                    rankedResultLockedUntil = Date.now() + 1500;
                    render();
                } else {
                    const timerEl = document.querySelector('.ranked-timer');
                    if (timerEl) timerEl.textContent = state.rankedTimeLeft + 's remaining';
                    const barEl = document.querySelector('.ranked-bar');
                    if (barEl) barEl.style.width = ((state.rankedTimeLeft / RANKED_TIME) * 100) + '%';
                }
            }, 1000);
        }

        let lastRankedClick = 0;
        const RANKED_CLICK_LIMIT = IS_MOBILE ? 250 : 100;
        let rankedFirstTouchId = null;

        function rankedClick(e) {
            if (e.cancelable) e.preventDefault();
            if (state.rankedState !== 'playing') return;

            if (e.type === 'touchstart') {
                // Only allow the first finger that touched
                const touch = e.changedTouches[0];
                if (rankedFirstTouchId === null) {
                    rankedFirstTouchId = touch.identifier;
                } else if (touch.identifier !== rankedFirstTouchId) {
                    return; // second+ finger — ignore
                }
            }

            const now = Date.now();
            if (now - lastRankedClick < RANKED_CLICK_LIMIT) return;
            lastRankedClick = now;
            state.rankedClicks++;
            const el = document.querySelector('.ranked-clicks');
            if (el) el.textContent = state.rankedClicks;
        }

        function rankedTouchEnd(e) {
            // Reset first touch when that finger lifts
            for (const t of e.changedTouches) {
                if (t.identifier === rankedFirstTouchId) {
                    rankedFirstTouchId = null;
                    break;
                }
            }
        }

        let rankedResultLockedUntil = 0;

        function closeRankedResult() {
            if (Date.now() < rankedResultLockedUntil) return; // block accidental clicks
            clearTimeout(rankedResultTimer);
            clearInterval(rankedCountdownInterval);
            clearInterval(rankedGameInterval);
            const pendingTier = state.pendingRankUp;
            updateState({ showRanked: false, rankedState: 'idle', rankedClicks: 0, rankedTimeLeft: RANKED_TIME, rankedCountdown: 3, pendingRankUp: null });
            if (pendingTier) {
                updateState({ showRankUp: true, rankUpTier: pendingTier, xpBoostUntil: Date.now() + 20 * 60 * 1000 });
                setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
            }
        }

        function playAgainRanked() {
            clearTimeout(rankedResultTimer);
            clearInterval(rankedCountdownInterval);
            clearInterval(rankedGameInterval);
            updateState({ rankedState: 'idle', rankedClicks: 0, rankedTimeLeft: RANKED_TIME, rankedCountdown: 3 });
        }

        function rankedTierColor(id) {
            if (!id) return 'text-slate-400';
            if (id === 'master') return 'text-amber-500';
            if (id.startsWith('pro')) return 'text-purple-500';
            if (id.startsWith('normal')) return 'text-blue-500';
            return 'text-slate-500';
        }
        // ---- END RANKED MODE ----

        function updateState(newState, skipRender = false) {
            state = { ...state, ...newState };
            if (!skipRender) render();
        }

        function getItemPrice(item) {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const priceMod = world ? world.priceMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            return (item.baseCost * priceMod * 1.25) / rate;
        }

        function getAscensionCost() {
            const rate = CONVERSION_RATES[state.theme];
            const baseCost = 600;
            const multiplier = 1.2;
            const basePrestigeCost = Math.floor(baseCost * Math.pow(multiplier, state.prestigeLevel));
            return basePrestigeCost / rate;
        }

        function formatCost(cost) {
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key === 'Enter') {
                const cmdText = e.target.value.trim();
                if (!cmdText) return;
                
                const parts = cmdText.split(' ');
                const command = parts[0].toLowerCase();
                let message = "";
                let changes = {};
                
                if (command === '/money') {
                    const amt = parseFloat(parts[1]) || 0;
                    changes.gold = state.gold + amt;
                    message = `Money added: ${amt}`;
                } else if (command === '/rebirth') {
                    const lvl = parseInt(parts[1]);
                    if (!isNaN(lvl)) {
                        changes.prestigeLevel = lvl;
                        message = "Prestige level set to " + lvl;
                    } else {
                        message = "Usage: /rebirth [n]";
                    }
                } else if (command === '/give') {
                    const sub = parts[1]?.toLowerCase();
                    if (sub === 'xpsurge') {
                        const newInv = { ...state.inventory };
                        newInv['xpmult'] = (newInv['xpmult'] || 0) + 1;
                        changes.inventory = newInv;
                        message = 'Gave 1x XP Surge item. Use it from Storage to activate.';
                    } else if (sub === 'all') {
                        // Give 1 of every item
                        const newInv = { ...state.inventory };
                        SHOP_ITEMS.forEach(i => { newInv[i.id] = (newInv[i.id] || 0) + 1; });
                        changes.inventory = newInv;
                        message = `Gave 1x of all ${SHOP_ITEMS.length} items`;
                    } else {
                        // Collect up to 25 item IDs from parts[1..25], last numeric arg = amount
                        const rawArgs = parts.slice(1);
                        const lastArg = rawArgs[rawArgs.length - 1];
                        const amount = !isNaN(parseInt(lastArg)) && SHOP_ITEMS.every(i => i.id !== lastArg.toLowerCase()) ? parseInt(lastArg) : 1;
                        const itemArgs = (amount > 1 || (!isNaN(parseInt(lastArg)) && !SHOP_ITEMS.find(i => i.id === lastArg.toLowerCase()))) ? rawArgs.slice(0, -1) : rawArgs;
                        const ids = itemArgs.slice(0, 25).map(a => a.toLowerCase());
                        if (ids.length === 0) {
                            message = 'Usage: /give [id] [amt] | /give [id1] [id2]... | /give all';
                        } else {
                            const newInv = { ...state.inventory };
                            const given = [], missing = [];
                            ids.forEach(id => {
                                const item = SHOP_ITEMS.find(i => i.id === id);
                                if (item) { newInv[id] = (newInv[id] || 0) + amount; given.push(item.name); }
                                else missing.push(id);
                            });
                            if (given.length) changes.inventory = newInv;
                            message = given.length ? `Gave ${amount}x: ${given.join(', ')}${missing.length ? ` | Not found: ${missing.join(', ')}` : ''}` : `Error: No valid items found (${missing.join(', ')})`;
                        }
                    }
                } else if (command === '/quest') {
                    if (state.activeQuests.length > 0) {
                        const updatedQuests = state.activeQuests.map(q => ({ ...q, completed: true, progress: q.target }));
                        changes.activeQuests = updatedQuests;
                        message = `All ${state.activeQuests.length} active quest(s) completed! Claim them in the Quests menu.`;
                    } else {
                        message = "No active quests to complete";
                    }
                } else if (command === '/xp') {
                    const amt = parseInt(parts[1]);
                    if (isNaN(amt)) {
                        message = "Usage: /xp [n]";
                    } else if (!state.rankedTier) {
                        message = "Must be ranked first to earn XP";
                    } else if (state.rankedTier === 'master') {
                        const newMasterXP = (state.masterXP || 0) + amt;
                        changes.masterXP = newMasterXP;
                        message = `Added ${amt} Master XP (total: ${newMasterXP})`;
                    } else {
                        let newXP = (state.rankedXP || 0) + amt;
                        let newTier = state.rankedTier;
                        let promoted = [];
                        let promoting = true;
                        while (promoting) {
                            const tier = getRankedTierById(newTier);
                            const next = getNextRankedTier(newTier);
                            if (tier && next && tier.xpNeeded && newXP >= tier.xpNeeded) {
                                newXP -= tier.xpNeeded;
                                newTier = next.id;
                                promoted.push(next.name);
                            } else { promoting = false; }
                        }
                        changes.rankedXP = newXP;
                        changes.rankedTier = newTier;
                        message = promoted.length ? `Added ${amt} XP — ranked up to ${promoted[promoted.length-1]}!` : `Added ${amt} XP (total: ${newXP})`;
                        if (promoted.length) {
                            changes.showRankUp = true;
                            changes.rankUpTier = newTier;
                            setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
                        }
                    }
                } else if (command === '/rank') {
                    const sub = parts[1]?.toLowerCase();
                    if (sub === 'up') {
                        if (!state.rankedTier) {
                            changes.rankedTier = RANKED_TIERS[0].id;
                            changes.showRankUp = true;
                            changes.rankUpTier = RANKED_TIERS[0].id;
                            message = `Rank set to ${RANKED_TIERS[0].name}`;
                        } else {
                            const next = getNextRankedTier(state.rankedTier);
                            if (next) {
                                changes.rankedTier = next.id;
                                changes.rankedXP = 0;
                                changes.showRankUp = true;
                                changes.rankUpTier = next.id;
                                message = `Ranked up to ${next.name}`;
                            } else {
                                message = "Already at Master rank";
                            }
                        }
                    } else if (sub) {
                        const query = parts.slice(1).join(' ').toLowerCase();
                        const match = RANKED_TIERS.find(t => t.name.toLowerCase() === query || t.id === query.replace(' ', '_'));
                        if (match) {
                            changes.rankedTier = match.id;
                            changes.rankedXP = 0;
                            changes.showRankUp = true;
                            changes.rankUpTier = match.id;
                            message = `Rank set to ${match.name}`;
                        } else {
                            message = `Unknown rank. Options: ${RANKED_TIERS.map(t => t.name).join(', ')}`;
                        }
                    } else {
                        message = "Usage: /rank [tier name] | /rank up";
                    }
                    if (changes.showRankUp) {
                        changes.xpBoostUntil = Date.now() + 20 * 60 * 1000;
                        setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
                    }
                } else {
                    message = "Commands: /money [n], /rebirth [n], /give [id] [amt], /give [id1] [id2]..., /give all, /quest, /xp [n], /rank [tier], /rank up";
                }

                const newLogs = [message, ...state.adminLog].slice(0, 10);
                updateState({ ...changes, adminLog: newLogs });
                e.target.value = "";
            }
        }

        function triggerTitleClick() {
            titleClickCount++;
            clearTimeout(titleClickTimer);
            if (titleClickCount >= 3) {
                if (!isAdminAuthed()) {
                    const pw = prompt('Enter admin password:');
                    if (pw === null) { titleClickCount = 0; return; }
                    if (!tryAdminPassword(pw)) {
                        alert('Wrong password.');
                        titleClickCount = 0;
                        return;
                    }
                }
                updateState({ showAdmin: !state.showAdmin });
                titleClickCount = 0;
            } else {
                titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
            }
        }

        function handleMainClick(e) {
            if (e.cancelable) e.preventDefault();
            if (e.type === 'mousedown' && e.button !== 0) return;
            
            const currentPower = (state.prestigeLevel + 1) * (state.activeBuff ? state.activeBuff.power : 1);
            
            // Trigger squish animation on the inner container
            const gubbyElement = document.querySelector('.gubby-container');
            if (gubbyElement) {
                gubbyElement.classList.remove('animate-squish');
                void gubbyElement.offsetWidth;
                gubbyElement.classList.add('animate-squish');
                // Remove after animation to reset
                setTimeout(() => gubbyElement.classList.remove('animate-squish'), 400);
            }

            state.clicks = state.clicks + currentPower;
            state.totalClicksSession = state.totalClicksSession + 1;
            state.lifetimeClicks = state.lifetimeClicks + 1;

            // Update click counter inline to avoid full re-render interrupting float animation
            const clicksEl = document.querySelector('.clicks-live');
            if (clicksEl) clicksEl.textContent = state.clicks.toLocaleString(undefined, {maximumFractionDigits: 0});
            const totalEl = document.querySelector('.total-live');
            if (totalEl) totalEl.textContent = state.lifetimeClicks.toLocaleString(undefined, {maximumFractionDigits: 0});

            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const particle = document.createElement('div');
            particle.className = `particle text-amber-400`;
            particle.style.cssText = `left:${clientX}px;top:${clientY}px;font-size:2.5rem;font-weight:900;text-shadow:3px 3px 0 rgba(0,0,0,0.5);`;
            particle.textContent = `+${currentPower}`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
            
            checkQuestProgress();
        }

        function sellClicks() {
            if (state.clicks > 0) {
                const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
                const currentWorldMult = currentWorld ? currentWorld.mult : 1;
                const luckyActive = (state.luckyMultUntil || 0) > Date.now();
                const luckyBonus = luckyActive ? (state.luckyMultValue || 1) : 1;
                const totalGoldEarned = (state.clicks * state.marketMultiplier * currentWorldMult * luckyBonus) / CONVERSION_RATES[state.theme];
                updateState({
                    gold: state.gold + totalGoldEarned,
                    clicks: 0,
                    notification: { title: "MARKET SOLD!", message: `Sold for ${totalGoldEarned.toFixed(2)} ${CURRENCIES[state.theme].name}s!${luckyActive ? ` (x${state.luckyMultValue} Lucky!)` : ''}`, type: "success" }
                });
                checkQuestProgress();
            }
        }

        function travelTo(destId) {
            const destination = DESTINATIONS.find(d => d.id === destId);
            
            const oldRate = CONVERSION_RATES[state.theme];
            const newRate = CONVERSION_RATES[destId];
            const conversionFactor = oldRate / newRate;
            const newGold = state.gold * conversionFactor;
            updateState({
                theme: destId,
                gold: newGold,
                showTravelModal: false,
                notification: { 
                    title: "LOCATION CHANGED", 
                    message: `Welcome to ${destination.name}. Currency converted to ${CURRENCIES[destId].name}s!`, 
                    type: "info" 
                }
            });
        }

        function ascend() {
            const cost = getAscensionCost();
            if (state.gold < cost) return;
            const nextPrestige = state.prestigeLevel + 1;
            
            // Update quest progress for prestige quests
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.type === 'prestige') {
                    return { ...quest, progress: (quest.progress || 0) + 1 };
                }
                return quest;
            });
            
            updateState({
                prestigeLevel: nextPrestige,
                gold: 0, clicks: 0, totalClicksSession: 0,
                inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
                activeBuff: null,
                notification: { title: "ASCENDED!", message: `Prestige ${nextPrestige} reached!`, type: "success" },
                activeQuests: updatedQuests
            });
            checkQuestProgress();
        }

        function openItemPopup(itemId) {
            updateState({ showItemPopup: true, itemPopupId: itemId, itemPopupQty: 1, showMarketModal: false });
        }

        function setItemQty(delta) {
            const newQty = Math.max(1, Math.min(25, state.itemPopupQty + delta));
            state.itemPopupQty = newQty;
            // Update UI directly without full re-render
            const qtyInput = document.querySelector('.qty-input');
            if (qtyInput) qtyInput.value = newQty;
            const totalEl = document.querySelector('.popup-total');
            const buyBtn = document.querySelector('.popup-buy-btn');
            const popupItem = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (popupItem && totalEl) {
                const unitPrice = getItemPrice(popupItem);
                const totalPrice = unitPrice * newQty;
                const canAfford = state.gold >= totalPrice;
                totalEl.textContent = formatCost(totalPrice);
                totalEl.className = 'popup-total font-black text-2xl ' + (canAfford ? 'text-slate-900' : 'text-red-500');
                if (buyBtn) {
                    buyBtn.disabled = !canAfford;
                    buyBtn.textContent = canAfford ? ('Purchase' + (newQty > 1 ? ' x' + newQty : '')) : 'Cannot Afford';
                    buyBtn.className = 'popup-buy-btn w-full py-4 font-black uppercase text-lg pixel-button ' + (canAfford ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-400 cursor-not-allowed');
                }
            }
        }

        function setItemQtyManual(val) {
            const parsed = parseInt(val);
            if (!isNaN(parsed)) {
                const newQty = Math.max(1, Math.min(25, parsed));
                state.itemPopupQty = newQty;
                const totalEl = document.querySelector('.popup-total');
                const buyBtn = document.querySelector('.popup-buy-btn');
                const popupItem = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
                if (popupItem && totalEl) {
                    const unitPrice = getItemPrice(popupItem);
                    const totalPrice = unitPrice * newQty;
                    const canAfford = state.gold >= totalPrice;
                    totalEl.textContent = formatCost(totalPrice);
                    totalEl.className = 'popup-total font-black text-2xl ' + (canAfford ? 'text-slate-900' : 'text-red-500');
                    if (buyBtn) {
                        buyBtn.disabled = !canAfford;
                        buyBtn.textContent = canAfford ? ('Purchase' + (newQty > 1 ? ' x' + newQty : '')) : 'Cannot Afford';
                        buyBtn.className = 'popup-buy-btn w-full py-4 font-black uppercase text-lg pixel-button ' + (canAfford ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-400 cursor-not-allowed');
                    }
                }
            }
        }

        function buyItemFromPopup() {
            const item = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (!item) return;
            const unitPrice = getItemPrice(item);
            const totalPrice = unitPrice * state.itemPopupQty;
            if (state.gold >= totalPrice) {
                // Update quest progress for buy_and_use quests
                const updatedQuests = state.activeQuests.map(quest => {
                    if (quest.type === 'buy_and_use' && !quest.hasBought) {
                        return { ...quest, hasBought: true };
                    }
                    return quest;
                });
                
                updateState({
                    gold: state.gold - totalPrice,
                    inventory: { ...state.inventory, [item.id]: (state.inventory[item.id] || 0) + state.itemPopupQty },
                    showItemPopup: false,
                    itemPopupId: null,
                    itemPopupQty: 1,
                    activeQuests: updatedQuests
                });
                checkQuestProgress();
            }
        }

        function useItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (state.inventory[itemId] > 0 && !state.activeBuff) {
                // Update quest progress for use and buy quests
                const updatedQuests = state.activeQuests.map(quest => {
                    if (quest.type === 'use' || quest.type === 'buy') {
                        return { ...quest, progress: (quest.progress || 0) + 1 };
                    } else if (quest.type === 'buy_and_use' && quest.hasBought) {
                        return { ...quest, progress: 1 };
                    }
                    return quest;
                });
                
                if (itemId === 'xpmult') {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        xpSurgeUntil: Date.now() + 15 * 60 * 1000,
                        showStorageModal: false,
                        activeQuests: updatedQuests,
                        notification: { title: 'XP Surge!', message: '1.3x XP for 15 minutes!', type: 'success' }
                    });
                } else {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        activeBuff: { ...item, timeLeft: item.duration },
                        showStorageModal: false,
                        activeQuests: updatedQuests
                    });
                }
                checkQuestProgress();
            }
        }

        function toggleEquip(itemId) {
            const wasEquipped = state.equippedItem === itemId;
            if (state.equippedItem === itemId) {
                updateState({ equippedItem: null });
            } else {
                updateState({ equippedItem: itemId });
            }
            
            // Clear all existing falling particles
            document.querySelectorAll('.floating-star').forEach(star => star.remove());
            
            // Restart particle generation with correct image
            createFloatingStars();
        }

        function generateQuest() {
            const availableQuests = QUESTS.filter(q => {
                // Don't include quests that are already active
                const alreadyActive = state.activeQuests.some(aq => aq.id === q.id);
                if (alreadyActive) return false;
                
                // Don't include quests that have been completed
                const alreadyCompleted = state.completedQuestIds.includes(q.id);
                if (alreadyCompleted) return false;
                
                if (q.type === 'prestige' && state.prestigeLevel < 1) return true;
                if (q.type === 'clicks' && state.lifetimeClicks < q.target) return true;
                if (q.type === 'gold') return true;
                if (q.type === 'buy' || q.type === 'use' || q.type === 'buy_and_use') return true;
                return false;
            });
            
            if (availableQuests.length > 0) {
                const quest = availableQuests[Math.floor(Math.random() * availableQuests.length)];
                const newQuest = { ...quest, progress: 0, completed: false };
                updateState({ activeQuests: [...state.activeQuests, newQuest] });
            }
        }

        function refreshQuests() {
            const cost = 1000000000; // 1 billion
            const costInCurrency = cost / CONVERSION_RATES[state.theme];
            if (state.gold >= costInCurrency) {
                updateState({ 
                    gold: state.gold - costInCurrency,
                    activeQuests: [],
                    completedQuestIds: []
                });
            }
        }

        function checkQuestProgress() {
            if (state.activeQuests.length === 0) return;
            
            let updated = false;
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.completed) return quest;
                
                let progress = quest.progress || 0;
                
                switch (quest.type) {
                    case 'clicks':
                        progress = state.lifetimeClicks;
                        break;
                    case 'gold':
                        progress = state.gold;
                        break;
                    case 'buy':
                    case 'use':
                    case 'prestige':
                    case 'buy_and_use':
                        // Progress is already tracked per quest
                        break;
                }
                
                // For gold quests, convert the target to current currency
                let targetToCheck = quest.target;
                if (quest.type === 'gold') {
                    targetToCheck = quest.target / CONVERSION_RATES[state.theme];
                }
                
                const isComplete = progress >= targetToCheck;
                if (isComplete && !quest.completed) {
                    updated = true;
                    return { ...quest, progress, completed: true };
                } else if (progress !== quest.progress) {
                    updated = true;
                    return { ...quest, progress };
                }
                return quest;
            });
            
            if (updated) {
                updateState({ activeQuests: updatedQuests }, true); // Skip render to prevent flashing
            }
        }

        function claimQuest(questId) {
            const quest = state.activeQuests.find(q => q.id === questId);
            if (!quest || !quest.completed) return;
            
            const rewardInCurrency = quest.reward / CONVERSION_RATES[state.theme];
            const xpGained = state.rankedTier ? getQuestXP(quest) : 0;
            const isMaster = state.rankedTier === 'master';

            let newMasterXP = state.masterXP || 0;
            let newXP = state.rankedXP || 0;
            let newTier = state.rankedTier;
            let rankUpTier = null;

            if (isMaster) {
                // At master: XP goes to masterXP pool for rewards
                newMasterXP += xpGained;
            } else if (state.rankedTier) {
                // Below master: XP advances rank
                newXP += xpGained;
                let promoting = true;
                while (promoting) {
                    const tier = getRankedTierById(newTier);
                    const next = getNextRankedTier(newTier);
                    if (tier && next && tier.xpNeeded && newXP >= tier.xpNeeded) {
                        newXP -= tier.xpNeeded;
                        newTier = next.id;
                        rankUpTier = next.id;
                    } else {
                        promoting = false;
                    }
                }
            }

            const updates = { 
                gold: state.gold + rewardInCurrency,
                completedQuests: state.completedQuests + 1,
                activeQuests: state.activeQuests.filter(q => q.id !== questId),
                completedQuestIds: [...state.completedQuestIds, questId],
                rankedXP: newXP,
                rankedTier: newTier,
                masterXP: newMasterXP,
            };
            if (rankUpTier) {
                updates.showRankUp = true;
                updates.rankUpTier = rankUpTier;
                updates.xpBoostUntil = Date.now() + 20 * 60 * 1000; // 20 min XP boost
            }
            updateState(updates);

            if (rankUpTier) {
                setTimeout(() => updateState({ showRankUp: false, rankUpTier: null }), 3000);
            }
        }

        function claimMasterReward(milestoneIdx) {
            const milestone = MASTER_MILESTONES[milestoneIdx];
            if (!milestone || state.rankedTier !== 'master') return;
            if ((state.claimedMasterRewards || []).includes(milestoneIdx)) return;
            if ((state.masterXP || 0) < milestone.xp) return;

            // Pick a random item from the marketplace
            const randomItem = SHOP_ITEMS[Math.floor(Math.random() * SHOP_ITEMS.length)];
            const newInv = { ...state.inventory };
            newInv[randomItem.id] = (newInv[randomItem.id] || 0) + 1;

            // Lucky multiplier: 0.05x to 20x (weighted toward lower values)
            const raw = Math.random();
            const luckyMult = parseFloat((0.05 + Math.pow(raw, 2) * 19.95).toFixed(2));

            updateState({
                inventory: newInv,
                claimedMasterRewards: [...(state.claimedMasterRewards || []), milestoneIdx],
                luckyMultUntil: Date.now() + 20 * 1000,
                luckyMultValue: luckyMult,
                notification: {
                    title: milestone.label + ' Claimed!',
                    message: `Got 1x ${randomItem.name} + x${luckyMult} Lucky Multiplier for 20s!`,
                    type: 'success'
                },
            });
        }

        function resetRank() {
            if (state.rankedTier !== 'master') return;
            updateState({
                rankedTier: null,
                rankedXP: 0,
                masterXP: 0,
                claimedMasterRewards: [],
                rankedState: 'idle',
            });
        }

        setInterval(() => {
            const nextRate = 0.5 + (Math.random() * 1.25);
            state.marketMultiplier = state.marketQueue[0];
            state.marketTrend = state.marketQueue[0] > state.marketMultiplier ? 'up' : 'down';
            state.marketQueue = [...state.marketQueue.slice(1), nextRate];
            
            // Only re-render if admin console and modals are not open
            if (!state.showAdmin && !state.showMarketModal && !state.showStorageModal && !state.showItemPopup && !state.showQuestModal && !state.showRanked) {
                render();
            }
        }, 7000);

        setInterval(() => {
            let shouldRender = false;
            
            if (state.activeBuff) {
                if (state.activeBuff.timeLeft <= 1) { 
                    state.activeBuff = null;
                    shouldRender = true;
                } else { 
                    state.activeBuff.timeLeft = state.activeBuff.timeLeft - 1;

                    const buffDisplay = document.querySelector('.buff-timer-display');
                    if (buffDisplay) {

                    }

            if (state.discoEventTimer > 0) {

                const discoDisplay = document.querySelector('.disco-timer-display');
                if (discoDisplay) {
                    discoDisplay.textContent = `Disco Mode: ${state.discoEventTimer}s`;
                }
                if (state.discoEventTimer === 0) {
                    shouldRender = true; // Re-render to remove disco background
                }
            }

            // Update XP boost countdown widget
            const xpBoostWidget = document.querySelector('.xp-boost-widget');
            if (xpBoostWidget) {
                if ((state.xpBoostUntil || 0) > Date.now()) {
                    const secsLeft = Math.ceil((state.xpBoostUntil - Date.now()) / 1000);
                    const mins = Math.floor(secsLeft / 60);
                    const secs = secsLeft % 60;
                    xpBoostWidget.textContent = `1.5x XP ${mins}:${String(secs).padStart(2,'0')}`;
                    xpBoostWidget.style.display = 'block';
                } else {
                    xpBoostWidget.style.display = 'none';
                }
            }

            // XP Surge item expiry + widget
            if ((state.xpSurgeUntil || 0) > 0 && Date.now() >= state.xpSurgeUntil) {
                state.xpSurgeUntil = 0;
                shouldRender = true;
            }
            const xpSurgeWidget = document.querySelector('.xp-surge-widget');
            if (xpSurgeWidget) {
                if ((state.xpSurgeUntil || 0) > Date.now()) {
                    const secsLeft = Math.ceil((state.xpSurgeUntil - Date.now()) / 1000);
                    const mins = Math.floor(secsLeft / 60);
                    const secs = secsLeft % 60;
                    xpSurgeWidget.textContent = `1.3x XP Surge ${mins}:${String(secs).padStart(2,'0')}`;
                    xpSurgeWidget.style.display = 'block';
                } else {
                    xpSurgeWidget.style.display = 'none';
                }
            }

            // Expire lucky multiplier
            if ((state.luckyMultUntil || 0) > 0 && Date.now() >= state.luckyMultUntil) {
                state.luckyMultUntil = 0;
                state.luckyMultValue = 1;
                shouldRender = true;
            }

            // Update lucky mult countdown and market stat display
            const luckyWidget = document.querySelector('.lucky-mult-widget');
            if (luckyWidget) {
                if ((state.luckyMultUntil || 0) > Date.now()) {
                    const secsLeft = Math.ceil((state.luckyMultUntil - Date.now()) / 1000);
                    luckyWidget.textContent = `x${state.luckyMultValue} Lucky ${secsLeft}s`;
                    luckyWidget.style.display = 'block';
                } else {
                    luckyWidget.style.display = 'none';
                }
            }
            // Keep market stat display in sync with lucky mult
            const marketStatEl = document.querySelector('.market-rate-live');
            if (marketStatEl) {
                const luckyActive = (state.luckyMultUntil || 0) > Date.now();
                const displayRate = luckyActive ? (state.marketMultiplier * (state.luckyMultValue || 1)).toFixed(2) : state.marketMultiplier.toFixed(2);
                marketStatEl.innerHTML = luckyActive
                    ? `<span class="text-amber-500">${displayRate}x <span class="text-xs text-amber-400">(Lucky)</span></span>`
                    : `<span class="${parseFloat(displayRate) >= 1.2 ? 'text-emerald-600' : 'text-slate-900'}">${displayRate}x</span>`;
            }
            
            // Only render if admin console is not open, no modals are open, and something important changed
            if (shouldRender && !state.showAdmin && !state.showMarketModal && !state.showStorageModal && !state.showItemPopup && !state.showRanked) {
                render();
            }
        }, 1000);

        function createFloatingStars() {
            const starCount = 8;
            const imageUrl = 'https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png';
            
            for (let i = 0; i < starCount; i++) {
                setTimeout(() => {
                    const star = document.createElement('img');
                    star.src = imageUrl;
                    star.className = 'floating-star';
                    star.style.imageRendering = 'pixelated';
                    
                    const size = 30 + Math.random() * 40;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    
                    // Spawn on sides: either 0-30% or 70-100%
                    let leftPosition;
                    if (Math.random() < 0.5) {
                        // Left side (0-30%)
                        leftPosition = Math.random() * 30;
                    } else {
                        // Right side (70-100%)
                        leftPosition = 70 + Math.random() * 30;
                    }
                    star.style.left = leftPosition + 'vw';
                    star.style.top = '-100px';
                    
                    const drift = (Math.random() - 0.5) * 150; // More drift for variety
                    star.style.setProperty('--drift', drift + 'px');
                    
                    const duration = 12 + Math.random() * 6; // Slower fall (12-18 seconds)
                    star.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(star);
                    
                    setTimeout(() => {
                        star.remove();
                    }, duration * 1000);
                }, i * 2000);
            }
        }

        setInterval(createFloatingStars, 16000);

        const DAILY_REFRESH_MS = 24 * 60 * 60 * 1000; // 24 hours

        // Master XP reward tiers — unlocked after reaching Master rank
        // Master XP milestone roadmap — each milestone gives a random item + lucky multiplier
        const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI','XXXII','XXXIII','XXXIV','XXXV','XXXVI','XXXVII','XXXVIII','XXXIX','XL','XLI','XLII','XLIII','XLIV','XLV','XLVI','XLVII','XLVIII','XLIX','L'];
        const MASTER_MILESTONES = (() => {
            const milestones = [];
            let xp = 100;
            for (let i = 0; i < 50; i++) {
                milestones.push({ xp: Math.round(xp / 5) * 5, label: 'Milestone ' + ROMAN[i] });
                xp = xp * 1.10;
            }
            return milestones;
        })();

        setInterval(() => {
            // Daily quest refresh — clear completed IDs so quests can be re-taken
            if (Date.now() - (state.questLastRefresh || 0) >= DAILY_REFRESH_MS) {
                state.questLastRefresh = Date.now();
                state.completedQuestIds = [];
                state.activeQuests = [];
                render();

        }, 60000); // check every minute

                    <div class="fixed bottom-4 right-4 z-[95] flex flex-col items-end gap-2 pointer-events-none">
                        <div class="xp-boost-widget bg-rose-600 border-2 border-rose-800 text-white text-xs font-black px-3 py-1.5 uppercase tracking-wide" style="display:${(state.xpBoostUntil||0) > Date.now() ? 'block' : 'none'};">1.5x XP</div>
                        <div class="xp-surge-widget bg-purple-600 border-2 border-purple-800 text-white text-xs font-black px-3 py-1.5 uppercase tracking-wide" style="display:${(state.xpSurgeUntil||0) > Date.now() ? 'block' : 'none'};">1.3x XP Surge</div>
                        <div class="lucky-mult-widget bg-amber-500 border-2 border-amber-700 text-white text-xs font-black px-3 py-1.5 uppercase tracking-wide" style="display:${(state.luckyMultUntil||0) > Date.now() ? 'block' : 'none'};">Lucky</div>
                    </div>







                        <div class="flex gap-6 items-center justify-center">
                            <!-- Left star (flipped) -->
                            <img src="https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png" alt="" class="h-16 sm:h-20 pixelated" style="image-rendering: pixelated; transform: scaleX(-1);" />
                            
                            <!-- Center logo -->
                            <span 
                                onclick="triggerTitleClick()"
                                class="cursor-help active:scale-95 transition-transform select-none font-black uppercase tracking-wide text-4xl sm:text-6xl"
                                style="font-family:'Pixelify Sans',monospace; color:${currentWorld?.id === 'starlight' || currentWorld?.id === 'void' ? '#fff' : '#000'}; text-shadow: 3px 3px 0 rgba(0,0,0,0.15);"
                            >Gubby Clicker</span>
                            
                            <!-- Right star (normal) -->
                            <img src="https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png" alt="" class="h-16 sm:h-20 pixelated" style="image-rendering: pixelated;" />
                        </div>
                        
                        <div class="w-full max-w-6xl flex gap-3 mb-2">
                            <span class="pixel-badge bg-indigo-600 border-indigo-800 text-white flex-1 text-center">Prestige ${state.prestigeLevel}</span>
                            <span class="pixel-badge bg-amber-500 border-amber-700 text-white flex-1 text-center">${currentWorld?.name}</span>
                            <span class="pixel-badge flex-1 text-center ${state.rankedTier ? 'bg-rose-500 border-rose-700' : 'bg-slate-400 border-slate-600'} text-white">${state.rankedTier ? (RANKED_TIERS.find(t=>t.id===state.rankedTier)?.name || 'Unranked') : 'Unranked'}</span>
                        </div>
                        
                        <div class="w-full max-w-6xl pixel-card mt-2 px-4 sm:px-8 py-4 sm:py-6 flex flex-col sm:flex-row flex-wrap items-center justify-between gap-4 sm:gap-6">
                            <div class="flex items-center gap-3 sm:gap-6 flex-1 flex-wrap justify-center w-full sm:w-auto sm:justify-start">
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Clicks</p>
                                    <span class="clicks-live text-lg sm:text-2xl font-black text-slate-900">${state.clicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Total</p>
                                    <span class="total-live text-lg sm:text-2xl font-black text-slate-900">${state.lifetimeClicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Market</p>
                                    <span class="market-rate-live text-lg sm:text-2xl font-black">${(() => {
                                        const luckyActive = (state.luckyMultUntil || 0) > Date.now();
                                        const displayRate = luckyActive ? (state.marketMultiplier * (state.luckyMultValue || 1)).toFixed(2) : state.marketMultiplier.toFixed(2);
                                        const isGood = parseFloat(displayRate) >= 1.2;
                                        return luckyActive
                                            ? `<span class="text-amber-500">${displayRate}x <span class="text-xs text-amber-400">(Lucky)</span></span>`
                                            : `<span class="${isGood ? 'text-emerald-600' : 'text-slate-900'}">${displayRate}x</span>`;
                                    })()}</span>
                                </div>
                                <div class="stat-display">
                                    <p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">${currentCurrency.name}s</p>
                                    <span class="text-lg sm:text-2xl font-black text-slate-900">${state.gold.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 sm:gap-4 flex-wrap justify-center w-full sm:w-auto">
                                <button onclick="ascend()" ${state.gold < currentPrestigeCost ? 'disabled' : ''} class="px-4 sm:px-6 py-2 sm:py-3 font-black uppercase text-xs sm:text-sm tracking-widest transition-all pixel-button ${state.gold >= currentPrestigeCost ? 'bg-indigo-600 border-indigo-800 text-white' : 'bg-slate-200 border-slate-400 text-slate-400'}">Ascend<br/><span class="text-xs">(${formatCost(currentPrestigeCost)})</span></button>
                                <button onclick="sellClicks()" class="px-6 sm:px-8 py-3 sm:py-4 font-black uppercase text-base sm:text-lg tracking-widest transition-all pixel-button ${state.marketMultiplier >= 1.2 ? 'bg-emerald-400 border-emerald-600 text-white animate-pulse' : 'bg-yellow-400 border-yellow-600 text-slate-900'}">Sell!</button>
                            </div>
                        </div>
                    </header>

                    <main class="z-10 relative flex flex-col items-center justify-center w-full mb-4">
                        <div class="h-16 mb-2 flex flex-col items-center justify-end">
                            ${state.activeBuff ? `<div class="bg-white px-8 py-3 border-4 border-indigo-500" style="box-shadow: 4px 4px 0 rgba(0,0,0,0.2);"><span class="buff-timer-display text-sm font-black uppercase text-indigo-600 tracking-wider">${state.activeBuff.name} (${state.activeBuff.timeLeft}s)</span></div>` : ''}
                        </div>

                        <div class="gubby-float">
                            <div 
                                onmousedown="handleMainClick(event)"
                                ontouchstart="handleMainClick(event)"
                                class="gubby-container w-72 h-72 flex items-center justify-center"
                            >
                                <img src="${gubbyImgUrl}" class="w-full h-full object-contain pointer-events-none" style="filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));" />
                            </div>
                        </div>
                        ${state.discoEventTimer > 0 ? `<div class="mt-6 px-6 py-2 bg-white/90 border-4 border-purple-600 font-black text-purple-600 uppercase animate-pulse" style="box-shadow: 4px 4px 0 rgba(0,0,0,0.2);"><span class="disco-timer-display">Disco Mode: ${state.discoEventTimer}s</span></div>` : ''}
                    </main>

                    <div class="z-20 w-full max-w-6xl flex gap-6 justify-center mb-4 px-4 flex-col sm:flex-row">
                        <button onclick="updateState({showMarketModal: true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1">
                            <i data-lucide="shopping-cart" class="w-12 h-12 text-indigo-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Marketplace</span>
                            <span class="text-xs font-bold text-slate-500">Buy Power-Ups</span>
                        </button>

                        <button onclick="updateState({showStorageModal: true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 relative">
                            <i data-lucide="package" class="w-12 h-12 text-emerald-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Storage</span>
                            <span class="text-xs font-bold text-slate-500">${totalItems} Items</span>
                            ${totalItems > 0 ? `
                                <span class="absolute -top-2 -right-2 bg-red-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.3);">${totalItems}</span>
                            ` : ''}
                        </button>

                        <button onclick="updateState({showQuestModal: true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 relative">
                            <i data-lucide="scroll-text" class="w-12 h-12 text-amber-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Quests</span>
                            <span class="text-xs font-bold text-slate-500">${state.completedQuests} Completed</span>
                            ${state.activeQuests.some(q => q.completed) ? `
                                <span class="absolute -top-2 -right-2 bg-emerald-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.3);">
                                    <i data-lucide="check" class="w-6 h-6"></i>
                                </span>
                            ` : state.activeQuests.length > 0 ? `
                                <span class="absolute -top-2 -right-2 bg-amber-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.3);">
                                    ${state.activeQuests.length}
                                </span>
                            ` : ''}
                        </button>
                    </div>

                    <div class="z-20 w-full max-w-6xl px-4 mb-8 flex gap-2">
                        <button onclick="openRanked()" class="pixel-badge bg-rose-500 border-rose-700 text-white flex-1 text-center cursor-pointer hover:bg-rose-400 transition-colors">Ranked Mode</button>
                        <button onclick="updateState({showRankedInfo:true})" class="pixel-badge bg-rose-500 border-rose-700 text-white cursor-pointer hover:bg-rose-400 transition-colors px-3" style="flex:0 0 auto;">?</button>
                    </div>

                </div>
            `;            
            lucide.createIcons();
            
            if (activeElementId === 'admin-input') {
                const newInput = document.getElementById('admin-input');
                if (newInput) {
                    newInput.focus();
                    newInput.value = previousValue;
                    newInput.setSelectionRange(previousValue.length, previousValue.length);
                }
            } else if (state.showAdmin && !activeElementId) {
                const newInput = document.getElementById('admin-input');
                if (newInput) newInput.focus();
            }
        }

        function renderMarketContent() {
            const catBtnBase = "w-full bg-white border-4 p-4 sm:p-6 flex justify-center items-center transition-all group market-item";
            if (!state.marketCategory) {
                return `
                    <div class="flex flex-col gap-4">
                        <button onclick="updateState({marketCategory: 'small'})" class="${catBtnBase} border-blue-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-blue-600">Small Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'medium'})" class="${catBtnBase} border-purple-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-purple-600">Medium Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'large'})" class="${catBtnBase} border-orange-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-orange-600">Large Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'op'})" class="${catBtnBase} border-red-500">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-red-600">OP Boosts</span>
                        </button>
                    </div>
                `;
            }

            const itemsToShow = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return `
                <div class="flex flex-col gap-3">
                    <button onclick="updateState({marketCategory: null})" class="w-full text-left text-xs font-black uppercase text-slate-500 mb-2 flex items-center gap-2 hover:text-slate-700 tracking-wider">← Back to Categories</button>
                    ${itemsToShow.map(item => {
                        const price = getItemPrice(item);
                        const canAfford = state.gold >= price;
                        const alreadyOwned = item.permanent && state.inventory[item.id] > 0;
                        return `
                            <div class="flex items-center justify-between p-4 border-4 bg-white ${alreadyOwned ? 'border-emerald-500 bg-emerald-50' : canAfford ? 'border-slate-300' : 'border-slate-200 opacity-50'}">
                                <div class="text-left flex-1 mr-3">
                                    <p class="font-black text-base sm:text-lg uppercase text-slate-900 leading-tight">${item.name}${alreadyOwned ? ' (Owned)' : ''}</p>
                                    <p class="text-xs font-bold text-slate-400 mt-0.5">${item.permanent ? 'Permanent' : item.power > 1 ? item.power + 'x power' : 'Special'}${item.duration > 0 ? ' · ' + item.duration + 's' : ''}${item.description ? ' · ' + item.description : ''}</p>
                                </div>
                                <button onclick="event.stopPropagation(); ${alreadyOwned ? '' : `openItemPopup('${item.id}')`}" class="pixel-button shrink-0 ${alreadyOwned ? 'bg-emerald-500 border-emerald-700 text-white cursor-default' : canAfford ? 'bg-indigo-600 border-indigo-800 text-white' : 'bg-slate-200 border-slate-300 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">
                                    ${alreadyOwned ? 'OWNED' : 'BUY'}
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStorageContent() {
            const categories = {
                small: { name: 'Small Boosts', color: 'blue', items: [] },
                medium: { name: 'Medium Boosts', color: 'purple', items: [] },
                large: { name: 'Large Boosts', color: 'orange', items: [] },
                op: { name: 'OP Boosts', color: 'red', items: [] },
            };

            SHOP_ITEMS.forEach(item => {
                if (state.inventory[item.id] > 0) {
                    categories[item.category].items.push(item);
                }
            });

            return `
                <div class="flex flex-col gap-6">
                    ${Object.entries(categories).map(([catKey, catData]) => {
                        if (catData.items.length === 0) return '';
                        
                        const colorClasses = {
                            blue: 'border-blue-500 bg-blue-50',
                            purple: 'border-purple-500 bg-purple-50',
                            orange: 'border-orange-500 bg-orange-50',
                            red: 'border-red-500 bg-red-50',
                            amber: 'border-amber-500 bg-amber-50'
                        };

                        return `
                            <div class="border-4 ${colorClasses[catData.color]} p-4 sm:p-6">
                                <h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                                <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4">
                                    ${catData.items.map(item => {
                                        const isEquipped = state.equippedItem === item.id;
                                        const isPermanent = item.permanent;
                                        return `
                                        <button 
                                            onclick="${isPermanent ? `toggleEquip('${item.id}')` : `useItem('${item.id}')`}" 
                                            ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} 
                                            class="inventory-slot p-4 has-item ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} ${isEquipped ? 'ring-4 ring-emerald-500' : ''}"
                                        >
                                            ${!isPermanent ? `<span class="absolute -top-2 -right-2 bg-slate-900 border-3 border-white text-white text-sm font-black w-8 h-8 flex items-center justify-center" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">${state.inventory[item.id]}</span>` : ''}
                                            ${isEquipped ? `<span class="absolute -top-2 -left-2 bg-emerald-500 border-3 border-white text-white text-xs font-black px-2 py-1" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">EQUIPPED</span>` : ''}
                                            <p class="text-sm font-black uppercase text-slate-900 text-center leading-tight mt-2">${item.name}</p>
                                            ${item.description ? `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.description}</p>` : `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.power > 1 ? item.power + 'x' : 'Special'}</p>`}
                                        </button>
                                    `}).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                    
                    ${Object.values(categories).every(cat => cat.items.length === 0) ? `
                        <div class="text-center py-16">
                            <p class="text-3xl font-black text-slate-400 uppercase mb-2">Storage Empty</p>
                            <p class="text-lg font-bold text-slate-400">Buy items from the Marketplace!</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        
    </script>
</body>
</html>
