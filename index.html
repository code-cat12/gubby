<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Pixelify Sans', sans-serif;
        }
        
        body {
            transition: background-color 0.5s ease;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 1;
        }
        
        .pixel-corners {
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .pixel-border {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8fafc 100%);
        }

        .pixel-border::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 4px;
            background: linear-gradient(135deg, #334155, #64748b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            clip-path: polygon(
                0 8px, 8px 8px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            will-change: transform;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-squish {
            animation: squish-click 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
        }

        @keyframes squish-click {
            0%   { transform: scale(1, 1); }
            25%  { transform: scale(1.05, 0.93); }
            50%  { transform: scale(0.97, 1.04); }
            75%  { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            font-weight: 900;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(10deg); opacity: 0; }
        }

        .disco-bg {
            animation: disco-flash 0.5s infinite;
        }
        
        @keyframes disco-flash {
            0% { background-color: #fecdd3; }
            25% { background-color: #ddd6fe; }
            50% { background-color: #bae6fd; }
            75% { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }

        .bbc-snow {
            position: fixed;
            width: 30px;
            height: 30px;
            background-image: url('https://static.wikia.nocookie.net/the-battle-bricks/images/9/92/BBC.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 9999;
            animation: snowfall linear infinite;
            image-rendering: pixelated;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.8;
            }
        }

        .floating-star {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatStar linear infinite;
            opacity: 0.7;
        }

        @keyframes floatStar {
            0% {
                transform: translateY(-100px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        .roblox-chat {
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 0;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            max-width: 320px;
            text-align: left;
            border: 4px solid #334155;
            pointer-events: none;
            word-wrap: break-word;
        }

        .pixel-button {
            position: relative;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border-radius: 0;
        }

        .pixel-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .pixel-button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .pixel-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 4px solid #334155;
            font-family: 'Pixelify Sans', monospace;
            border-radius: 0;
        }

        .pixel-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 4px solid #334155;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
            border-radius: 0;
        }

        .stat-display {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 3px solid #64748b;
            padding: 8px 16px;
            border-radius: 0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .stat-display {
                padding: 6px 12px;
            }
        }

        .pixel-badge {
            border: 3px solid;
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
        }

        .pixel-badge-large {
            border: 3px solid;
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        @media (max-width: 768px) {
            .pixel-badge-large {
                min-height: 42px;
                padding: 6px 12px;
            }
        }


        .health-bar {
            background: #cbd5e1;
            border: 3px solid #1e293b;
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .health-bar-fill {
            background: linear-gradient(to bottom, #ef4444, #dc2626);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .market-item {
            background: white;
            border: 4px solid #64748b;
            transition: all 0.1s ease;
        }

        .market-item:hover:not(.disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            border-color: #334155;
        }

        .inventory-slot {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4px solid #94a3b8;
            position: relative;
            aspect-ratio: 1;
            transition: all 0.1s ease;
        }

        .inventory-slot.has-item {
            border-color: #475569;
            background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%);
        }

        .inventory-slot:hover:not(.disabled) {
            transform: scale(1.05);
            border-color: #334155;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        .gubby-float {
            animation: float 3s ease-in-out infinite;
        }

        .pixel-shadow {
            box-shadow: 
                4px 4px 0 rgba(0,0,0,0.1),
                8px 8px 0 rgba(0,0,0,0.05);
        }

        .scanlines {
            position: relative;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .action-button {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 4px solid #334155;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }

        .action-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .action-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .stat-display {
                width: 100%;
                text-align: center;
                padding: 6px 12px;
            }
            
            .action-button {
                width: 100%;
                max-width: none !important;
            }
            
            header .pixel-card {
                flex-direction: column !important;
                align-items: center !important;
            }
            
            header .pixel-card > div:first-child {
                width: 100%;
                justify-content: center !important;
                flex-wrap: wrap;
                gap: 0.5rem !important;
            }
            
            header .pixel-card > div:last-child {
                width: 100%;
                justify-content: center !important;
            }
            
            .gubby-container {
                width: 60vw !important;
                height: 60vw !important;
                max-width: 300px;
                max-height: 300px;
            }
            
            .pixel-badge {
                font-size: 10px;
                padding: 5px 12px;
            }
            
            .market-item {
                padding: 1rem !important;
            }
            
            .market-item p {
                font-size: 0.75rem !important;
            }
            
            .inventory-slot {
                padding: 0.75rem !important;
            }
        }
    </style>
</head>

    <script>
        const gubbyImgUrl = "https://static.wikia.nocookie.net/parasprunki-fanon/images/1/1e/Gubby.webp";
        
        const CURRENCIES = {

        const DESTINATIONS = [
            { id: 'battle', name: 'Battle World', req: 0, mult: 50, priceMod: 0.1, prestigeMod: 0.02, color: 'bg-red-100', themeColor: '#fee2e2', bgImage: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4hEt7rWn2oZfOgmQaLq8bv9SikOV3W6J6AQ&s', img: 'https://static.wikia.nocookie.net/the-battle-bricks/images/9/92/BBC.png', requiresItems: ['hyperbike', 'vulcan', 'ivory', 'crimson'] },

            { id: 'hawaii', name: 'Hawaii', req: 5, mult: 5, priceMod: 0.75, prestigeMod: 0.4, color: 'bg-green-100', themeColor: '#dcfce7', bgImage: 'https://i.pinimg.com/originals/5e/b7/28/5eb728f74875abdba6c3c44ace2399ff.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/beach-3d-icon-png-download-9708027.png' },
            { id: 'starlight', name: 'Starlight Sky', req: 10, mult: 15, priceMod: 0.5, prestigeMod: 0.16, color: 'bg-purple-100', themeColor: '#f5f3ff', bgImage: 'https://www.codedex.io/images/intermediate-python/intermediate-python.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/night-sky-3d-icon-png-download-11664446.png' },
            { id: 'void', name: 'The Void', req: 15, mult: 30, priceMod: 0.25, prestigeMod: 0.064, color: 'bg-blue-100', themeColor: '#eff6ff', bgImage: 'https://i.pinimg.com/originals/2b/93/c2/2b93c2d26ea042ef05ec0fc6dbac7de6.gif', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-3d-icon-png-download-6308159.png' }
        ];

        const CONVERSION_RATES = {
            'plains': 1,
            'hawaii': 25,
            'starlight': 75,
            'void': 150,
            'battle': 500
        };

        const SHOP_ITEMS = [
            { id: 'rainbow', name: 'Rainbow', category: 'small', baseCost: 100, power: 10, duration: 15, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/rainbow-3d-icon-png-download-4659629.png' },
            { id: 'mega', name: 'Mega', category: 'small', baseCost: 450, power: 25, duration: 12, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Glowing-Star-3d-icon.png' },
            { id: 'omega', name: 'Omega', category: 'small', baseCost: 1200, power: 120, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/diamond-3d-icon-png-download-8249311.png' },
            { id: 'oracle', name: 'Oracle', category: 'medium', baseCost: 5000, power: 0, duration: 25, img: 'https://static.vecteezy.com/system/resources/thumbnails/041/644/156/small/3d-stock-market-ticker-with-upward-trend-arrow-icon-png.png' },
            { id: 'godly', name: 'Godly', category: 'medium', baseCost: 15000, power: 400, duration: 20, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/king-crown-3d-icon-png-download-10707831.png' },
            { id: 'legendary', name: 'Legendary', category: 'medium', baseCost: 75000, power: 1000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/gold-medal-3d-icon-png-download-11613166.png' },
            { id: 'mythic', name: 'Mythic', category: 'large', baseCost: 250000, power: 5000, duration: 9, img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSghOJb2-ZD1lymQCT1S_dYisQmoX1dIDYzdg&s' },
            { id: 'divine', name: 'Divine', category: 'large', baseCost: 1000000, power: 25000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/compass-astrology-3d-icon-png-download-13124447.png' },
            { id: 'celestial', name: 'Celestial', category: 'large', baseCost: 5000000, power: 100000, duration: 8, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/planets-3d-icon-png-download-11683976.png' },
            { id: 'void', name: 'Void', category: 'large', baseCost: 15000000, power: 500000, duration: 7, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-station-3d-icon-png-download-6308159.png' },
            { id: 'titan', name: 'Titan', category: 'op', baseCost: 100000000, power: 5000000, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/robot-3d-icon-png-download-7577797.png?f=webp' },
            { id: 'eternal', name: 'Eternal', category: 'op', baseCost: 500000000, power: 50000000, duration: 12, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/atom-3d-icon-png-download-5522651.png' },
            { id: 'infinite', name: 'Infinite', category: 'op', baseCost: 2500000000, power: 250000000, duration: 15, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Infinity-3d-icon.png' },
            { id: 'hyperbike', name: 'Hyperbike', category: 'special', baseCost: 50000000000, power: 500000000, duration: 0, description: 'Permanent OP Multiplier', permanent: true, img: 'https://i.postimg.cc/TPWGjvnd/image.png' },
            { id: 'vulcan', name: 'Vulcan', category: 'special', baseCost: 100000000000, power: 1000000000, duration: 0, description: 'Permanent OP Multiplier', permanent: true, img: 'https://i.postimg.cc/qMbd9vLC/image.png' },
            { id: 'ivory', name: 'Ivory', category: 'special', baseCost: 500000000000, power: 5000000000, duration: 0, description: 'Permanent OP Multiplier', permanent: true, img: 'https://i.postimg.cc/bNv7Hjj5/image.png' },
            { id: 'crimson', name: 'Crimson', category: 'special', baseCost: 1000000000000, power: 10000000000, duration: 0, description: 'Permanent OP Multiplier', permanent: true, img: 'https://i.postimg.cc/B6syjrp9/image.png' }
        ];

        const QUESTS = [
            { id: 'clicks_100', name: 'Beginner Clicker', description: 'Click Gubby 100 times', type: 'clicks', target: 100, reward: 500 },
            { id: 'clicks_500', name: 'Dedicated Clicker', description: 'Click Gubby 500 times', type: 'clicks', target: 500, reward: 2500 },
            { id: 'clicks_1000', name: 'Expert Clicker', description: 'Click Gubby 1,000 times', type: 'clicks', target: 1000, reward: 10000 },
            { id: 'gold_1000', name: 'First Fortune', description: 'Earn 1,000 gold total', type: 'gold', target: 1000, reward: 1500 },
            { id: 'gold_10000', name: 'Growing Wealth', description: 'Earn 10,000 gold total', type: 'gold', target: 10000, reward: 15000 },
            { id: 'gold_100000', name: 'Rich Clicker', description: 'Earn 100,000 gold total', type: 'gold', target: 100000, reward: 150000 },
            { id: 'buy_and_use', name: 'Power Boost', description: 'Buy and use any boost item', type: 'buy_and_use', target: 1, reward: 3000 },
            { id: 'use_5_boosts', name: 'Boost Master', description: 'Buy and use 5 boost items', type: 'use', target: 5, reward: 15000 },
            { id: 'buy_10_items', name: 'Shopping Spree', description: 'Buy and use 10 boost items total', type: 'buy', target: 10, reward: 20000 },
        ];

        let state = {
            clicks: 0,
            lifetimeClicks: 0,
            totalClicksSession: 0,
            gold: 0,
            activeBuff: null,
            theme: 'plains',
            showTravelModal: false,
            showMarketModal: false,
            showStorageModal: false,
            showQuestModal: false,
            inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
            prestigeLevel: 0,
            marketMultiplier: 1,
            marketTrend: 'stable',
            marketQueue: [1.1, 0.8, 1.4],
            showOracle: false,
            marketCategory: null,
            notification: null,
            stickyChat: null,
            stickyChatUser: null,
            stickyChatTimer: 0,
            showAdmin: false,
            adminLog: [],
            discoEventTimer: 0,
            showItemPopup: false,
            itemPopupId: null,
            itemPopupQty: 1,
            activeQuests: [],
            completedQuests: 0,
            completedQuestIds: [],
            equippedItem: null,
        };

        let titleClickCount = 0;
        let titleClickTimer = null;

        function updateState(newState, skipRender = false) {
            state = { ...state, ...newState };
            if (!skipRender) render();
        }

        function getItemPrice(item) {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const priceMod = world ? world.priceMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            return (item.baseCost * priceMod * 1.25) / rate;
        }

        function getAscensionCost() {
            const rate = CONVERSION_RATES[state.theme];
            const isBattleWorld = state.theme === 'battle';
            const baseCost = 600;
            const multiplier = isBattleWorld ? 1.275 : 1.2;
            const basePrestigeCost = Math.floor(baseCost * Math.pow(multiplier, state.prestigeLevel));
            return basePrestigeCost / rate;
        }

        function formatCost(cost) {
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key === 'Enter') {
                const cmdText = e.target.value.trim();
                if (!cmdText) return;
                
                const parts = cmdText.split(' ');
                const command = parts[0].toLowerCase();
                let message = "";
                let changes = {};
                
                if (command === '/money') {
                    const amt = parseFloat(parts[1]) || 0;
                    changes.gold = state.gold + amt;
                    message = `Money added: ${amt}`;
                } else if (command === '/rebirth') {
                    const lvl = parseInt(parts[1]);
                    if (!isNaN(lvl)) {
                        changes.prestigeLevel = lvl;
                        message = "Prestige level set to " + lvl;
                    } else {
                        message = "Usage: /rebirth [n]";
                    }
                } else if (command === '/give') {
                    const itemId = parts[1]?.toLowerCase();
                    const amount = parseInt(parts[2]) || 1;
                    const itemExists = SHOP_ITEMS.find(i => i.id === itemId);
                    if (itemExists) {
                        changes.inventory = { ...state.inventory, [itemId]: (state.inventory[itemId] || 0) + amount };
                        message = `Gave ${amount}x ${itemExists.name}`;
                    } else {
                        message = `Error: Item '${itemId}' not found`;
                    }
                } else if (command === '/quest') {
                    if (state.activeQuests.length > 0) {
                        const updatedQuests = state.activeQuests.map(q => ({ ...q, completed: true, progress: q.target }));
                        changes.activeQuests = updatedQuests;
                        message = `All ${state.activeQuests.length} active quest(s) completed! Claim them in the Quests menu.`;
                    } else {
                        message = "No active quests to complete";
                    }
                } else {
                    message = "Commands: /money [n], /rebirth [n], /give [id] [amt], /quest";
                }

                const newLogs = [message, ...state.adminLog].slice(0, 10);
                updateState({ ...changes, adminLog: newLogs });
                e.target.value = "";
            }
        }

        function triggerTitleClick() {
            titleClickCount++;
            clearTimeout(titleClickTimer);
            if (titleClickCount >= 3) {
                updateState({ showAdmin: !state.showAdmin });
                titleClickCount = 0;
            } else {
                titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
            }
        }

        function handleMainClick(e) {
            if (e.cancelable) e.preventDefault();
            if (e.type === 'mousedown' && e.button !== 0) return;
            
            // Calculate permanent multiplier from equipped special items
            let permanentMultiplier = 1;
            if (state.equippedItem && ['hyperbike', 'vulcan', 'ivory', 'crimson'].includes(state.equippedItem)) {
                const equippedSpecialItem = SHOP_ITEMS.find(i => i.id === state.equippedItem);
                if (equippedSpecialItem && equippedSpecialItem.power) {
                    permanentMultiplier = equippedSpecialItem.power;
                }
            }
            
            const currentPower = (state.prestigeLevel + 1) * (state.activeBuff && state.activeBuff.id !== 'oracle' ? state.activeBuff.power : 1) * permanentMultiplier;
            
            // Trigger squish animation on the inner container
            const gubbyElement = document.querySelector('.gubby-container');
            if (gubbyElement) {
                gubbyElement.classList.remove('animate-squish');
                void gubbyElement.offsetWidth;
                gubbyElement.classList.add('animate-squish');
                // Remove after animation to reset
                setTimeout(() => gubbyElement.classList.remove('animate-squish'), 400);
            }

            state.clicks = state.clicks + currentPower;
            state.totalClicksSession = state.totalClicksSession + 1;
            state.lifetimeClicks = state.lifetimeClicks + 1;

            // Update click counter inline to avoid full re-render interrupting float animation
            const clicksEl = document.querySelector('.clicks-live');
            if (clicksEl) clicksEl.textContent = state.clicks.toLocaleString(undefined, {maximumFractionDigits: 0});
            const totalEl = document.querySelector('.total-live');
            if (totalEl) totalEl.textContent = state.lifetimeClicks.toLocaleString(undefined, {maximumFractionDigits: 0});

            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const particle = document.createElement('div');
            particle.className = `particle text-amber-400`;
            particle.style.cssText = `left:${clientX}px;top:${clientY}px;font-size:2.5rem;font-weight:900;text-shadow:3px 3px 0 rgba(0,0,0,0.5);`;
            particle.textContent = `+${currentPower}`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
            
            checkQuestProgress();
        }

        function sellClicks() {
            if (state.clicks > 0) {
                const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
                const currentWorldMult = currentWorld ? currentWorld.mult : 1;
                const totalGoldEarned = (state.clicks * state.marketMultiplier * currentWorldMult) / CONVERSION_RATES[state.theme];
                updateState({
                    gold: state.gold + totalGoldEarned,
                    clicks: 0,
                    notification: { title: "MARKET SOLD!", message: `Sold for ${totalGoldEarned.toFixed(2)} ${CURRENCIES[state.theme].name}s!`, type: "success" }
                });
                checkQuestProgress();
            }
        }

        function travelTo(destId) {
            const destination = DESTINATIONS.find(d => d.id === destId);
            
            // Check if destination requires items
            if (destination.requiresItems) {
                const hasAllItems = destination.requiresItems.every(itemId => state.inventory[itemId] > 0);
                if (!hasAllItems) {
                    updateState({
                        notification: {
                            title: "LOCKED!",
                            message: `You need all 4 Battle Brick items to unlock ${destination.name}!`,
                            type: "error"
                        }
                    });
                    return;
                }
            }
            
            const oldRate = CONVERSION_RATES[state.theme];
            const newRate = CONVERSION_RATES[destId];
            const conversionFactor = oldRate / newRate;
            const newGold = state.gold * conversionFactor;
            updateState({
                theme: destId,
                gold: newGold,
                showTravelModal: false,
                notification: { 
                    title: "LOCATION CHANGED", 
                    message: `Welcome to ${destination.name}. Currency converted to ${CURRENCIES[destId].name}s!`, 
                    type: "info" 
                }
            });
        }

        function ascend() {
            const cost = getAscensionCost();
            if (state.gold < cost) return;
            const nextPrestige = state.prestigeLevel + 1;
            
            // Update quest progress for prestige quests
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.type === 'prestige') {
                    return { ...quest, progress: (quest.progress || 0) + 1 };
                }
                return quest;
            });
            
            updateState({
                prestigeLevel: nextPrestige,
                gold: 0, clicks: 0, totalClicksSession: 0,
                inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
                activeBuff: null, showOracle: false,
                notification: { title: "ASCENDED!", message: `Prestige ${nextPrestige} reached!`, type: "success" },
                activeQuests: updatedQuests
            });
            checkQuestProgress();
        }

        function openItemPopup(itemId) {
            updateState({ showItemPopup: true, itemPopupId: itemId, itemPopupQty: 1, showMarketModal: false });
        }

        function setItemQty(delta) {
            const newQty = Math.max(1, Math.min(25, state.itemPopupQty + delta));
            state.itemPopupQty = newQty;
            // Update UI directly without full re-render
            const qtyInput = document.querySelector('.qty-input');
            if (qtyInput) qtyInput.value = newQty;
            const totalEl = document.querySelector('.popup-total');
            const buyBtn = document.querySelector('.popup-buy-btn');
            const popupItem = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (popupItem && totalEl) {
                const unitPrice = getItemPrice(popupItem);
                const totalPrice = unitPrice * newQty;
                const canAfford = state.gold >= totalPrice;
                totalEl.textContent = formatCost(totalPrice);
                totalEl.className = 'popup-total font-black text-2xl ' + (canAfford ? 'text-slate-900' : 'text-red-500');
                if (buyBtn) {
                    buyBtn.disabled = !canAfford;
                    buyBtn.textContent = canAfford ? ('Purchase' + (newQty > 1 ? ' x' + newQty : '')) : 'Cannot Afford';
                    buyBtn.className = 'popup-buy-btn w-full py-4 font-black uppercase text-lg pixel-button ' + (canAfford ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-400 cursor-not-allowed');
                }
            }
        }

        function setItemQtyManual(val) {
            const parsed = parseInt(val);
            if (!isNaN(parsed)) {
                const newQty = Math.max(1, Math.min(25, parsed));
                state.itemPopupQty = newQty;
                const totalEl = document.querySelector('.popup-total');
                const buyBtn = document.querySelector('.popup-buy-btn');
                const popupItem = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
                if (popupItem && totalEl) {
                    const unitPrice = getItemPrice(popupItem);
                    const totalPrice = unitPrice * newQty;
                    const canAfford = state.gold >= totalPrice;
                    totalEl.textContent = formatCost(totalPrice);
                    totalEl.className = 'popup-total font-black text-2xl ' + (canAfford ? 'text-slate-900' : 'text-red-500');
                    if (buyBtn) {
                        buyBtn.disabled = !canAfford;
                        buyBtn.textContent = canAfford ? ('Purchase' + (newQty > 1 ? ' x' + newQty : '')) : 'Cannot Afford';
                        buyBtn.className = 'popup-buy-btn w-full py-4 font-black uppercase text-lg pixel-button ' + (canAfford ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-400 cursor-not-allowed');
                    }
                }
            }
        }

        function buyItemFromPopup() {
            const item = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (!item) return;
            const unitPrice = getItemPrice(item);
            const totalPrice = unitPrice * state.itemPopupQty;
            if (state.gold >= totalPrice) {
                // Update quest progress for buy_and_use quests
                const updatedQuests = state.activeQuests.map(quest => {
                    if (quest.type === 'buy_and_use' && !quest.hasBought) {
                        return { ...quest, hasBought: true };
                    }
                    return quest;
                });
                
                updateState({
                    gold: state.gold - totalPrice,
                    inventory: { ...state.inventory, [item.id]: (state.inventory[item.id] || 0) + state.itemPopupQty },
                    showItemPopup: false,
                    itemPopupId: null,
                    itemPopupQty: 1,
                    activeQuests: updatedQuests
                });
                checkQuestProgress();
            }
        }

        function useItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (state.inventory[itemId] > 0 && !state.activeBuff) {
                // Update quest progress for use and buy quests
                const updatedQuests = state.activeQuests.map(quest => {
                    if (quest.type === 'use' || quest.type === 'buy') {
                        return { ...quest, progress: (quest.progress || 0) + 1 };
                    } else if (quest.type === 'buy_and_use' && quest.hasBought) {
                        return { ...quest, progress: 1 };
                    }
                    return quest;
                });
                
                if (itemId === 'oracle') {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        activeBuff: { ...item, timeLeft: item.duration }, 
                        showOracle: true,
                        showStorageModal: false,
                        activeQuests: updatedQuests
                    });
                } else {
                    updateState({ 
                        inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, 
                        activeBuff: { ...item, timeLeft: item.duration },
                        showStorageModal: false,
                        activeQuests: updatedQuests
                    });
                }
                checkQuestProgress();
            }
        }

        function toggleEquip(itemId) {
            const wasEquipped = state.equippedItem === itemId;
            if (state.equippedItem === itemId) {
                updateState({ equippedItem: null });
            } else {
                updateState({ equippedItem: itemId });
            }
            
            // Clear all existing falling particles
            document.querySelectorAll('.floating-star').forEach(star => star.remove());
            
            // Restart particle generation with correct image
            createFloatingStars();
        }

        function generateQuest() {
            const availableQuests = QUESTS.filter(q => {
                // Don't include quests that are already active
                const alreadyActive = state.activeQuests.some(aq => aq.id === q.id);
                if (alreadyActive) return false;
                
                // Don't include quests that have been completed
                const alreadyCompleted = state.completedQuestIds.includes(q.id);
                if (alreadyCompleted) return false;
                
                if (q.type === 'prestige' && state.prestigeLevel < 1) return true;
                if (q.type === 'clicks' && state.lifetimeClicks < q.target) return true;
                if (q.type === 'gold') return true;
                if (q.type === 'buy' || q.type === 'use' || q.type === 'buy_and_use') return true;
                return false;
            });
            
            if (availableQuests.length > 0) {
                const quest = availableQuests[Math.floor(Math.random() * availableQuests.length)];
                const newQuest = { ...quest, progress: 0, completed: false };
                updateState({ activeQuests: [...state.activeQuests, newQuest] });
            }
        }

        function refreshQuests() {
            const cost = 1000000000; // 1 billion
            const costInCurrency = cost / CONVERSION_RATES[state.theme];
            if (state.gold >= costInCurrency) {
                updateState({ 
                    gold: state.gold - costInCurrency,
                    activeQuests: [],
                    completedQuestIds: []
                });
            }
        }

        function checkQuestProgress() {
            if (state.activeQuests.length === 0) return;
            
            let updated = false;
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.completed) return quest;
                
                let progress = quest.progress || 0;
                
                switch (quest.type) {
                    case 'clicks':
                        progress = state.lifetimeClicks;
                        break;
                    case 'gold':
                        progress = state.gold;
                        break;
                    case 'buy':
                    case 'use':
                    case 'prestige':
                    case 'buy_and_use':
                        // Progress is already tracked per quest
                        break;
                }
                
                // For gold quests, convert the target to current currency
                let targetToCheck = quest.target;
                if (quest.type === 'gold') {
                    targetToCheck = quest.target / CONVERSION_RATES[state.theme];
                }
                
                const isComplete = progress >= targetToCheck;
                if (isComplete && !quest.completed) {
                    updated = true;
                    return { ...quest, progress, completed: true };
                } else if (progress !== quest.progress) {
                    updated = true;
                    return { ...quest, progress };
                }
                return quest;
            });
            
            if (updated) {
                updateState({ activeQuests: updatedQuests }, true); // Skip render to prevent flashing
            }
        }

        function claimQuest(questId) {
            const quest = state.activeQuests.find(q => q.id === questId);
            if (!quest || !quest.completed) return;
            
            const rewardInCurrency = quest.reward / CONVERSION_RATES[state.theme];
            
            updateState({ 
                gold: state.gold + rewardInCurrency,
                completedQuests: state.completedQuests + 1,
                activeQuests: state.activeQuests.filter(q => q.id !== questId),
                completedQuestIds: [...state.completedQuestIds, questId]
            });
        }

        setInterval(() => {
            const nextRate = 0.5 + (Math.random() * 1.25);
            state.marketMultiplier = state.marketQueue[0];
            state.marketTrend = state.marketQueue[0] > state.marketMultiplier ? 'up' : 'down';
            state.marketQueue = [...state.marketQueue.slice(1), nextRate];
            
            // Only re-render if admin console and modals are not open
            if (!state.showAdmin && !state.showMarketModal && !state.showStorageModal && !state.showItemPopup && !state.showQuestModal) {
                render();
            }
        }, 7000);

        setInterval(() => {
            let shouldRender = false;
            
            if (state.activeBuff) {
                if (state.activeBuff.timeLeft <= 1) { 
                    state.activeBuff = null;
                    state.showOracle = false;
                    shouldRender = true;
                } else { 
                    state.activeBuff.timeLeft = state.activeBuff.timeLeft - 1;
                    // Update buff timer display without full re-render
                    const buffDisplay = document.querySelector('.buff-timer-display');
                    if (buffDisplay) {
                        buffDisplay.textContent = `${state.activeBuff.name} (${state.activeBuff.timeLeft}s)`;
                    }
                }
            }
            if (state.discoEventTimer > 0) {
                state.discoEventTimer = state.discoEventTimer - 1;
                // Update disco timer display without full re-render
                const discoDisplay = document.querySelector('.disco-timer-display');
                if (discoDisplay) {
                    discoDisplay.textContent = `Disco Mode: ${state.discoEventTimer}s`;
                }
                if (state.discoEventTimer === 0) {
                    shouldRender = true; // Re-render to remove disco background
                }
            }
            
            // Only render if admin console is not open, no modals are open, and something important changed
            if (shouldRender && !state.showAdmin && !state.showMarketModal && !state.showStorageModal && !state.showItemPopup) {
                render();
            }
        }, 1000);

        function manageBBCSnow() {
            const existingSnow = document.querySelectorAll('.bbc-snow');
            
            if (state.equippedItem && ['hyperbike', 'vulcan', 'ivory', 'crimson'].includes(state.equippedItem)) {
                // Only create snow if there's less than 15 BBC items
                if (existingSnow.length < 15) {
                    const snow = document.createElement('div');
                    snow.className = 'bbc-snow';
                    snow.style.left = Math.random() * 100 + 'vw';
                    snow.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    snow.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(snow);
                    
                    setTimeout(() => {
                        snow.remove();
                    }, 8000);
                }
            } else {
                // Remove all BBC snow if nothing is equipped
                existingSnow.forEach(snow => snow.remove());
            }
        }

        setInterval(manageBBCSnow, 500);

        function createFloatingStars() {
            const starCount = 8;
            // Check if a Battle Brick item is equipped
            const isBattleBrickEquipped = state.equippedItem && ['hyperbike', 'vulcan', 'ivory', 'crimson'].includes(state.equippedItem);
            const imageUrl = isBattleBrickEquipped 
                ? 'https://static.wikia.nocookie.net/the-battle-bricks/images/9/92/BBC.png/revision/latest?cb=20230625223244'
                : 'https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png';
            
            for (let i = 0; i < starCount; i++) {
                setTimeout(() => {
                    const star = document.createElement('img');
                    star.src = imageUrl;
                    star.className = 'floating-star';
                    star.style.imageRendering = 'pixelated';
                    
                    const size = 30 + Math.random() * 40;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    
                    // Spawn on sides: either 0-30% or 70-100%
                    let leftPosition;
                    if (Math.random() < 0.5) {
                        // Left side (0-30%)
                        leftPosition = Math.random() * 30;
                    } else {
                        // Right side (70-100%)
                        leftPosition = 70 + Math.random() * 30;
                    }
                    star.style.left = leftPosition + 'vw';
                    star.style.top = '-100px';
                    
                    const drift = (Math.random() - 0.5) * 150; // More drift for variety
                    star.style.setProperty('--drift', drift + 'px');
                    
                    const duration = 12 + Math.random() * 6; // Slower fall (12-18 seconds)
                    star.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(star);
                    
                    setTimeout(() => {
                        star.remove();
                    }, duration * 1000);
                }, i * 2000);
            }
        }

        setInterval(createFloatingStars, 16000);
        createFloatingStars();

                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-red-600">OP Boosts</span>
                        </button>
                        <button onclick="updateState({marketCategory: 'special'})" class="${catBtnBase} border-amber-500 bg-gradient-to-r from-yellow-50 to-amber-50">
                            <span class="font-black text-base sm:text-lg uppercase tracking-widest text-amber-600">⭐ Special Items ⭐</span>
                        </button>
                    </div>
                `;
            }

            const itemsToShow = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return `
                <div class="flex flex-col gap-3">
                    <button onclick="updateState({marketCategory: null})" class="w-full text-left text-xs font-black uppercase text-slate-500 mb-2 flex items-center gap-2 hover:text-slate-700 tracking-wider">← Back to Categories</button>
                    ${itemsToShow.map(item => {
                        const price = getItemPrice(item);
                        const canAfford = state.gold >= price;
                        const alreadyOwned = item.permanent && state.inventory[item.id] > 0;
                        return `
                            <div class="flex items-center justify-between p-4 border-4 bg-white ${alreadyOwned ? 'border-emerald-500 bg-emerald-50' : canAfford ? 'border-slate-300' : 'border-slate-200 opacity-50'}">
                                <div class="text-left flex-1 mr-3">
                                    <p class="font-black text-base sm:text-lg uppercase text-slate-900 leading-tight">${item.name}${alreadyOwned ? ' ✓' : ''}</p>
                                    <p class="text-xs font-bold text-slate-400 mt-0.5">${item.permanent ? 'Permanent' : item.power > 1 ? item.power + 'x power' : 'Special'}${item.duration > 0 ? ' · ' + item.duration + 's' : ''}${item.description ? ' · ' + item.description : ''}</p>
                                </div>
                                <button onclick="event.stopPropagation(); ${alreadyOwned ? '' : `openItemPopup('${item.id}')`}" class="pixel-button shrink-0 ${alreadyOwned ? 'bg-emerald-500 border-emerald-700 text-white cursor-default' : canAfford ? 'bg-indigo-600 border-indigo-800 text-white' : 'bg-slate-200 border-slate-300 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">
                                    ${alreadyOwned ? 'OWNED' : 'BUY'}
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStorageContent() {
            const categories = {
                small: { name: 'Small Boosts', color: 'blue', items: [] },
                medium: { name: 'Medium Boosts', color: 'purple', items: [] },
                large: { name: 'Large Boosts', color: 'orange', items: [] },
                op: { name: 'OP Boosts', color: 'red', items: [] },
                special: { name: 'Special Items', color: 'amber', items: [] }
            };

            SHOP_ITEMS.forEach(item => {
                if (state.inventory[item.id] > 0) {
                    categories[item.category].items.push(item);
                }
            });

            return `
                <div class="flex flex-col gap-6">
                    ${Object.entries(categories).map(([catKey, catData]) => {
                        if (catData.items.length === 0) return '';
                        
                        const colorClasses = {
                            blue: 'border-blue-500 bg-blue-50',
                            purple: 'border-purple-500 bg-purple-50',
                            orange: 'border-orange-500 bg-orange-50',
                            red: 'border-red-500 bg-red-50',
                            amber: 'border-amber-500 bg-amber-50'
                        };

                        return `
                            <div class="border-4 ${colorClasses[catData.color]} p-4 sm:p-6">
                                <h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                                <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4">
                                    ${catData.items.map(item => {
                                        const isEquipped = state.equippedItem === item.id;
                                        const isPermanent = item.permanent;
                                        return `
                                        <button 
                                            onclick="${isPermanent ? `toggleEquip('${item.id}')` : `useItem('${item.id}')`}" 
                                            ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} 
                                            class="inventory-slot p-4 has-item ${!isPermanent && state.activeBuff !== null ? 'disabled' : ''} ${isEquipped ? 'ring-4 ring-emerald-500' : ''}"
                                        >
                                            ${!isPermanent ? `<span class="absolute -top-2 -right-2 bg-slate-900 border-3 border-white text-white text-sm font-black w-8 h-8 flex items-center justify-center" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">${state.inventory[item.id]}</span>` : ''}
                                            ${isEquipped ? `<span class="absolute -top-2 -left-2 bg-emerald-500 border-3 border-white text-white text-xs font-black px-2 py-1" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.3);">EQUIPPED</span>` : ''}
                                            <p class="text-sm font-black uppercase text-slate-900 text-center leading-tight mt-2">${item.name}</p>
                                            ${item.description ? `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.description}</p>` : `<p class="text-xs font-bold text-slate-500 text-center mt-1">${item.power > 1 ? item.power + 'x' : 'Special'}</p>`}
                                        </button>
                                    `}).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                    
                    ${Object.values(categories).every(cat => cat.items.length === 0) ? `
                        <div class="text-center py-16">
                            <p class="text-3xl font-black text-slate-400 uppercase mb-2">Storage Empty</p>
                            <p class="text-lg font-bold text-slate-400">Buy items from the Marketplace!</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
