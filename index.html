<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Icy Games is down for maintenance. Check back soon.">
<title>Icy Games Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim top bar, then a two-column hero (giant serif headline left, orange badge right), thin footer rule. One light, static look on purpose. */
:root {
  --paper: #efebe6;
  --paper-hi: #f5f2ee;
  --ink: #1b1613;
  --orange: #f2661b;
  --muted: #6d655e;
  --rule: #ddd6ce;
  --f-display: "Newsreader", "Georgia", "Times New Roman", serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  background: linear-gradient(180deg, var(--paper-hi) 0%, var(--paper) 40%);
  min-height: 100vh; display: flex; flex-direction: column;
}

.bar { border-bottom: 1px solid var(--rule); }
.inner { max-width: 1200px; margin: 0 auto; padding-inline: clamp(16px, 4.5vw, 64px); }
.bar .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { font-family: var(--f-body); font-style: normal; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; line-height: 1; color: var(--ink); text-decoration: none; display: inline-flex; align-items: flex-start; }
.logo svg { width: 10px; height: 10px; margin-left: 2px; margin-top: -3px; }
.pill-dark {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 12px 20px; border-radius: 999px;
  background: var(--ink); color: var(--paper-hi);
  font-weight: 600; font-size: 14px; text-decoration: none;
}
.pill-dark:hover { background: #000; }

main { flex: 1; }
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; padding-block: clamp(40px, 7vw, 72px) clamp(48px, 8vw, 96px); }
.copy { min-width: 0; }
.eyebrow { margin: 0 0 18px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 500;
  font-size: clamp(64px, 11.5vw, 156px); line-height: 0.92; letter-spacing: -0.045em;
}
h1 span { display: block; }
h1 em { font-style: italic; color: var(--orange); letter-spacing: -0.03em; }
.lede { margin: 44px 0 0; max-width: 29em; font-size: clamp(17px, 1.6vw, 19px); color: #3b342f; }
.actions { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-top: 36px; }
.pill-orange {
  display: inline-block; padding: 15px 30px; border-radius: 999px;
  background: var(--orange); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none;
}
.pill-orange:hover { background: #dd5710; }
.link { color: var(--ink); font-weight: 500; font-size: 15px; text-decoration: none; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
.link:hover { color: var(--orange); border-color: var(--orange); }
a:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }

.side { display: flex; justify-content: flex-end; padding-top: 20px; }
.badge { width: clamp(150px, 20vw, 220px); aspect-ratio: 1; max-width: 100%; filter: drop-shadow(0 18px 30px rgba(242, 102, 27, 0.25)); }

footer { border-top: 1px solid var(--rule); }
footer .inner { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 22px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

#flow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: block; }
.bar, main, footer { position: relative; z-index: 1; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .side { order: -1; justify-content: flex-start; padding-top: 0; }
  .badge { width: 120px; }
  .lede { margin-top: 28px; }
}
</style>
</head>
<body>
<canvas id="flow" aria-hidden="true"></canvas>

<header class="bar">
  <div class="inner">
    <a class="logo" href="#top">icy games<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 -10 L2.2 -2.2 L10 0 L2.2 2.2 L0 10 L-2.2 2.2 L-10 0 L-2.2 -2.2 Z" fill="#f2661b"/></svg></a>
  </div>
</header>

<main id="top">
  <section class="inner hero">
    <div class="copy">
      <p class="eyebrow">(01) — Scheduled maintenance</p>
      <h1><span>Be right</span><span><em>back,</em></span><span>we promise.</span></h1>
      <p class="lede">Icy Games is down for maintenance while we rebuild everything. Check back soon.</p>
      <div class="actions">
        <a class="pill-orange" href="https://discord.gg/Pxpp6v37Tz" target="_blank" rel="noopener">Join the Discord</a>
        <a class="link" href="https://x.com/gubbyclicker" target="_blank" rel="noopener">Follow on X</a>
      </div>
    </div>

    <div class="side">
      <svg class="badge" viewBox="0 0 200 200" role="img" aria-label="Under maintenance">
        <defs>
          <path id="ring" d="M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0"/>
        </defs>
        <circle cx="100" cy="100" r="98" fill="#f2661b"/>
        <text font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="500" letter-spacing="4.2" fill="#ffffff">
          <textPath href="#ring">UNDER MAINTENANCE • BACK SOON •</textPath>
        </text>
        <path d="M100 76 L106 94 L124 100 L106 106 L100 124 L94 106 L76 100 L94 94 Z" fill="#ffffff"/>
      </svg>
    </div>
  </section>
</main>

<footer>
  <div class="inner">
    <span>© 2026 Icy Games</span>
    <span>Status: maintenance</span>
  </div>
</footer>

<script>
(function () {
  const c = document.getElementById("flow");
  const ctx = c.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = ["242,102,27", "242,102,27", "255,140,66", "255,178,128"];
  let w = 0, h = 0, dots = [];

  function make(anywhere) {
    return {
      x: anywhere ? Math.random() * w : -10 - Math.random() * 60,
      y: Math.random() * h,
      r: Math.random() < 0.85 ? Math.random() * 1.3 + 0.7 : Math.random() * 1.6 + 2,
      sp: Math.random() * 0.8 + 0.3,
      a: Math.random() * 0.5 + 0.35,
      col: COLORS[(Math.random() * COLORS.length) | 0],
      ph: Math.random() * 6.283
    };
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(1400, Math.max(300, Math.round((w * h) / 1800)));
    dots = Array.from({ length: n }, () => make(true));
  }
  function angleAt(x, y, t) {
    return Math.sin(x * 0.0023 + t * 0.00025) * Math.cos(y * 0.0031 - t * 0.0002) * 1.1
         + Math.sin((x + y) * 0.0012 + t * 0.00015) * 0.35;
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      if (!reduce) {
        const ang = angleAt(d.x, d.y, t);
        d.x += Math.cos(ang) * d.sp + 0.3;
        d.y += Math.sin(ang) * d.sp;
        if (d.x > w + 10 || d.y < -10 || d.y > h + 10) { dots[i] = make(false); continue; }
      }
      const twinkle = 0.7 + 0.3 * Math.sin(t * 0.0025 + d.ph);
      ctx.fillStyle = "rgba(" + d.col + "," + (d.a * twinkle).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  window.addEventListener("resize", () => { resize(); if (reduce) frame(0); });
  resize();
  if (reduce) frame(0); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
