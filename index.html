<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease;
            touch-action: manipulation;
        }
        
        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }

        .gubby-container:active {
            transform: scale(1.15, 0.85);
            transition: transform 0.03s ease-out;
        }

        .animate-squish {
            animation: squish-fast 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes squish-fast {
            0% { transform: scale(1.15, 0.85); }
            50% { transform: scale(0.95, 1.05); }
            100% { transform: scale(1, 1); }
        }

        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        .disco-bg {
            animation: disco-flash 0.5s infinite;
        }
        @keyframes disco-flash {
            0% { background-color: #fecdd3; }
            25% { background-color: #ddd6fe; }
            50% { background-color: #bae6fd; }
            75% { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }

        .roblox-chat {
            background: #ffffff;
            color: #000000;
            padding: 10px 18px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 280px;
            text-align: left;
            border: 1px solid #e2e8f0;
            pointer-events: none;
            word-wrap: break-word;
        }

        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-emerald-50 overflow-x-hidden">
    <div id="root"></div>

    <script>
        const gubbyImgUrl = "https://static.wikia.nocookie.net/parasprunki-fanon/images/1/1e/Gubby.webp";
        
        const CURRENCIES = {
            plains: { name: 'Gold', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/star-coin-3d-icon-png-download-11254734.png' },
            hawaii: { name: 'Seashell', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/seashell-3d-icon-png-download-9708035.png' },
            starlight: { name: 'Star', icon: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Glowing-Star-3d-icon.png' },
            void: { name: 'Galaxy', icon: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-3d-icon-png-download-6308179.png' }
        };

        const DESTINATIONS = [
            { id: 'plains', name: 'Gubby Plains', req: 0, mult: 1, priceMod: 1, prestigeMod: 1, color: 'bg-emerald-50', themeColor: '#f0fdf4', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/grass-3d-icon-png-download-9405100.png' },
            { id: 'hawaii', name: 'Hawaii', req: 5, mult: 5, priceMod: 0.75, prestigeMod: 0.4, color: 'bg-green-100', themeColor: '#dcfce7', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/beach-3d-icon-png-download-9708027.png' },
            { id: 'starlight', name: 'Starlight Sky', req: 10, mult: 15, priceMod: 0.5625, prestigeMod: 0.16, color: 'bg-purple-100', themeColor: '#f5f3ff', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/night-sky-3d-icon-png-download-11664446.png' },
            { id: 'void', name: 'The Void', req: 15, mult: 30, priceMod: 0.4218, prestigeMod: 0.064, color: 'bg-blue-100', themeColor: '#eff6ff', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-3d-icon-png-download-6308159.png' }
        ];

        const CONVERSION_RATES = {
            'plains': 1,
            'hawaii': 25,
            'starlight': 75,
            'void': 150
        };

        const SHOP_ITEMS = [
            { id: 'rainbow', name: 'Rainbow', category: 'small', baseCost: 100, power: 10, duration: 15, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/rainbow-3d-icon-png-download-4659629.png' },
            { id: 'mega', name: 'Mega', category: 'small', baseCost: 450, power: 25, duration: 12, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Glowing-Star-3d-icon.png' },
            { id: 'omega', name: 'Omega', category: 'small', baseCost: 1200, power: 120, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/diamond-3d-icon-png-download-8249311.png' },
            { id: 'oracle', name: 'Oracle', category: 'medium', baseCost: 5000, power: 0, duration: 25, img: 'https://static.vecteezy.com/system/resources/thumbnails/041/644/156/small/3d-stock-market-ticker-with-upward-trend-arrow-icon-png.png' },
            { id: 'godly', name: 'Godly', category: 'medium', baseCost: 15000, power: 400, duration: 20, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/king-crown-3d-icon-png-download-10707831.png' },
            { id: 'warp', name: 'Time Warp', category: 'medium', baseCost: 25000, power: 1, duration: 1, description: '+30s Battle', img: 'https://cdn3d.iconscout.com/3d/premium/thumb/time-machine-3d-icon-png-download-8786172.png' },
            { id: 'legendary', name: 'Legendary', category: 'medium', baseCost: 75000, power: 1000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/gold-medal-3d-icon-png-download-11613166.png' },
            { id: 'mythic', name: 'Mythic', category: 'large', baseCost: 250000, power: 5000, duration: 9, img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSghOJb2-ZD1lymQCT1S_dYisQmoX1dIDYzdg&s' },
            { id: 'divine', name: 'Divine', category: 'large', baseCost: 1000000, power: 25000, duration: 9, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/compass-astrology-3d-icon-png-download-13124447.png' },
            { id: 'celestial', name: 'Celestial', category: 'large', baseCost: 5000000, power: 100000, duration: 8, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/planets-3d-icon-png-download-11683976.png' },
            { id: 'void', name: 'Void', category: 'large', baseCost: 15000000, power: 500000, duration: 7, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/space-station-3d-icon-png-download-6308159.png' },
            { id: 'titan', name: 'Titan', category: 'op', baseCost: 100000000, power: 5000000, duration: 10, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/robot-3d-icon-png-download-7577797.png?f=webp' },
            { id: 'eternal', name: 'Eternal', category: 'op', baseCost: 500000000, power: 50000000, duration: 12, img: 'https://cdn3d.iconscout.com/3d/premium/thumb/atom-3d-icon-png-download-5522651.png' },
            { id: 'infinite', name: 'Infinite', category: 'op', baseCost: 2500000000, power: 250000000, duration: 15, img: 'https://icons.iconarchive.com/icons/microsoft/fluentui-emoji-3d/512/Infinity-3d-icon.png' }
        ];

        let state = {
            clicks: 0,
            lifetimeClicks: 0,
            totalClicksSession: 0,
            gold: 0,
            activeBuff: null,
            theme: 'plains',
            showTravelModal: false,
            inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
            prestigeLevel: 0,
            peaceTreatyActive: false,
            marketMultiplier: 1,
            marketTrend: 'stable',
            marketQueue: [1.1, 0.8, 1.4],
            showOracle: false,
            isBattleActive: false,
            battleType: 'normal',
            battleHP: 0,
            maxBattleHP: 0,
            battleTimer: 0,
            normalBossCount: 0,
            megaBossCount: 0,
            marketCategory: null,
            notification: null,
            stickyChat: null,
            stickyChatUser: null,
            stickyChatTimer: 0,
            isSquishing: false,
            showAdmin: false,
            adminLog: [],
            discoEventTimer: 0
        };

        const PEACE_TREATY_COST = 5000000;
        let titleClickCount = 0;
        let titleClickTimer = null;
        let squishTimeout = null;
        let lastNormalTriggered = 0;
        let lastMegaTriggered = 0;

        function updateState(newState, skipRender = false) {
            state = { ...state, ...newState };
            if (!skipRender) render();
        }

        function buyPeaceTreaty() {
            if (state.peaceTreatyActive) return;
            
            if (state.prestigeLevel < 1) {
                updateState({ notification: { title: "LOCKED", message: "Reach Prestige 1 to unlock Peace Treaty!", type: "info" } });
                return;
            }

            if (state.gold >= PEACE_TREATY_COST) {
                updateState({ 
                    peaceTreatyActive: true, 
                    gold: state.gold - PEACE_TREATY_COST,
                    notification: { title: "PEACE SIGNED", message: "Peace Treaty activated! No more bosses will appear.", type: "success" }
                });
            }
        }

        function getItemPrice(item) {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const priceMod = world ? world.priceMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            return (item.baseCost * priceMod) / rate;
        }

        function getAscensionCost() {
            const world = DESTINATIONS.find(d => d.id === state.theme);
            const prestigeMod = world ? world.prestigeMod : 1;
            const rate = CONVERSION_RATES[state.theme];
            const basePrestigeCost = Math.floor(1000 * Math.pow(3, state.prestigeLevel));
            return (basePrestigeCost * prestigeMod) / rate;
        }

        function formatCost(cost) {
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key === 'Enter') {
                const cmdText = e.target.value.trim();
                if (!cmdText) return;
                
                const parts = cmdText.split(' ');
                const command = parts[0].toLowerCase();
                let message = "";
                let changes = {};
                
                if (command === '/multiplier') {
                    const amt = parseFloat(parts[1]);
                    if (!isNaN(amt)) {
                        changes.marketMultiplier = amt;
                        message = `Market Rate forced to ${amt}x`;
                    } else {
                        message = "Error: Use /multiplier <amount>";
                    }
                } else if (command === '/resetpeace') {
                    changes.peaceTreatyActive = false;
                    message = "Peace Treaty reset.";
                } else if (command === '/talk') {
                    const targetUser = parts[1];
                    if (targetUser && targetUser.startsWith('@')) {
                        const talkMsg = parts.slice(2).join(' ');
                        if (talkMsg) {
                            changes.stickyChat = talkMsg;
                            changes.stickyChatUser = targetUser;
                            changes.stickyChatTimer = 15;
                            message = `${targetUser}: ${talkMsg}`;
                        } else {
                            message = "Error: Missing message content.";
                        }
                    } else {
                        message = "Error: Invalid username. Use /talk <@username> <message>";
                    }
                } else if (command === '/money') {
                    const amt = parseFloat(parts[1]) || 0;
                    changes.gold = state.gold + amt;
                    message = `Money added: ${amt}`;
                } else if (command === '/rebirth') {
                    const lvl = parseInt(parts[1]) || 0;
                    changes.prestigeLevel = lvl;
                    message = `Prestige level set to ${lvl}`;
                } else if (command === '/give') {
                    const itemId = parts[1]?.toLowerCase();
                    const amount = parseInt(parts[2]) || 1;
                    const itemExists = SHOP_ITEMS.find(i => i.id === itemId);
                    
                    if (itemExists) {
                        changes.inventory = { ...state.inventory, [itemId]: (state.inventory[itemId] || 0) + amount };
                        message = `Gave ${amount}x ${itemExists.name}`;
                    } else {
                        message = `Error: Item '${itemId}' not found`;
                    }
                } else if (command === '/event') {
                    const eventName = parts[1]?.toLowerCase();
                    const eventTime = parseInt(parts[2]) || 30;
                    
                    if (eventName === 'disco') {
                        changes.discoEventTimer = eventTime;
                        changes.notification = { title: "DISCO PARTY!", message: `Everything is crazy for ${eventTime}s!`, type: "info" };
                        message = `Started event: DISCO (${eventTime}s)`;
                    } else {
                        message = `Error: Event '${eventName}' not available. Try: disco`;
                    }
                } else if (command === '/clear') {
                    updateState({ adminLog: [] });
                    e.target.value = "";
                    return;
                } else {
                    message = "Usage: /multiplier [n], /talk <@user> [msg], /money [n], /rebirth [n], /give [id] [amt], /event [name] [time]";
                }

                const newLogs = [message, ...state.adminLog].slice(0, 10);
                updateState({ ...changes, adminLog: newLogs });
                e.target.value = "";
            }
        }

        function triggerTitleClick() {
            titleClickCount++;
            clearTimeout(titleClickTimer);
            if (titleClickCount >= 3) {
                updateState({ showAdmin: !state.showAdmin });
                titleClickCount = 0;
            } else {
                titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
            }
        }

        function triggerBattle(type) {
            const isMega = type === 'mega';
            let hp = isMega ? 45 + (state.megaBossCount * 10) : 20 + (state.normalBossCount * 10);
            const baseTime = isMega ? 45 : 30;
            updateState({
                battleType: type,
                battleHP: hp,
                maxBattleHP: hp,
                battleTimer: baseTime + (isMega ? (state.megaBossCount * 8) : (state.normalBossCount * 5)),
                isBattleActive: true
            });
        }

        function endBattle(won) {
            const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
            const currentWorldMult = currentWorld ? currentWorld.mult : 1;
            if (won) {
                const reward = (state.maxBattleHP * (state.battleType === 'mega' ? 6 : 3) * currentWorldMult) / CONVERSION_RATES[state.theme];
                updateState({
                    isBattleActive: false,
                    gold: state.gold + reward,
                    megaBossCount: state.battleType === 'mega' ? state.megaBossCount + 1 : state.megaBossCount,
                    normalBossCount: state.battleType === 'normal' ? state.normalBossCount + 1 : state.normalBossCount,
                    notification: { title: "VICTORY!", message: `Reward: ${reward.toFixed(2)} ${CURRENCIES[state.theme].name}s.`, type: "success" }
                });
            } else {
                updateState({ isBattleActive: false, notification: { title: "BATTLE FAILED!", message: `The boss escaped!`, type: "error" } });
            }
        }

        function handleMainClick(e) {
            if (e.cancelable) e.preventDefault();
            if (e.type === 'mousedown' && e.button !== 0) return;
            
            const currentPower = (state.prestigeLevel + 1) * (state.activeBuff && !['warp', 'oracle'].includes(state.activeBuff.id) ? state.activeBuff.power : 1);
            let nextState = { isSquishing: true };

            if (state.isBattleActive) {
                const nextHP = state.battleHP - currentPower;
                if (nextHP <= 0) {
                    endBattle(true);
                    return; 
                } else {
                    nextState.battleHP = nextHP;
                    nextState.totalClicksSession = state.totalClicksSession + 1;
                    nextState.lifetimeClicks = state.lifetimeClicks + 1;
                }
            } else {
                nextState.clicks = state.clicks + currentPower;
                nextState.totalClicksSession = state.totalClicksSession + 1;
                nextState.lifetimeClicks = state.lifetimeClicks + 1;
            }

            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const particle = document.createElement('span');
            particle.className = `particle text-4xl font-black ${state.isBattleActive ? 'text-red-600' : 'text-slate-900'}`;
            particle.innerText = state.isBattleActive ? 'HIT!' : `+${currentPower}`;
            particle.style.left = `${clientX}px`;
            particle.style.top = `${clientY}px`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 500);

            updateState(nextState);

            if (squishTimeout) clearTimeout(squishTimeout);
            squishTimeout = setTimeout(() => {
                updateState({ isSquishing: false });
            }, 80);
        }

        function sellClicks() {
            if (!state.isBattleActive && state.clicks > 0) {
                const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
                const currentWorldMult = currentWorld ? currentWorld.mult : 1;
                const totalGoldEarned = (state.clicks * state.marketMultiplier * currentWorldMult) / CONVERSION_RATES[state.theme];
                updateState({
                    gold: state.gold + totalGoldEarned,
                    clicks: 0,
                    notification: { title: "MARKET SOLD!", message: `Sold for ${totalGoldEarned.toFixed(2)} ${CURRENCIES[state.theme].name}s!`, type: "success" }
                });
            }
        }

        function travelTo(destId) {
            const oldRate = CONVERSION_RATES[state.theme];
            const newRate = CONVERSION_RATES[destId];
            const conversionFactor = oldRate / newRate;
            const newGold = state.gold * conversionFactor;
            updateState({
                theme: destId,
                gold: newGold,
                showTravelModal: false,
                notification: { 
                    title: "LOCATION CHANGED", 
                    message: `Welcome to ${DESTINATIONS.find(d => d.id === destId).name}. Currency converted to ${CURRENCIES[destId].name}s!`, 
                    type: "info" 
                }
            });
        }

        function ascend() {
            const cost = getAscensionCost();
            if (state.gold >= cost) {
                lastMegaTriggered = 0;
                lastNormalTriggered = 0;
                updateState({
                    prestigeLevel: state.prestigeLevel + 1,
                    gold: 0,
                    clicks: 0,
                    totalClicksSession: 0,
                    inventory: SHOP_ITEMS.reduce((acc, item) => ({...acc, [item.id]: 0}), {}),
                    activeBuff: null,
                    showOracle: false,
                    notification: { title: "ASCENDED!", message: `Prestige ${state.prestigeLevel + 1} reached!`, type: "success" }
                });
            }
        }

        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;
            const price = getItemPrice(item);
            if (state.gold >= price) {
                updateState({
                    gold: state.gold - price,
                    inventory: { ...state.inventory, [itemId]: (state.inventory[itemId] || 0) + 1 }
                });
            }
        }

        function useItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (state.inventory[itemId] > 0 && !state.activeBuff) {
                if (itemId === 'warp' && state.isBattleActive) {
                    updateState({ battleTimer: state.battleTimer + 30, inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 } });
                } else if (itemId === 'oracle') {
                    updateState({ inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, activeBuff: { ...item, timeLeft: item.duration }, showOracle: true });
                } else if (itemId !== 'warp') {
                    updateState({ inventory: { ...state.inventory, [itemId]: state.inventory[itemId] - 1 }, activeBuff: { ...item, timeLeft: item.duration } });
                }
            }
        }

        setInterval(() => {
            const nextRate = 0.5 + (Math.random() * 1.25);
            updateState({
                marketMultiplier: state.marketQueue[0],
                marketTrend: state.marketQueue[0] > state.marketMultiplier ? 'up' : 'down',
                marketQueue: [...state.marketQueue.slice(1), nextRate]
            });
        }, 7000);

        setInterval(() => {
            let nextState = {};
            if (state.activeBuff) {
                if (state.activeBuff.timeLeft <= 1) { nextState.activeBuff = null; nextState.showOracle = false; }
                else { nextState.activeBuff = { ...state.activeBuff, timeLeft: state.activeBuff.timeLeft - 1 }; }
            }
            if (state.isBattleActive) {
                if (state.battleTimer <= 1) endBattle(false);
                else { nextState.battleTimer = state.battleTimer - 1; }
            }
            if (state.discoEventTimer > 0) {
                nextState.discoEventTimer = state.discoEventTimer - 1;
            }
            if (state.stickyChatTimer > 0) {
                nextState.stickyChatTimer = state.stickyChatTimer - 1;
                if (nextState.stickyChatTimer === 0) {
                    nextState.stickyChat = null;
                    nextState.stickyChatUser = null;
                }
            }
            if (Object.keys(nextState).length > 0) updateState(nextState);
        }, 1000);

        setInterval(() => {
            if (state.totalClicksSession > 0 && !state.isBattleActive && !state.peaceTreatyActive) {
                if (state.totalClicksSession >= lastMegaTriggered + 750) {
                    lastMegaTriggered = state.totalClicksSession;
                    triggerBattle('mega');
                } else if (state.totalClicksSession >= lastNormalTriggered + 250) {
                    lastNormalTriggered = state.totalClicksSession;
                    triggerBattle('normal');
                }
            }
        }, 1000);

        function render() {
            const root = document.getElementById('root');
            const currentWorld = DESTINATIONS.find(d => d.id === state.theme);
            const currentCurrency = CURRENCIES[state.theme];
            const currentPrestigeCost = getAscensionCost();
            
            if (state.discoEventTimer > 0) {
                document.body.className = "disco-bg overflow-x-hidden";
            } else {
                document.body.className = "bg-emerald-50 overflow-x-hidden";
                document.body.style.backgroundColor = currentWorld?.themeColor || '#f0fdf4';
            }

            const activeElementId = document.activeElement ? document.activeElement.id : null;
            const previousValue = activeElementId === 'admin-input' ? document.activeElement.value : '';

            let peaceTagColor = "bg-red-500";
            let peaceTagText = "Peace (Locked)";
            if (state.peaceTreatyActive) {
                peaceTagColor = "bg-emerald-500";
                peaceTagText = "Peaceful";
            } else if (state.gold >= PEACE_TREATY_COST) {
                peaceTagColor = "bg-yellow-500"; 
                peaceTagText = "Peace (Available)";
            }

            root.innerHTML = `
                <div class="min-h-screen flex flex-col items-center px-4 py-2 select-none overflow-x-hidden pb-12 transition-colors duration-500">
                    
                    ${state.showAdmin ? `
                        <div id="admin-console" class="fixed bottom-24 left-4 right-4 z-[100] bg-slate-900 p-4 rounded-2xl shadow-2xl border border-slate-700 max-w-md mx-auto">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-black text-blue-400 uppercase">Admin / Terminal</span>
                                <button onclick="updateState({showAdmin: false})" class="text-slate-500 hover:text-white">✕</button>
                            </div>
                            <div class="mb-3 max-h-32 overflow-y-auto flex flex-col" id="admin-log-list">
                                ${state.adminLog.map(log => `<p class="text-[10px] font-mono text-emerald-400 py-0.5 border-b border-slate-800">> ${log}</p>`).join('')}
                            </div>
                            <input 
                                id="admin-input"
                                type="text" 
                                placeholder="/event disco 60" 
                                onkeydown="handleAdminCommand(event)"
                                class="w-full p-3 rounded-xl outline-none text-xs"
                                autocomplete="off"
                            />
                        </div>
                    ` : ''}

                    <button onclick="updateState({showTravelModal: true})" class="fixed top-6 right-6 z-[60] w-12 h-12 bg-white border-2 border-slate-100 rounded-full shadow-lg flex items-center justify-center group">
                        <i data-lucide="map" class="text-indigo-500 w-6 h-6 group-hover:rotate-12 transition-transform"></i>
                    </button>

                    ${state.notification ? `
                        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center">
                                <h4 class="font-black text-2xl mb-2 uppercase text-slate-900">${state.notification.title}</h4>
                                <p class="text-slate-500 mb-6 font-medium">${state.notification.message}</p>
                                <button onclick="updateState({notification: null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">Okay</button>
                            </div>
                        </div>
                    ` : ''}

                    ${state.showTravelModal ? `
                        <div class="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
                            <div class="bg-white p-8 rounded-[3rem] shadow-2xl max-w-3xl w-full">
                                <h4 class="font-black text-2xl text-center mb-8 uppercase text-slate-900">Choose Destination</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    ${DESTINATIONS.map(dest => {
                                        const isLocked = state.prestigeLevel < dest.req;
                                        return `
                                            <button 
                                                ${isLocked ? 'disabled' : ''}
                                                onclick="travelTo('${dest.id}')"
                                                class="p-6 rounded-[2rem] flex flex-col items-center gap-2 transition-all ${isLocked ? 'opacity-40 grayscale bg-slate-100' : `${dest.color} hover:scale-105 border-4 ${state.theme === dest.id ? 'border-indigo-500' : 'border-transparent'}`}"
                                            >
                                                <img src="${dest.img}" class="w-16 h-16 object-contain" />
                                                <span class="font-black text-[10px] uppercase">${dest.name}</span>
                                                <div class="flex flex-col items-center">
                                                    <span class="text-[10px] font-black text-indigo-600">x${dest.mult} Profit</span>
                                                </div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                <button onclick="updateState({showTravelModal: false})" class="w-full mt-8 text-slate-400 font-black uppercase text-[10px]">Close Map</button>
                            </div>
                        </div>
                    ` : ''}

                    <header class="z-20 w-full max-w-5xl flex flex-col items-center gap-3 mt-4 mb-2">
                        <h1 onclick="triggerTitleClick()" class="text-4xl font-black tracking-tighter uppercase text-slate-900 cursor-help active:scale-95 transition-transform text-center">Gubby Clicker</h1>
                        <div class="flex gap-2 items-center flex-wrap justify-center">
                            <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase">Prestige ${state.prestigeLevel}</span>
                            <span class="bg-amber-500 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase">${currentWorld?.name}</span>
                            <span class="${peaceTagColor} text-white px-3 py-1 rounded-full text-[10px] font-black uppercase shadow-sm transition-colors duration-500">${peaceTagText}</span>
                        </div>
                        
                        <div class="w-full bg-white px-8 py-5 rounded-[2.5rem] shadow-sm flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-4 flex-1 flex-wrap justify-center sm:justify-start">
                                <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Clicks</p><span class="text-xl font-black text-slate-900">${state.clicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span></div>
                                <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Total Clicks</p><span class="text-xl font-black text-slate-900">${state.lifetimeClicks.toLocaleString(undefined, {maximumFractionDigits: 0})}</span></div>
                                <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Market Rate</p><span class="text-xl font-black ${state.marketMultiplier >= 1.2 ? 'text-emerald-500' : 'text-slate-900'}">${state.marketMultiplier.toFixed(2)}x</span></div>
                                <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">${currentCurrency.name}s</p><div class="flex items-center gap-1"><img src="${currentCurrency.icon}" class="w-4 h-4"/><span class="text-xl font-black text-slate-900">${state.gold.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div></div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="ascend()" ${state.gold < currentPrestigeCost || state.isBattleActive ? 'disabled' : ''} class="px-5 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all ${state.gold >= currentPrestigeCost ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-300'}">Ascend (${formatCost(currentPrestigeCost)})</button>
                                <button onclick="sellClicks()" ${state.isBattleActive ? 'disabled' : ''} class="px-6 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all hover:brightness-105 shadow-md ${state.marketMultiplier >= 1.2 ? 'bg-emerald-400 text-white animate-pulse' : 'bg-yellow-400 text-slate-900'}">Sell</button>
                            </div>
                        </div>
                    </header>

                    <main class="z-10 relative flex flex-col items-center justify-center w-full min-h-[400px]">
                        <div class="h-24 mb-4 flex flex-col items-center justify-end">
                            ${state.stickyChat ? `
                                <div class="roblox-chat mb-4">
                                    <span class="text-blue-600">${state.stickyChatUser || '@System'}:</span> ${state.stickyChat}
                                </div>
                            ` : ''}
                            ${state.showOracle ? `
                                <div class="flex gap-2 mb-2">
                                    ${state.marketQueue.map((rate, idx) => `
                                        <div class="bg-slate-900 text-white px-3 py-1 rounded-lg flex flex-col items-center border border-indigo-400">
                                            <span class="text-[7px] font-bold uppercase opacity-60">Future ${idx + 1}</span>
                                            <span class="text-xs font-black ${rate >= 1.2 ? 'text-emerald-400' : rate <= 0.8 ? 'text-red-400' : 'text-white'}">${rate.toFixed(2)}x</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${state.isBattleActive ? `
                                <div class="flex flex-col items-center w-64">
                                    <span class="text-[10px] font-black uppercase text-red-600 mb-1">BOSS ${state.battleTimer}s</span>
                                    <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-red-600 transition-all" style="width: ${(state.battleHP / state.maxBattleHP) * 100}%"></div></div>
                                </div>
                            ` : state.activeBuff ? `<div class="bg-white px-6 py-2 rounded-full shadow-lg border-2 border-indigo-100"><span class="text-xs font-black uppercase text-indigo-600">${state.activeBuff.name} (${state.activeBuff.timeLeft}s)</span></div>` : ''}
                        </div>

                        <div 
                            onmousedown="handleMainClick(event)"
                            ontouchstart="handleMainClick(event)"
                            class="gubby-container w-64 h-64 flex items-center justify-center ${state.isSquishing ? 'animate-squish' : ''}"
                        >
                            <img src="${gubbyImgUrl}" class="w-full h-full object-contain drop-shadow-2xl pointer-events-none" />
                        </div>
                        ${state.discoEventTimer > 0 ? `<div class="mt-4 px-4 py-1 bg-white/20 backdrop-blur rounded-full text-[10px] font-black text-white uppercase animate-pulse">Disco Mode Active: ${state.discoEventTimer}s</div>` : ''}
                    </main>

                    <div class="z-20 w-full max-w-6xl flex flex-col lg:flex-row gap-6 mt-8">
                        <section class="bg-white p-8 rounded-[3rem] shadow-sm flex-1">
                            <div class="flex justify-between items-center mb-8 px-2">
                                <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">Marketplace</h3>
                                
                                ${state.peaceTreatyActive ? `
                                    <div class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase flex items-center gap-2 shadow-sm">
                                        PEACEFUL
                                    </div>
                                ` : `
                                    <button 
                                        onclick="buyPeaceTreaty()" 
                                        class="${state.gold >= PEACE_TREATY_COST ? 'bg-emerald-500' : 'bg-slate-400'} text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:scale-105 active:scale-95"
                                    >
                                        Peace (5M)
                                    </button>
                                `}
                            </div>
                            ${renderMarketContent()}
                        </section>

                        <section class="bg-white p-8 rounded-[3rem] shadow-sm flex-1">
                            <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 mb-6">Storage</h3>
                            <div class="grid grid-cols-4 gap-4">
                                ${SHOP_ITEMS.map(item => `
                                    <button onclick="useItem('${item.id}')" ${state.inventory[item.id] === 0 || (state.activeBuff !== null && item.id !== 'warp') ? 'disabled' : ''} class="flex flex-col items-center p-4 rounded-[2rem] relative ${state.inventory[item.id] > 0 ? 'bg-slate-50' : 'opacity-20 grayscale'}">
                                        <img src="${item.img}" class="w-10 h-10 mb-2 object-contain"/>
                                        <span class="absolute -top-1 -right-1 bg-slate-900 text-white text-[8px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">${state.inventory[item.id]}</span>
                                        <p class="text-[8px] font-black uppercase text-slate-900 text-center">${item.name}</p>
                                    </button>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
            
            if (activeElementId === 'admin-input') {
                const newInput = document.getElementById('admin-input');
                if (newInput) {
                    newInput.focus();
                    newInput.value = previousValue;
                    newInput.setSelectionRange(previousValue.length, previousValue.length);
                }
            } else if (state.showAdmin && !activeElementId) {
                const newInput = document.getElementById('admin-input');
                if (newInput) newInput.focus();
            }
        }

        function renderMarketContent() {
            const catBtnBase = "w-full bg-white border p-6 rounded-2xl flex justify-between items-center hover:bg-slate-50 transition-all group shadow-sm active:scale-[0.98]";
            if (!state.marketCategory) {
                return `
                    <div class="flex flex-col gap-4">
                        <button onclick="updateState({marketCategory: 'small'})" class="${catBtnBase} border-blue-500/20">
                            <span class="font-black text-sm uppercase tracking-widest text-blue-600">Small Boosts</span>
                            <i data-lucide="arrow-right" class="text-blue-400 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                        <button onclick="updateState({marketCategory: 'medium'})" class="${catBtnBase} border-purple-500/20">
                            <span class="font-black text-sm uppercase tracking-widest text-purple-600">Medium Boosts</span>
                            <i data-lucide="arrow-right" class="text-purple-400 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                        <button onclick="updateState({marketCategory: 'large'})" class="${catBtnBase} border-orange-500/20">
                            <span class="font-black text-sm uppercase tracking-widest text-orange-600">Large Boosts</span>
                            <i data-lucide="arrow-right" class="text-orange-400 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                        <button onclick="updateState({marketCategory: 'op'})" class="${catBtnBase} border-red-500/20">
                            <span class="font-black text-sm uppercase tracking-widest text-red-600">OP BOOSTS</span>
                            <i data-lucide="arrow-right" class="text-red-400 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                `;
            }

            const itemsToShow = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return `
                <div class="flex flex-col gap-3">
                    <button onclick="updateState({marketCategory: null})" class="w-full text-left text-[10px] font-black uppercase text-slate-400 mb-2 flex items-center gap-1 hover:text-slate-600">← Back</button>
                    ${itemsToShow.map(item => {
                        const price = getItemPrice(item);
                        return `
                            <button onclick="buyItem('${item.id}')" class="flex items-center justify-between p-4 rounded-2xl bg-white hover:bg-slate-50 transition-all shadow-sm ${state.gold < price ? 'opacity-50' : ''}">
                                <div class="flex items-center gap-4">
                                    <img src="${item.img}" class="w-10 h-10 object-contain"/>
                                    <div>
                                        <p class="font-black text-[10px] uppercase text-slate-900">${item.name}</p>
                                        ${item.description ? `<p class="text-[8px] font-medium text-slate-400 uppercase mt-1">${item.description}</p>` : ''}
                                    </div>
                                </div>
                                <span class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] font-black">${formatCost(price)}</span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
