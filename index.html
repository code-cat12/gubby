<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubby Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Pixelify Sans', sans-serif; }
        body {
            transition: background-color 0.5s ease;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 1;
            will-change: transform;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        @media (max-width: 768px) {
            body::before { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        }
        .pixel-corners {
            clip-path: polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
        }
        .gubby-container {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            will-change: transform;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }
        .gubby-float { animation: float 3s ease-in-out infinite; }
        .animate-squish { animation: squish-click 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important; }
        @keyframes squish-click {
            0%   { transform: scale(1, 1); }
            25%  { transform: scale(1.05, 0.93); }
            50%  { transform: scale(0.97, 1.04); }
            75%  { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }
        .particle {
            pointer-events: none;
            position: fixed;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            font-weight: 900;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(10deg); opacity: 0; }
        }
        .disco-bg { animation: disco-flash 0.5s infinite; }
        @keyframes disco-flash {
            0%   { background-color: #fecdd3; }
            25%  { background-color: #ddd6fe; }
            50%  { background-color: #bae6fd; }
            75%  { background-color: #bbf7d0; }
            100% { background-color: #fef08a; }
        }
        .floating-star {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatStar linear infinite;
            opacity: 0.7;
        }
        @keyframes floatStar {
            0%   { transform: translateY(-100px) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(100vh) translateX(var(--drift)) rotate(360deg); opacity: 0; }
        }
        .pixel-button {
            position: relative;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border-radius: 0;
        }
        .pixel-button:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .pixel-button:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
        .pixel-button:disabled { opacity: 0.5; cursor: not-allowed; }
        #admin-input {
            background: #1e293b;
            color: #38bdf8;
            border: 4px solid #334155;
            font-family: 'Pixelify Sans', monospace;
            border-radius: 0;
        }
        .pixel-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 4px solid #334155;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
            border-radius: 0;
        }
        .stat-display {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 3px solid #64748b;
            padding: 8px 16px;
            border-radius: 0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) { .stat-display { padding: 6px 12px; } }
        .pixel-badge {
            border: 3px solid;
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            border-radius: 0;
        }
        .health-bar {
            background: #cbd5e1;
            border: 3px solid #1e293b;
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }
        .health-bar-fill {
            background: linear-gradient(to bottom, #ef4444, #dc2626);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }
        .market-item {
            background: white;
            border: 4px solid #64748b;
            transition: all 0.1s ease;
        }
        .market-item:hover:not(.disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            border-color: #334155;
        }
        .inventory-slot {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4px solid #94a3b8;
            position: relative;
            aspect-ratio: 1;
            transition: all 0.1s ease;
        }
        .inventory-slot.has-item { border-color: #475569; background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%); }
        .inventory-slot:hover:not(.disabled) { transform: scale(1.05); border-color: #334155; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
        .pixel-shadow { box-shadow: 4px 4px 0 rgba(0,0,0,0.1), 8px 8px 0 rgba(0,0,0,0.05); }
        .modal-backdrop { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .action-button {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 4px solid #334155;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .action-button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        .action-button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        @media (max-width: 768px) {
            /* Stats bar */
            .stat-display { padding: 6px 10px; }
            /* Action buttons — 2 columns on mobile */
            .action-button { padding: 14px 10px !important; }
            .action-button i { width: 2rem !important; height: 2rem !important; }
            .action-button .text-lg { font-size: 0.8rem !important; }
            .action-button .text-xs { font-size: 0.65rem !important; }
            /* Gubby smaller on mobile */
            .gubby-container { width: 58vw !important; height: 58vw !important; max-width: 260px; max-height: 260px; }
            /* Badges */
            .pixel-badge { font-size: 10px; padding: 5px 10px; }
            /* Header title */
            .gubby-title { font-size: 2rem !important; }
            /* Stats row wraps nicely */
            .stats-row { gap: 0 !important; }
            .stats-row .stat-display { border-right: 2px solid #e2e8f0; padding: 8px 10px; }
            .stats-row .stat-display:last-child { border-right: none; }
            /* Action grid — 2 col */
            .actions-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; flex-direction: unset !important; }
            /* Sell + Ascend row */
            .sell-ascend-row { flex-direction: row !important; gap: 8px !important; }
            .sell-ascend-row button { flex: 1; }
            /* Modal content sizing */
            .modal-content { max-height: 92vh !important; border-radius: 0 !important; }
        }
        body.dark-mode { background-color: #0f172a !important; color: #e2e8f0 !important; }
        body.dark-mode .bg-white { background-color: #1e293b !important; }
        body.dark-mode .bg-slate-50 { background-color: #1e293b !important; }
        body.dark-mode .bg-slate-100 { background-color: #263248 !important; }
        body.dark-mode .pixel-card { background-color: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .action-button { background-color: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .text-slate-900 { color: #f1f5f9 !important; }
        body.dark-mode .text-slate-700 { color: #cbd5e1 !important; }
        body.dark-mode .text-slate-600 { color: #94a3b8 !important; }
        body.dark-mode .text-slate-500 { color: #64748b !important; }
        body.dark-mode input, body.dark-mode textarea { background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }
        @keyframes opalShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        body.large-text .text-xs { font-size: 0.85rem !important; }
        body.large-text .text-sm { font-size: 1rem !important; }
        body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (max-width: 480px) { .settings-grid { grid-template-columns: 1fr; } }

        /* Purple Accent Theme */
        body.purple-accent .pixel-button.bg-indigo-600,
        body.purple-accent .pixel-button.bg-emerald-500,
        body.purple-accent button.bg-indigo-600 { background-color: #7c3aed !important; border-color: #5b21b6 !important; }
        body.purple-accent .bg-indigo-600 { background-color: #7c3aed !important; }
        body.purple-accent .border-indigo-500, body.purple-accent .border-indigo-700, body.purple-accent .border-indigo-800 { border-color: #7c3aed !important; }
        body.purple-accent .text-indigo-600, body.purple-accent .text-indigo-500 { color: #7c3aed !important; }
        body.purple-accent .pixel-badge.bg-indigo-600 { background-color: #7c3aed !important; border-color: #5b21b6 !important; }
        body.purple-accent .action-button:hover { border-color: #7c3aed !important; }
        body.purple-accent .pixel-card { border-color: #7c3aed !important; box-shadow: 6px 6px 0 #5b21b6 !important; }
        body.purple-accent header .pixel-card { border-color: #7c3aed !important; }
        body.purple-accent .bg-indigo-50 { background-color: #f5f3ff !important; }
        body.purple-accent input:focus { outline-color: #7c3aed !important; }
    </style>
    <style>
        #loading-screen {
            position: fixed; inset: 0; z-index: 99998; background: #0a0a0a;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        #loading-screen.fade-out { animation: loadingFadeOut 0.6s ease forwards; }
        @keyframes loadingFadeOut { to { opacity: 0; pointer-events: none; } }
        #loading-gubby-wrapper { position: relative; width: 280px; height: 280px; cursor: pointer; }
        #loading-gubby-spin { width: 280px; height: 280px; image-rendering: pixelated; display: block; filter: drop-shadow(0 0 20px rgba(255,255,255,0.15)); }
        #loading-title { font-family: 'Pixelify Sans', monospace; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 4px; text-transform: uppercase; }
        #loading-sub { font-family: 'Pixelify Sans', monospace; font-size: 12px; font-weight: 700; color: #475569; letter-spacing: 2px; text-transform: uppercase; }
        #loading-bar-wrap { width: 260px; height: 8px; background: #1e293b; border: 2px solid #334155; overflow: hidden; }
        #loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 0.1s linear; }
        #loading-click-hint { font-family: 'Pixelify Sans', monospace; font-size: 11px; color: #1e293b; letter-spacing: 1px; transition: color 0.3s; height: 16px; }
        #loading-click-hint.heating { color: #dc2626; animation: hintPulse 0.4s ease-in-out infinite alternate; }
        @keyframes hintPulse { from { opacity: 0.6; } to { opacity: 1; } }
        #demon-intro {
            position: fixed; inset: 0; z-index: 99997;
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZ7p45bM49NJfL5kjC0NFmbyA1E8pFe4VcnA&s') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            animation: demonFlicker 0.08s linear infinite;
        }
        #demon-intro::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
        @keyframes demonFlicker { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(0.93); } }
        #demon-intro-inner { position: relative; z-index: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 0 24px; }
        #demon-intro-title { font-family: 'Pixelify Sans', monospace; font-size: 48px; font-weight: 900; color: #dc2626; text-transform: uppercase; letter-spacing: 6px; text-shadow: 0 0 30px rgba(220,38,38,0.9), 0 0 60px rgba(220,38,38,0.4); animation: demonTitlePulse 1.5s ease-in-out infinite alternate; }
        @keyframes demonTitlePulse { from { text-shadow: 0 0 20px rgba(220,38,38,0.8); } to { text-shadow: 0 0 50px rgba(220,38,38,1), 0 0 100px rgba(220,38,38,0.5); } }
        #demon-intro-sub { font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 700; color: #fca5a5; letter-spacing: 2px; max-width: 420px; line-height: 1.6; }
        #demon-intro-close { font-family: 'Pixelify Sans', monospace; font-size: 13px; font-weight: 900; color: #fff; background: #dc2626; border: 3px solid #991b1b; padding: 10px 32px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); transition: all 0.1s; }
        #demon-intro-close:hover { transform: translate(1px,1px); box-shadow: 3px 3px 0 rgba(0,0,0,0.5); }
        #demon-intro-close:active { transform: translate(3px,3px); box-shadow: none; }
        #demon-flash { position: fixed; inset: 0; z-index: 99990; background: rgba(220,38,38,0.35); pointer-events: none; opacity: 0; }
        #demon-flash.flashing { animation: demonRedFlash 0.18s ease-out forwards; }
        @keyframes demonRedFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
        #landscape-overlay { display: none; position: fixed; inset: 0; z-index: 99999; background: #0f172a; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
        .rotate-phone { animation: rotatePhone 1.5s ease-in-out infinite alternate; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 100% { transform: rotate(90deg); } }
    </style>
</head>
<body class="bg-emerald-50 overflow-x-hidden">
    <div id="demon-flash"></div>
    <div id="loading-screen">
        <div id="loading-title">Gubby Clicker</div>
        <div id="loading-gubby-wrapper" onclick="loadingGubbyClick()">
            <img id="loading-gubby-spin" src="https://static.wikia.nocookie.net/parasprunki-fanon/images/1/1e/Gubby.webp" alt="Gubby" />
        </div>
        <div id="loading-bar-wrap"><div id="loading-bar-fill"></div></div>
        <div id="loading-sub">Loading...</div>
        <div id="loading-click-hint"></div>
    </div>
    <div id="demon-intro" style="display:none;">
        <div id="demon-intro-inner">
            <div id="demon-intro-title">Demon Mode</div>
            <div id="demon-intro-sub">You have awakened something dark.<br>20x multiplier — stacks with everything.<br>The screen bleeds red. There is no going back.</div>
            <button id="demon-intro-close" onclick="closeDemonIntro()">Enter ›</button>
        </div>

            <p class="text-slate-400 font-bold text-sm uppercase tracking-wider">This game requires landscape mode</p>
        </div>
    </div>
    <div id="root"></div>


    <script>
        const GUBBY_DEFAULT_IMG = "https://static.wikia.nocookie.net/parasprunki-fanon/images/1/1e/Gubby.webp";
        function getGubbyImgUrl() {
            if (state.equippedSkin) {
                const skin = SHOP_ITEMS.find(i => i.id === state.equippedSkin && i.isSkin);
                if (skin) return skin.skinImg;
            }
            return GUBBY_DEFAULT_IMG;
        }

        const CURRENCIES = {
            plains:   { name: 'Gold',    icon: '' },
            forest:   { name: 'Shard',   icon: '' },
            glacier:  { name: 'Crystal', icon: '' },
            medieval: { name: 'Crown',   icon: '' },
        };

        const DESTINATIONS = [
            { id: 'plains',   name: 'Peaceful Grasslands', chapter: 'I',   req: 0,  mult: 1,   priceMod: 1,    color: 'bg-emerald-50', themeColor: '#f0fdf4', bgImage: 'https://cdnb.artstation.com/p/assets/images/images/053/135/427/original/pixel-jess-field-animation-final.gif?1661495887' },
            { id: 'forest',   name: 'Forest of Sins',      chapter: 'II',  req: 5,  mult: 5,   priceMod: 0.75, color: 'bg-green-900',  themeColor: '#14190f', bgImage: 'https://i.pinimg.com/originals/93/9e/92/939e9273e3d6ef4f281cda31e9e62488.gif' },
            { id: 'glacier',  name: 'Frosty Glaciers',     chapter: 'III', req: 10, mult: 15,  priceMod: 0.5,  color: 'bg-sky-100',    themeColor: '#e0f2fe', bgImage: 'https://cdna.artstation.com/p/assets/images/images/044/829/822/original/alex-bartlett-northernlights-anims.gif?1641268241' },
            { id: 'medieval', name: 'Medieval Times',      chapter: 'IV',  req: 20, mult: 30,  priceMod: 0.25, color: 'bg-slate-900',  themeColor: '#1e1b2e', bgImage: 'https://cdna.artstation.com/p/assets/images/images/083/367/432/original/kobe-ouano-vampire-castle-watermarked.gif?1735733105' },

        const CONVERSION_RATES = { plains: 1, forest: 25, glacier: 75, medieval: 150 };

        const SHOP_ITEMS = [
            { id: 'rainbow',  name: 'Rainbow',   category: 'small',  baseCost: 100,        power: 10,       duration: 15  },

            { id: 'divine',   name: 'Divine',    category: 'large',  baseCost: 1000000,    power: 25000,    duration: 9   },
            { id: 'celestial',name: 'Celestial', category: 'large',  baseCost: 5000000,    power: 100000,   duration: 8   },
            { id: 'void',     name: 'Void',      category: 'large',  baseCost: 15000000,   power: 500000,   duration: 7   },
            { id: 'titan',    name: 'Titan',     category: 'op',     baseCost: 100000000,  power: 5000000,  duration: 10  },
            { id: 'eternal',  name: 'Eternal',   category: 'op',     baseCost: 500000000,  power: 50000000, duration: 12  },
            { id: 'infinite', name: 'Infinite',  category: 'op',     baseCost: 2500000000, power: 250000000,duration: 15  },
            { id: 'perm_angel', name: 'Angel', category: 'perm_boost', baseCost: 1000000,  permMult: 10000, permanent: true, description: '10,000x permanent multiplier' },
            { id: 'perm_demon', name: 'Demon', category: 'perm_boost', baseCost: 5000000,  permMult: 25000, permanent: true, description: '25,000x permanent multiplier' },

        ];

        const WORLD_LORE = {

        let _audioCtx = null;

        function playTone({ type='sine', freq=440, freq2=null, gain=0.18, attack=0.01, decay=0.12, duration=0.15 }={}) {
            if (!state.soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator(), g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, ctx.currentTime + duration);
                g.gain.setValueAtTime(0, ctx.currentTime);
                g.gain.linearRampToValueAtTime(gain, ctx.currentTime + attack);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + attack + decay);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration + 0.05);
            } catch(e) {}
        }

        function formatLargeNumber(n, decimals) {
            decimals = decimals === undefined ? 2 : decimals;
            if (isNaN(n) || !isFinite(n)) return '0';
            if (n >= 1e12) { const exp = Math.floor(Math.log10(Math.abs(n))); return (n / Math.pow(10, exp)).toFixed(1) + 'e+' + exp; }
            return n.toLocaleString(undefined, { maximumFractionDigits: decimals });
        }
        function formatCost(cost) {
            if (cost >= 1e12) { const exp = Math.floor(Math.log10(Math.abs(cost))); return (cost / Math.pow(10, exp)).toFixed(1) + 'e+' + exp; }
            if (cost >= 1000000000) return (cost / 1000000000).toFixed(1) + 'B';
            if (cost >= 1000000) return (cost / 1000000).toFixed(1) + 'M';
            if (cost >= 1000) return (cost / 1000).toFixed(1) + 'k';
            return cost.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }

        function handleAdminCommand(e) {
            if (e.key !== 'Enter') return;
            const cmdText = e.target.value.trim();
            if (!cmdText) return;
            const parts = cmdText.split(' ');
            const command = parts[0].toLowerCase();
            let message = "", changes = {};

            if (command === '/money') {
                const amt = parseFloat(parts[1]) || 0;
                changes.gold = state.gold + amt;
                message = `Money added: ${amt}`;
            } else if (command === '/rebirth') {
                const arg = parts[1]?.toLowerCase();
                if (arg === 'infinity') { changes.prestigeLevel = 9999; changes.infinityRebirth = true; message = "∞ Infinity Rebirth activated!"; }
                else { const lvl = parseInt(parts[1]); if (!isNaN(lvl)) { changes.prestigeLevel = lvl; changes.infinityRebirth = false; message = "Prestige set to " + lvl; } else message = "Usage: /rebirth [n] | /rebirth infinity"; }
            } else if (command === '/give') {
                const sub = parts[1]?.toLowerCase();
                if (sub === 'all') {
                    const newInv = { ...state.inventory };
                    SHOP_ITEMS.forEach(i => { newInv[i.id] = (newInv[i.id] || 0) + 1; });
                    changes.inventory = newInv; message = `Gave 1x of all items`;
                } else {
                    const rawArgs = parts.slice(1);
                    const lastArg = rawArgs[rawArgs.length - 1];
                    const amount = !isNaN(parseInt(lastArg)) && SHOP_ITEMS.every(i => i.id !== lastArg.toLowerCase()) ? parseInt(lastArg) : 1;
                    const itemArgs = (amount > 1 || (!isNaN(parseInt(lastArg)) && !SHOP_ITEMS.find(i => i.id === lastArg.toLowerCase()))) ? rawArgs.slice(0, -1) : rawArgs;
                    const ids = itemArgs.slice(0, 25).map(a => a.toLowerCase());
                    if (ids.length === 0) { message = 'Usage: /give [id] [amt] | /give all'; }
                    else {
                        const newInv = { ...state.inventory }, given = [], missing = [];
                        ids.forEach(id => { const item = SHOP_ITEMS.find(i => i.id === id); if (item) { newInv[id] = (newInv[id]||0) + amount; given.push(item.name); } else missing.push(id); });
                        if (given.length) changes.inventory = newInv;
                        message = given.length ? `Gave ${amount}x: ${given.join(', ')}` : `Not found: ${missing.join(', ')}`;
                    }
                }

                if (state.activeQuests.length > 0) {
                    changes.activeQuests = state.activeQuests.map(q => ({ ...q, completed: true, progress: q.target }));

            } else {

            const cost = getAscensionCost();

            const nextPrestige = state.prestigeLevel + 1;
            const updatedQuests = state.activeQuests.map(q => q.type === 'prestige' ? { ...q, progress: (q.progress||0) + 1 } : q);
            const resetInventory = SHOP_ITEMS.reduce((acc, item) => ({
                ...acc,
                [item.id]: (item.category === 'perm_boost' || item.category === 'skin') ? (state.inventory[item.id] || 0) : 0
            }), {});
            const isMilestone = [5,10,25,50].includes(nextPrestige);
            updateState({
                prestigeLevel: nextPrestige, gold: 0, clicks: 0, totalClicksSession: 0,
                inventory: resetInventory, activeBuff: null, activeQuests: updatedQuests,
                notification: { title: isMilestone ? `✦ MILESTONE! Prestige ${nextPrestige}` : "Ascended!", message: `Prestige ${nextPrestige} reached!`, type: "success" }
            });
            SFX.prestige(); checkQuestProgress();
        }

        function openItemPopup(itemId) {
            updateState({ showItemPopup: true, itemPopupId: itemId, itemPopupQty: 1, showMarketModal: false });
        }
        function setItemQty(delta) {
            const newQty = Math.max(1, Math.min(25, state.itemPopupQty + delta));
            state.itemPopupQty = newQty;
            const qtyInput = document.querySelector('.qty-input');
            if (qtyInput) qtyInput.value = newQty;
            refreshPopupTotal();
        }
        function setItemQtyManual(val) {
            const parsed = parseInt(val);
            if (!isNaN(parsed)) { state.itemPopupQty = Math.max(1, Math.min(25, parsed)); refreshPopupTotal(); }
        }
        function refreshPopupTotal() {
            const item = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (!item) return;
            const total = getItemPrice(item) * state.itemPopupQty;
            const canAfford = state.gold >= total;
            const totalEl = document.querySelector('.popup-total');
            const buyBtn = document.querySelector('.popup-buy-btn');
            if (totalEl) { totalEl.textContent = formatCost(total); totalEl.className = 'popup-total font-black text-2xl ' + (canAfford ? 'text-slate-900' : 'text-red-500'); }
            if (buyBtn) { buyBtn.disabled = !canAfford; buyBtn.textContent = canAfford ? ('Purchase' + (state.itemPopupQty > 1 ? ' x'+state.itemPopupQty : '')) : 'Cannot Afford'; buyBtn.className = 'popup-buy-btn w-full py-4 font-black uppercase text-lg pixel-button ' + (canAfford ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-400 cursor-not-allowed'); }
        }
        function buyItemFromPopup() {
            const item = SHOP_ITEMS.find(i => i.id === state.itemPopupId);
            if (!item) return;
            const total = getItemPrice(item) * state.itemPopupQty;
            if (state.gold >= total) {
                const updatedQuests = state.activeQuests.map(q => q.type === 'buy_and_use' && !q.hasBought ? { ...q, hasBought: true } : q);
                updateState({ gold: state.gold - total, inventory: { ...state.inventory, [item.id]: (state.inventory[item.id]||0) + state.itemPopupQty }, showItemPopup: false, itemPopupId: null, itemPopupQty: 1, activeQuests: updatedQuests });
                checkQuestProgress();
            }
        }
        function useItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item || state.inventory[itemId] <= 0 || state.activeBuff) return;
            const updatedQuests = state.activeQuests.map(q => {
                if (q.type === 'use' || q.type === 'buy') return { ...q, progress: (q.progress||0) + 1 };
                if (q.type === 'buy_and_use' && q.hasBought) return { ...q, progress: 1 };
                return q;
            });
            if (itemId === 'xpmult') {
                updateState({ inventory: { ...state.inventory, [itemId]: state.inventory[itemId]-1 }, xpSurgeUntil: Date.now() + 15*60*1000, showStorageModal: false, activeQuests: updatedQuests, notification: { title: 'XP Surge!', message: '1.3x XP for 15 minutes!', type: 'success' } });
            } else {
                updateState({ inventory: { ...state.inventory, [itemId]: state.inventory[itemId]-1 }, activeBuff: { ...item, timeLeft: item.duration }, showStorageModal: false, activeQuests: updatedQuests });
            }
            checkQuestProgress(); SFX.useItem();
        }
        function toggleEquip(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;
            if (item.category === 'perm_boost') updateState({ equippedPermBoost: state.equippedPermBoost === itemId ? null : itemId });
            if (item.category === 'skin') {
                const newSkin = state.equippedSkin === itemId ? null : itemId;
                state.equippedSkin = newSkin;
                document.querySelectorAll('.floating-star').forEach(s => s.remove());
                createFloatingStars();
                render();
            }
        }

        function generateQuest() {
            const allQuests = state.demonMode ? [...QUESTS, ...DEMON_QUESTS] : QUESTS;
            const available = allQuests.filter(q => {
                if (state.activeQuests.some(aq => aq.id === q.id)) return false;
                if (state.completedQuestIds.includes(q.id)) return false;
                if (q.demonOnly && !state.demonMode) return false;
                return true;
            });
            if (available.length > 0) {
                const quest = available[Math.floor(Math.random() * available.length)];
                updateState({ activeQuests: [...state.activeQuests, { ...quest, progress: 0, completed: false }] });
            }
        }
        function checkQuestProgress() {
            if (state.activeQuests.length === 0) return;
            let updated = false;
            const updatedQuests = state.activeQuests.map(quest => {
                if (quest.completed) return quest;
                let progress = quest.progress || 0;
                switch (quest.type) {
                    case 'clicks': progress = state.lifetimeClicks; break;
                    case 'gold': progress = state.gold; break;
                    case 'prestige': progress = state.prestigeLevel; break;
                }
                const target = quest.type === 'gold' ? quest.target / CONVERSION_RATES[state.theme] : quest.target;
                const isComplete = progress >= target;
                if (isComplete && !quest.completed) { updated = true; return { ...quest, progress, completed: true }; }
                else if (progress !== quest.progress) { updated = true; return { ...quest, progress }; }
                return quest;
            });
            if (updated) updateState({ activeQuests: updatedQuests }, true);
        }
        function claimQuest(questId) {
            const quest = state.activeQuests.find(q => q.id === questId);
            if (!quest || !quest.completed) return;
            const rewardInCurrency = quest.reward / CONVERSION_RATES[state.theme];
            const updates = {
                gold: state.gold + rewardInCurrency,
                completedQuests: state.completedQuests + 1,
                activeQuests: state.activeQuests.filter(q => q.id !== questId),
                completedQuestIds: [...state.completedQuestIds, questId],
            };
            updateState(updates);
            SFX.questClaim();

            const loreReward = quest.loreReward;
            if (loreReward && !state.unlockedLore.includes(loreReward)) {
                setTimeout(() => {
                    const newLore = [...state.unlockedLore, loreReward];
                    const baseFive = ['lore_1','lore_2','lore_3','lore_4','lore_5'];
                    if (baseFive.every(id => newLore.includes(id)) && !newLore.includes('lore_6')) {
                        setTimeout(() => updateState({ unlockedLore: [...newLore, 'lore_6'], showLoreModal: 'lore_6' }), 3000);
                    }
                    updateState({ unlockedLore: newLore, showLoreModal: loreReward });
                }, 600);
            } else if (Math.random() < 0.12 && !quest.demonOnly) {
                const unowned = LORE_FRAGMENTS.filter(f => !state.unlockedLore.includes(f.id) && !f.secret && f.id !== 'lore_4' && f.id !== 'lore_5');
                if (unowned.length > 0) {
                    const frag = unowned[Math.floor(Math.random() * unowned.length)];
                    setTimeout(() => {
                        const newLore = [...state.unlockedLore, frag.id];
                        const baseFive = ['lore_1','lore_2','lore_3','lore_4','lore_5'];
                        if (baseFive.every(id => newLore.includes(id)) && !newLore.includes('lore_6')) {
                            setTimeout(() => updateState({ unlockedLore: [...newLore, 'lore_6'], showLoreModal: 'lore_6' }), 3000);
                        }
                        updateState({ unlockedLore: newLore, showLoreModal: frag.id });
                    }, 600);
                }
            }
        }

        // Market ticker
        setInterval(() => {
            state.marketMultiplier = state.marketQueue[0];
            state.marketQueue = [...state.marketQueue.slice(1), 0.5 + Math.random() * 1.25];
            if (!state.showAdmin && !state.showMarketModal && !state.showStorageModal && !state.showItemPopup && !state.showQuestModal && !state.showTravelModal && !state.showSettings) render();
        }, 7000);

        // Buff countdown
        setInterval(() => {
            let shouldRender = false;
            if (state.activeBuff) {
                if (state.activeBuff.timeLeft <= 1) { state.activeBuff = null; shouldRender = true; }
                else {
                    state.activeBuff.timeLeft--;
                    const el = document.querySelector('.buff-timer-display');
                    if (el) el.textContent = `${state.activeBuff.name} (${state.activeBuff.timeLeft}s)`;
                }
            }
            if (state.discoEventTimer > 0) {
                state.discoEventTimer--;
                if (state.discoEventTimer === 0) shouldRender = true;
            }
            if ((state.xpSurgeUntil || 0) > 0 && Date.now() >= state.xpSurgeUntil) { state.xpSurgeUntil = 0; shouldRender = true; }
            const marketEl = document.querySelector('.market-rate-live');
            if (marketEl) {
                const rate = state.marketMultiplier.toFixed(2);
                marketEl.innerHTML = `<span class="${parseFloat(rate) >= 1.2 ? 'text-emerald-600' : 'text-slate-900'}">${rate}x</span>`;
            }
            if (shouldRender) render();
        }, 1000);

        setInterval(() => { createFloatingStars(); }, 8000);


        const DAILY_REFRESH_MS = 24 * 60 * 60 * 1000;
        setInterval(() => {
            if (Date.now() - (state.questLastRefresh || 0) >= DAILY_REFRESH_MS) {
                state.questLastRefresh = Date.now(); state.completedQuestIds = []; state.activeQuests = []; render();
            }
        }, 60000);

        function createFloatingStars() {
            if (state.floatingStars === false) return;
            const hasSkinII = state.equippedSkin === 'skin_season_2' || state.equippedSkin === 'skin_season_3';
            if (!hasSkinII) return;
            const imgUrl = 'https://static.wikia.nocookie.net/roblox-find-the-cornbreads/images/2/2e/Star.png/revision/latest/thumbnail/width/360/height/360?cb=20230612014323';
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const star = document.createElement('img');
                    star.src = imgUrl; star.className = 'floating-star'; star.style.imageRendering = 'pixelated';
                    const size = 24 + Math.random()*24;
                    star.style.width = size + 'px'; star.style.height = size + 'px';
                    star.style.left = (Math.random() * 95) + 'vw';
                    star.style.top = '-80px';
                    star.style.setProperty('--drift', (Math.random()-0.5)*100 + 'px');
                    const dur = 14 + Math.random()*8;
                    star.style.animationDuration = dur + 's';
                    document.body.appendChild(star);
                    setTimeout(() => star.remove(), dur*1000);
                }, i * 800);
            }
        }

        // ── SETTINGS ────────────────────────────────────────────
        const SETTINGS_ROWS = [
            { key:'largeText',     icon:'type',               label:'Large Text',      desc:'Bigger UI font size',        onBorder:'border-blue-400',   onBg:'bg-blue-50',   onIcon:'text-blue-500',   onTrack:'bg-blue-500 border-blue-700'     },
            { key:'floatingStars', icon:'sparkles',           label:'Floating Stars',  desc:'Decorative falling stars',   onBorder:'border-violet-400', onBg:'bg-violet-50', onIcon:'text-violet-500', onTrack:'bg-violet-500 border-violet-700' },
            { key:'soundEnabled',  icon:'volume-2',           label:'Sound Effects',   desc:'All game sounds',            onBorder:'border-amber-400',  onBg:'bg-amber-50',  onIcon:'text-amber-500',  onTrack:'bg-amber-500 border-amber-700'   },
            { key:'clickSound',    icon:'mouse-pointer-click',label:'Click Sounds',    desc:'Sound on every click',       onBorder:'border-rose-400',   onBg:'bg-rose-50',   onIcon:'text-rose-500',   onTrack:'bg-rose-500 border-rose-700'     },
            { key:'showParticles', icon:'zap',                label:'Click Particles', desc:'Show +N pop on click',       onBorder:'border-amber-400',  onBg:'bg-amber-50',  onIcon:'text-amber-500',  onTrack:'bg-amber-500 border-amber-700'   },
            { key:'questNotif',    icon:'bell',               label:'Quest Notifs',    desc:'Pop-up on quest complete',   onBorder:'border-indigo-400', onBg:'bg-indigo-50', onIcon:'text-indigo-500', onTrack:'bg-indigo-500 border-indigo-700' },
            { key:'marketFlash',   icon:'trending-up',        label:'Market Flash',    desc:'Pulse sell at high rates',   onBorder:'border-emerald-400',onBg:'bg-emerald-50',onIcon:'text-emerald-500',onTrack:'bg-emerald-500 border-emerald-700'},
        ];
        function getSetting(key) { return state[key] !== false; }
        function toggleSetting(key) {
            const newVal = !getSetting(key); state[key] = newVal;
            if (key === 'largeText') { document.body.classList.toggle('large-text', newVal); }
            if (key === 'floatingStars') { if (!newVal) document.querySelectorAll('.floating-star').forEach(s => s.remove()); else createFloatingStars(); }
            const btn = document.querySelector('[data-setting="'+key+'"]');
            if (btn) {
                const cfg = SETTINGS_ROWS.find(r => r.key === key);
                if (cfg) {
                    btn.className = 'flex items-center justify-between border-4 ' + (newVal ? cfg.onBorder+' '+cfg.onBg : 'border-slate-200 bg-slate-50') + ' p-4 w-full text-left hover:border-slate-400 transition-colors';
                    const icon = btn.querySelector('i[data-lucide]'); if (icon) icon.className = 'w-5 h-5 flex-shrink-0 '+(newVal ? cfg.onIcon : 'text-slate-400');
                    const track = btn.querySelector('.setting-track'); if (track) track.className = 'w-14 h-7 border-4 setting-track '+(newVal ? cfg.onTrack : 'bg-slate-300 border-slate-500')+' relative flex-shrink-0';
                    const knob = btn.querySelector('.setting-knob'); if (knob) knob.style.left = newVal ? 'calc(100% - 20px)' : '2px';
                }
            }
        }

        function renderSettings() {
            function pxToggle(on, cfg) {
                return '<div class="w-14 h-7 border-4 setting-track '+(on?cfg.onTrack:'bg-slate-300 border-slate-500')+' relative flex-shrink-0"><div class="setting-knob absolute top-0.5 w-4 h-4 bg-white border-2 border-slate-300" style="transition:left 0.15s ease;left:'+(on?'calc(100% - 20px)':'2px')+'"></div></div>';

                +['soundEnabled','clickSound'].map(settingBtn).join('')

                +'</div></div></div>';
        }

        // ── MARKET / STORAGE RENDER ──────────────────────────────

                            <button onclick="${owned?'':'buySpecialItem(\''+item.id+'\')'}" class="pixel-button shrink-0 ${owned?'bg-emerald-500 border-emerald-700 text-white cursor-default':canAfford?'bg-indigo-600 border-indigo-800 text-white':'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'} px-5 py-2 font-black text-sm">${owned?'OWNED':'BUY'}</button>

                                      tab === 2 ? '✦ Stars fall from the sky' :
                                                  '✦ Star Gubby skin';

                            <div class="flex items-stretch gap-0">

                                        ${locked ? `<p class="text-xs font-bold text-red-300 mt-1">⚠ Requires ${SHOP_ITEMS.find(i=>i.id===prevSkinId)?.name||'previous level'}</p>` : ''}
                                        ${!owned && !locked ? `<p class="text-xs font-bold text-white/70 mt-1">${formatLargeNumber(price,0)} ${CURRENCIES[state.theme].name}</p>` : ''}

            if (!state.marketCategory) {

                    { id:'small',  label:'Small Boosts',  color:'border-blue-500 text-blue-600' },

                    { id:'large',  label:'Large Boosts',  color:'border-orange-500 text-orange-600' },

                return tabBar + '<div class="flex flex-col gap-3">' + cats.map(c => `<button onclick="updateState({marketCategory:'${c.id}'})" class="w-full bg-white border-4 p-4 flex justify-center items-center market-item ${c.color}"><span class="font-black text-base uppercase tracking-widest">${c.label}</span></button>`).join('') + '</div>';

            const items = SHOP_ITEMS.filter(i => i.category === state.marketCategory);
            return tabBar + '<div class="flex flex-col gap-3"><button onclick="updateState({marketCategory:null})" class="w-full text-left text-xs font-black uppercase text-slate-500 mb-2 flex items-center gap-2 hover:text-slate-700 tracking-wider">← Back</button>'

                    const price = getItemPrice(item), canAfford = state.gold >= price;
                    return `<div class="flex items-center justify-between p-4 border-4 bg-white ${canAfford?'border-slate-300':'border-slate-200 opacity-50'}">

        }

        function renderStorageContent() {
            const cats = {
                small:      { name: 'Small Boosts',     color: 'border-blue-500 bg-blue-50',     items: [] },
                medium:     { name: 'Medium Boosts',    color: 'border-purple-500 bg-purple-50',  items: [] },
                large:      { name: 'Large Boosts',     color: 'border-orange-500 bg-orange-50',  items: [] },
                op:         { name: 'OP Boosts',        color: 'border-red-500 bg-red-50',        items: [] },
                perm_boost: { name: 'Permanent Boosts', color: 'border-yellow-500 bg-yellow-50',  items: [] },
                skin:       { name: 'Season Skins',     color: 'border-purple-500 bg-purple-50',  items: [] },
            };
            SHOP_ITEMS.forEach(item => { if (state.inventory[item.id] > 0 && cats[item.category]) cats[item.category].items.push(item); });
            const hasAny = Object.values(cats).some(c => c.items.length > 0);
            if (!hasAny) return '<div class="text-center py-16"><p class="text-3xl font-black text-slate-400 uppercase mb-2">Storage Empty</p><p class="text-lg font-bold text-slate-400">Buy items from the Marketplace!</p></div>';
            return '<div class="flex flex-col gap-6">' + Object.entries(cats).map(([catKey, catData]) => {
                if (catData.items.length === 0) return '';
                if (catKey === 'skin') {
                    return `<div class="border-4 ${catData.color} p-4 sm:p-6"><h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                        <div class="flex flex-col gap-3">
                            ${catData.items.map(item => {
                                const isEquipped = state.equippedSkin === item.id;
                                return `<div class="flex items-center gap-4 p-3 border-4 bg-white ${isEquipped?'border-purple-500 bg-purple-50':'border-slate-200'}">
                                    <div class="flex-1 min-w-0">
                                        <p class="font-black text-sm uppercase text-slate-900">${item.name}</p>
                                        <p class="text-xs font-bold text-slate-500">${item.description.replace(/^Season [IVX]+ — /,'')}</p>
                                    </div>
                                    <button onclick="toggleEquip('${item.id}')" class="pixel-button px-4 py-2 font-black text-sm shrink-0 ${isEquipped?'bg-purple-600 border-purple-800 text-white':'bg-slate-200 border-slate-400 text-slate-700'}">${isEquipped?'UNEQUIP':'EQUIP'}</button>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }
                return `<div class="border-4 ${catData.color} p-4 sm:p-6"><h5 class="font-black text-base sm:text-lg uppercase mb-3 sm:mb-4 text-slate-900">${catData.name}</h5>
                    <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4">
                        ${catData.items.map(item => {
                            const isPermBoost = item.category === 'perm_boost';
                            const isEquipped = isPermBoost && state.equippedPermBoost === item.id;
                            const isPermanent = item.permanent;
                            return `<button onclick="${isPermanent?'toggleEquip(\''+item.id+'\')':'useItem(\''+item.id+'\')'}" ${!isPermanent&&state.activeBuff?'disabled':''} class="inventory-slot p-4 has-item ${!isPermanent&&state.activeBuff?'disabled':''} ${isEquipped?'ring-4 ring-emerald-500':''}">
                                ${!isPermanent?`<span class="absolute -top-2 -right-2 bg-slate-900 border-3 border-white text-white text-sm font-black w-8 h-8 flex items-center justify-center" style="box-shadow:2px 2px 0 rgba(0,0,0,0.3);">${state.inventory[item.id]}</span>`:''}
                                ${isEquipped?`<span class="absolute -top-2 -left-2 bg-emerald-500 border-3 border-white text-white text-xs font-black px-2 py-1" style="box-shadow:2px 2px 0 rgba(0,0,0,0.3);">ON</span>`:''}
                                <p class="text-sm font-black uppercase text-slate-900 text-center leading-tight">${item.name}</p>
                                <p class="text-xs font-bold text-slate-500 text-center mt-1">${item.description||(item.power>1?item.power+'x':'Special')}</p>
                            </button>`;

            }).join('') + '</div>';
        }

                    <button onclick="updateState({showTravelModal:true})" class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[60] w-12 h-12 sm:w-14 sm:h-14 bg-white pixel-button flex items-center justify-center group">

                                <div class="flex flex-col gap-3">
                                    ${QUESTS.map(quest => {

                                                </div>
                                            </div>
                                        </div>`;

                    ${state.showSettings ? renderSettings() : ''}

                                <p class="text-xs text-slate-500 font-bold">${state.unlockedLore.length} / ${LORE_FRAGMENTS.length} fragments found</p>
                                <button onclick="updateState({showLoreModal:null})" class="mt-2 bg-amber-600 text-white font-black uppercase text-xs px-6 py-3 tracking-widest hover:bg-amber-500 transition-colors">Close</button>
                            </div>
                        </div>` : '';
                    })() : ''}



                    ${(state.showFragmentsModal || state.showJournalModal) ? (() => {
                        const allSix = LORE_FRAGMENTS.every(f => state.unlockedLore.includes(f.id));
                        const activeTab = state.showJournalModal ? 'journal' : 'fragments';
                        return `<div class="fixed inset-0 z-[95] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md modal-backdrop" onclick="if(event.target===event.currentTarget)updateState({showFragmentsModal:false,showJournalModal:false})">
                            <div class="bg-white pixel-card w-full max-h-[90vh] flex flex-col modal-content" style="max-width:820px;border-width:2px;margin:8px;">
                                <!-- Header -->
                                <div class="flex justify-between items-center px-8 pt-7 pb-5 border-b-2 border-slate-200 flex-shrink-0">
                                    <div>
                                        <h4 class="font-black text-2xl uppercase text-slate-900">${activeTab === 'journal' ? "Gubby's Journal" : 'Lore Fragments'}</h4>
                                        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">${activeTab === 'fragments' ? state.unlockedLore.length + ' / ' + LORE_FRAGMENTS.length + ' discovered' : 'Personal notes. Found near the clicking station.'}</p>
                                    </div>
                                    <button onclick="updateState({showFragmentsModal:false,showJournalModal:false})" class="text-slate-500 hover:text-slate-900 text-3xl font-black">✕</button>
                                </div>
                                <!-- Tabs -->
                                <div class="flex flex-shrink-0 px-6 pt-4 gap-2 bg-white">
                                    <button onclick="updateState({showFragmentsModal:true,showJournalModal:false})" class="flex-1 py-3 font-black uppercase text-sm tracking-widest border-4 ${activeTab==='fragments'?'bg-indigo-600 border-indigo-700 border-b-0 text-white':'bg-white border-slate-200 border-b-slate-300 text-slate-500 hover:bg-slate-50'}">Fragments</button>
                                    <button onclick="${allSix ? 'updateState({showFragmentsModal:false,showJournalModal:true})' : ''}" class="flex-1 py-3 font-black uppercase text-sm tracking-widest border-4 ${activeTab==='journal'?'bg-indigo-600 border-indigo-700 border-b-0 text-white':allSix?'bg-white border-slate-200 border-b-slate-300 text-slate-500 hover:bg-slate-50':'bg-slate-50 border-slate-200 border-b-slate-300 text-slate-300 cursor-not-allowed'}">Journal</button>
                                </div>
                                <!-- Content -->
                                <div class="overflow-y-auto flex-1 px-8 py-6 flex flex-col gap-4" style="${activeTab==='journal'?'background:linear-gradient(#fffdf5,#fff9e6);':''}">
                                    ${activeTab === 'fragments' ? `
                                        ${LORE_FRAGMENTS.filter(f=>!f.secret).map(f => {
                                            const found = state.unlockedLore.includes(f.id);
                                            return `<div class="border-4 ${found?'border-amber-400 bg-amber-50':'border-slate-200 bg-slate-50'} p-4">
                                                <div class="flex justify-between items-start mb-2 gap-4">
                                                    <p class="text-xs font-black uppercase tracking-widest flex-shrink-0 ${found?'text-amber-600':'text-slate-400'}">${found?'Discovered':'Undiscovered'}</p>
                                                    <span class="text-xs font-bold text-right ${found?'text-slate-400':'text-slate-300'} italic">${f.hint}</span>
                                                </div>
                                                <p class="font-bold text-sm leading-relaxed ${found?'text-slate-800 italic':'text-slate-300'}">${found?f.text:'??? ??? ??? ??? ???'}</p>
                                            </div>`;
                                        }).join('')}
                                        ${(() => {
                                            const f6 = LORE_FRAGMENTS.find(f=>f.secret);
                                            if (!f6) return '';
                                            const found = state.unlockedLore.includes(f6.id);
                                            return `<div class="border-4 ${found?'border-violet-500 bg-violet-50':'border-slate-300 bg-slate-100'} p-4">
                                                <div class="flex justify-between items-start mb-2 gap-4">
                                                    <p class="text-xs font-black uppercase tracking-widest flex-shrink-0 ${found?'text-violet-600':'text-slate-400'}">${found?'Secret Fragment':'??? Secret Fragment'}</p>
                                                    <span class="text-xs font-bold text-right ${found?'text-slate-400':'text-slate-300'} italic">${found?f6.hint:'Unknown'}</span>
                                                </div>
                                                <p class="font-bold text-sm leading-relaxed ${found?'text-violet-900 italic':'text-slate-300'}">${found?f6.text:'??? ??? ??? ??? ???'}</p>
                                            </div>`;
                                        })()}
                                    ` : `
                                        ${JOURNAL_ENTRIES.map((entry, i) => `
                                            <div class="border-l-4 border-amber-400 pl-5">
                                                <div class="flex items-baseline gap-3 mb-2">
                                                    <p class="font-black text-base uppercase text-slate-900">${entry.title}</p>
                                                    <span class="text-xs font-bold text-amber-500 italic">${entry.date}</span>
                                                </div>
                                                <p class="text-sm font-bold leading-relaxed text-slate-700 italic">"${entry.text}"</p>
                                            </div>
                                            ${i < JOURNAL_ENTRIES.length-1 ? '<div class="border-t-2 border-dashed border-amber-100"></div>' : ''}
                                        `).join('')}
                                    `}
                                </div>
                            </div>
                        </div>`;
                    })() : ''}

                    <!-- HEADER -->
                    <header class="z-10 w-full max-w-6xl mb-4">
                        <div class="flex gap-6 items-center justify-center mb-4">
                            <img src="https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png" alt="" class="h-16 sm:h-20" style="image-rendering:pixelated;transform:scaleX(-1);" />
                            <span onclick="triggerTitleClick()" class="cursor-help active:scale-95 transition-transform select-none font-black uppercase tracking-wide text-4xl sm:text-6xl" style="color:${currentWorld?.id==='medieval'||currentWorld?.id==='forest'?'#fff':'#000'};text-shadow:3px 3px 0 rgba(0,0,0,0.1);">Gubby Clicker</span>
                            <img src="https://images.vexels.com/media/users/3/234958/isolated/lists/9c8eb5a83491aac23768e982ddb86705-stars-decoration-doodle.png" alt="" class="h-16 sm:h-20" style="image-rendering:pixelated;" />
                        </div>
                        <div class="w-full max-w-6xl flex gap-3 mb-2 flex-wrap">
                            <span class="pixel-badge bg-indigo-600 border-indigo-800 text-white flex-1 text-center">${state.infinityRebirth?'Prestige ∞':`Prestige ${state.prestigeLevel}`}</span>
                            <span class="pixel-badge bg-amber-500 border-amber-700 text-white flex-1 text-center">${currentWorld?.name}</span>
                            ${state.demonMode?`<span class="pixel-badge bg-red-700 border-red-900 text-white flex-1 text-center" style="text-shadow:0 0 8px rgba(255,0,0,0.8);">Demon Mode</span>`:''}

                        </div>

                        <div class="w-full max-w-6xl pixel-card mt-2 px-4 sm:px-8 py-4 sm:py-6 flex flex-col sm:flex-row flex-wrap items-center justify-between gap-4 sm:gap-6">
                            <div class="flex items-center gap-3 sm:gap-6 flex-1 flex-wrap justify-center w-full sm:w-auto sm:justify-start stats-row">
                                <div class="stat-display"><p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Clicks</p><span class="clicks-live text-lg sm:text-2xl font-black text-slate-900">${formatLargeNumber(state.clicks, 0)}</span></div>
                                <div class="stat-display"><p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">Market</p><span class="market-rate-live text-lg sm:text-2xl font-black"><span class="${state.marketMultiplier >= 1.2 ? 'text-emerald-600' : 'text-slate-900'}">${state.marketMultiplier.toFixed(2)}x</span></span></div>
                                <div class="stat-display"><p class="text-[10px] sm:text-xs font-black text-slate-500 uppercase mb-1 tracking-wider">${currentCurrency.name}s</p><span class="text-lg sm:text-2xl font-black text-slate-900">${formatLargeNumber(state.gold, 2)}</span></div>
                            </div>
                            <div class="flex items-center gap-3 sm:gap-4 flex-wrap justify-center w-full sm:w-auto sell-ascend-row">
                                <button onclick="ascend()" ${state.gold < currentPrestigeCost?'disabled':''} class="px-4 sm:px-6 py-2 sm:py-3 font-black uppercase text-xs sm:text-sm tracking-widest pixel-button ${state.gold >= currentPrestigeCost?'bg-indigo-600 border-indigo-800 text-white':'bg-slate-200 border-slate-400 text-slate-400'}">Ascend<br/><span class="text-xs">(${formatCost(currentPrestigeCost)})</span></button>
                                <button onclick="sellClicks()" class="px-6 sm:px-8 py-3 sm:py-4 font-black uppercase text-base sm:text-lg tracking-widest pixel-button ${state.marketMultiplier >= 1.2 ? 'bg-emerald-400 border-emerald-600 text-white' + (state.marketFlash !== false ? ' animate-pulse' : '') : 'bg-yellow-400 border-yellow-600 text-slate-900'}">Sell!</button>
                            </div>
                        </div>
                    </header>

                    <!-- GUBBY -->
                    <main class="z-10 relative flex flex-col items-center justify-center w-full mb-4">
                        <div class="h-16 mb-2 flex flex-col items-center justify-end">
                            ${state.activeBuff ? `<div class="bg-white px-8 py-3 border-4 border-indigo-500" style="box-shadow:4px 4px 0 rgba(0,0,0,0.2);"><span class="buff-timer-display text-sm font-black uppercase text-indigo-600 tracking-wider">${state.activeBuff.name} (${state.activeBuff.timeLeft}s)</span></div>` : ''}
                        </div>
                        <div class="gubby-float">
                            <div onmousedown="handleMainClick(event)" ontouchstart="handleMainClick(event)" class="gubby-container w-72 h-72 flex items-center justify-center">
                                <img src="${getGubbyImgUrl()}" class="w-full h-full object-contain pointer-events-none" style="filter:drop-shadow(0 10px 20px rgba(0,0,0,0.3));" />
                            </div>
                        </div>

                    </main>

                    <!-- ACTION BUTTONS -->
                    <div class="z-20 w-full max-w-6xl flex gap-6 justify-center mb-4 px-4 flex-col sm:flex-row actions-grid">
                        <button onclick="updateState({showMarketModal:true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1">
                            <i data-lucide="shopping-cart" class="w-12 h-12 text-indigo-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Marketplace</span>
                            <span class="text-xs font-bold text-slate-500">Buy Power-Ups</span>
                        </button>
                        <button onclick="updateState({showStorageModal:true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 relative">
                            <i data-lucide="package" class="w-12 h-12 text-emerald-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Storage</span>
                            <span class="text-xs font-bold text-slate-500">${totalItems} Items</span>
                            ${totalItems > 0 ? `<span class="absolute -top-2 -right-2 bg-red-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow:3px 3px 0 rgba(0,0,0,0.3);">${totalItems}</span>` : ''}
                        </button>
                        <button onclick="updateState({showQuestModal:true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 relative">
                            <i data-lucide="scroll-text" class="w-12 h-12 text-amber-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Quests</span>
                            <span class="text-xs font-bold text-slate-500">${state.completedQuests} Completed</span>
                            ${state.activeQuests.some(q=>q.completed) ? `<span class="absolute -top-2 -right-2 bg-emerald-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow:3px 3px 0 rgba(0,0,0,0.3);"><i data-lucide="check" class="w-6 h-6"></i></span>` : state.activeQuests.length > 0 ? `<span class="absolute -top-2 -right-2 bg-amber-500 border-3 border-white text-white text-sm font-black w-10 h-10 flex items-center justify-center" style="box-shadow:3px 3px 0 rgba(0,0,0,0.3);">${state.activeQuests.length}</span>` : ''}
                        </button>
                        <button onclick="updateState({showFragmentsModal:true})" class="action-button px-10 py-6 flex flex-col items-center gap-2 flex-1 relative">
                            <i data-lucide="book-marked" class="w-12 h-12 text-violet-600"></i>
                            <span class="font-black text-lg uppercase text-slate-900">Fragments</span>
                            <span class="text-xs font-bold text-slate-500">${state.unlockedLore.length} / ${LORE_FRAGMENTS.length}${state.unlockedLore.length === LORE_FRAGMENTS.length ? ' · Journal Unlocked' : ''}</span>
                        </button>
                    </div>

                </div>
            `;
            lucide.createIcons();
            if (prevActiveId === 'admin-input') {
                const el = document.getElementById('admin-input');
                if (el) { el.focus(); el.value = prevValue; el.setSelectionRange(prevValue.length, prevValue.length); }
            } else if (state.showAdmin) {
                const el = document.getElementById('admin-input');
                if (el) el.focus();
            }
        }

        // ── LOADING SCREEN ───────────────────────────────────────
        let loadingClickCount = 0;
        const DEMON_CLICKS_NEEDED = 5;
        let demonFlashInterval = null;
        let _spinDeg = 0, _spinSpeed = 1.5, _spinRaf = null;

        function startSpinLoop() {
            const img = document.getElementById('loading-gubby-spin'); if (!img) return;
            function frame() { _spinDeg = (_spinDeg + _spinSpeed) % 360; img.style.transform = `rotate(${_spinDeg}deg)`; _spinRaf = requestAnimationFrame(frame); }
            _spinRaf = requestAnimationFrame(frame);
        }
        function stopSpinLoop() { if (_spinRaf) { cancelAnimationFrame(_spinRaf); _spinRaf = null; } }

        let _loadProgress = 0, _loadBarInterval = null;
        function startLoadingBar() {
            const bar = document.getElementById('loading-bar-fill'); if (!bar) return;
            _loadBarInterval = setInterval(() => {
                const target = state.loadingDone ? 100 : 90;
                const step = _loadProgress < 60 ? 2.5 : _loadProgress < 85 ? 1 : 0.3;
                _loadProgress = Math.min(target, _loadProgress + step);
                bar.style.width = _loadProgress + '%';
                if (_loadProgress >= 100) clearInterval(_loadBarInterval);
            }, 60);
        }

        function loadingGubbyClick() {
            loadingClickCount++;
            const hint = document.getElementById('loading-click-hint');
            const img = document.getElementById('loading-gubby-spin');
            if (loadingClickCount >= DEMON_CLICKS_NEEDED) {
                _spinSpeed = 25;
                img.style.filter = 'drop-shadow(0 0 40px rgba(220,38,38,1)) hue-rotate(300deg)';
                hint.textContent = '...'; hint.classList.remove('heating');
                document.getElementById('loading-screen').style.backgroundColor = '#1a0000';
                _loadProgress = 100; const bar = document.getElementById('loading-bar-fill'); if (bar) bar.style.width = '100%';
                setTimeout(() => {
                    stopSpinLoop(); clearInterval(_loadBarInterval);
                    document.getElementById('loading-screen').classList.add('fade-out');
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        document.getElementById('demon-intro').style.display = 'flex';
                        updateState({ demonMode: true, loadingDone: true });
                    }, 600);
                }, 400);
            } else {
                _spinSpeed = 1.5 + loadingClickCount * 1.8;
                hint.classList.add('heating');
                hint.textContent = ['hmm?','hey!','stop it!',"don't..."][loadingClickCount-1] || '';
                img.style.filter = `drop-shadow(0 0 ${loadingClickCount*8}px rgba(220,38,38,${0.15+loadingClickCount*0.17}))`;
            }
        }

        function finishLoading() {
            if (state.loadingDone) return;
            loadGame();
            createFloatingStars();
            _loadProgress = 100; const bar = document.getElementById('loading-bar-fill'); if (bar) bar.style.width = '100%';
            clearInterval(_loadBarInterval);
            setTimeout(() => {
                stopSpinLoop();
                const screen = document.getElementById('loading-screen');
                screen.classList.add('fade-out');
                setTimeout(() => { screen.style.display = 'none'; updateState({ loadingDone: true }); }, 600);
            }, 150);
        }

        function closeDemonIntro() {
            document.getElementById('demon-intro').style.display = 'none';
            startDemonFlash();
        }
        function startDemonFlash() {
            if (demonFlashInterval) return;
            document.querySelectorAll('.floating-star').forEach(s => s.remove());
            createFloatingStars();
            const flash = document.getElementById('demon-flash');
            function doFlash() { flash.classList.remove('flashing'); void flash.offsetWidth; flash.classList.add('flashing'); }
            doFlash();
            demonFlashInterval = setInterval(doFlash, 4000 + Math.random() * 3000);
        }

    </script>
</body>
</html>
